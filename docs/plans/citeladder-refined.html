function btn(text, action='', cls='', ico='', extra='') {

}

// Prototype chart presentation only. Numbers/series are the original fixtures.
// Responsive SVG coordinates keep 12px labels readable instead of scaling a 720px SVG down.
function lineChart(values,opts={}) {
 const spec={kind:'line',values,opts};
 return `<svg class="chart" data-chart="${attr(JSON.stringify(spec))}" style="--chart-height:${opts.height||220}px" role="img" aria-label="Sample trend from ${values[0]} to ${values.at(-1)}"></svg>`;
}
function dualChart() {
 const spec={kind:'dual',values:[22,29,34,30,47,41,57,64,71,75,88,96,105,118,126],secondary:[9,12,14,12,18,17,20,23,28,31,35,38,41,45,48],opts:{height:220}};
 return `<svg class="chart" data-chart="${attr(JSON.stringify(spec))}" style="--chart-height:220px" role="img" aria-label="Sample clicks and impressions. Separate labeled axes: clicks 0 to 150; impressions 0 to 60."></svg>`;
}
function paintChart(el) {
 const {kind,values,secondary,opts}=JSON.parse(el.dataset.chart);
 const w=Math.max(240,Math.round(el.getBoundingClientRect().width));
 const h=opts.height||220, dual=kind==='dual';
 const left=opts.showY===false?4:34,right=dual?32:8,top=16,bottom=28;
 const min=dual?0:opts.min??0,max=dual?150:opts.max??Math.max(...values,1),range=max-min||1;
 const point=(v,i,n,m=max)=>([left+i*(w-left-right)/(n-1||1),top+(1-(v-min)/(m-min||1))*(h-top-bottom)]);
 const points=values.map((v,i)=>point(v,i,values.length));
 const path=ps=>ps.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(2)} ${p[1].toFixed(2)}`).join(' ');
 const ys=[0,.5,1].map(t=>top+t*(h-top-bottom));
 const grid=ys.map(y=>`<line x1="${left}" y1="${y}" x2="${w-right}" y2="${y}" stroke="var(--chart-grid)" stroke-width="1"/>`).join('');
 const axis=opts.showY===false?'':ys.map((y,i)=>`<text x="${left-8}" y="${y+4}" text-anchor="end">${Math.round(max-i*range/2)}</text>`).join('');
 const axisR=dual?ys.map((y,i)=>`<text x="${w-right+8}" y="${y+4}">${60-i*30}</text>`).join(''):'';
 let ls=dual?['Aug 9','Aug 17','Aug 25','Sep 5']:(opts.labels||[]);
 if(w<430&&ls.length>3) ls=[ls[0],ls[Math.floor(ls.length/2)],ls.at(-1)];
 const labels=ls.map((label,i)=>`<text x="${left+i*(w-left-right)/(ls.length-1||1)}" y="${h-4}" text-anchor="${i===0?'start':i===ls.length-1?'end':'middle'}">${esc(label)}</text>`).join('');
 const secondaryPath=dual?`<path d="${path(secondary.map((v,i)=>point(v,i,secondary.length,60)))}" fill="none" stroke="var(--chart-secondary)" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>`:'';
 el.setAttribute('viewBox',`0 0 ${w} ${h}`);
 el.innerHTML=`${grid}${axis}${axisR}<path d="${path(points)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${secondaryPath}<circle cx="${points.at(-1)[0]}" cy="${points.at(-1)[1]}" r="3" fill="var(--accent)" stroke="white" stroke-width="1.5"/>${labels}`;
}
let chartObserver;
function hydrateCharts() {
 chartObserver?.disconnect();
 chartObserver=new ResizeObserver(entries=>entries.forEach(e=>paintChart(e.target)));
 document.querySelectorAll('[data-chart]').forEach(el=>{paintChart(el);chartObserver.observe(el);});
}

function updateFontReadiness() {
 const el=document.getElementById('font-readiness');if(!el)return;
 const ready=[...document.fonts].some(f=>f.family.replace(/["']/g,'')==='Geist'&&f.status==='loaded');
 el.textContent=ready?'Geist is loaded. This browser is displaying the specified typeface.':'Geist is not loaded yet. The HTML requests Google Fonts; allow it to load before visual approval. A fallback is not a typography baseline.';
}

function contractText() { return `CiteLadder UI 1.0 — frozen visual implementation reference\n\nImplement the supplied HTML, canonical CSS and token manifest. Do not design a new interface.\n\n`+DESIGN_CONTRACT.lockedRules.map((r,i)=>`${i+1}. ${r}`).join('\n\n')+`\n\nRead the attached production consolidation plan for current owner mapping and behavior boundaries. Tokens/styles in this version supersede Section 5 only after owner approval. The original repository must still be re-baselined before implementation.\n\nStart with existing tokens/typography and the shell; then Overview, Website, Issues, Content. Compare identical fixture states at 1440×900, 1280×720, 768×1024 and 390×844 before continuing. No new UI dependency or compatibility wrapper.\n`;
}
function exportTokens() {
 const blob=new Blob([JSON.stringify(DESIGN_CONTRACT,null,2)],{type:'application/json'});
 const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='citeladder-design-system.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Design-system manifest exported.');
}
function rememberFocus() {
 if(state.modal||state.drawer)return;
 const e=document.activeElement;state.returnFocus={element:e,action:e?.dataset?.action,value:e?.dataset?.value};
}
function restoreFocus() {
 const saved=state.returnFocus;state.returnFocus=null;
 requestAnimationFrame(()=>{
  let el=saved?.element?.isConnected?saved.element:null;
  if(!el&&saved?.action)el=[...document.querySelectorAll('[data-action]')].find(x=>x.dataset.action===saved.action&&x.dataset.value===saved.value&&x.getClientRects().length);
  if(!el||!el.getClientRects().length)el=document.querySelector('.mobile-topbar .mobile-menu')||document.querySelector('.nav-link.active');
  el?.focus({preventScroll:true});
 });
}
function syncSurfaceAccess() {
 const app=document.getElementById('app'),modal=!!(state.modal||state.drawer);
 app.inert=modal;
 const compact=window.innerWidth<=980;
 const side=document.querySelector('.sidebar');if(side)side.inert=compact&&!state.mobile;
 const main=document.querySelector('.app-main');if(main)main.inert=compact&&state.mobile;
 document.body.style.overflow=modal||(compact&&state.mobile)?'hidden':'';
 const toggle=document.querySelector('[data-action="toggleMobile"]');toggle?.setAttribute('aria-expanded',String(state.mobile));
 if(side&&compact&&state.mobile){side.setAttribute('role','dialog');side.setAttribute('aria-modal','true');}
 document.querySelectorAll('.page-tabs').forEach(el=>{el.setAttribute('aria-label','Page sections');el.querySelectorAll('[role="tab"]').forEach(t=>t.tabIndex=t.getAttribute('aria-selected')==='true'?0:-1);});

 if(action==='generateContent'){
  const t=document.getElementById('content-instruction');if(!t||!t.value.trim()){if(t){t.setAttribute('aria-invalid','true');t.focus();}toast('Enter an instruction to preview a draft.');return;}
  state.contentFields={page:document.getElementById('content-page')?.value||'',url:document.getElementById('content-url')?.value||'',instruction:t.value};state.contentResult=true;renderView({top:true});toast('Showing an illustrative draft. No AI generation was performed.');return;
 }
 if(action==='copyDraft'){copyText('How to choose a backpack for a multi-day trip\n\nChoosing a backpack for several days away starts with the journey, not just the bag. Consider capacity, fit, and verified product evidence.\n\nSample draft only.');return;}
 if(action==='manageProject'){openModal('manageProject');return;}
 if(action==='editFacts'){openModal('editFacts');return;}
 if(action==='saveFacts'){const name=document.getElementById('fact-name')?.value.trim();if(!name){toast('Enter a company name.');return;}state.projectName=name;state.modal=null;renderView();toast('Sample display name updated for this session. Underlying fixtures remain illustrative.');return;}
 if(action==='managePrompts'){openModal('managePrompts');return;}
 if(action==='addPrompt'){const input=document.getElementById('new-prompt');let p=input?.value.trim();if(!p){toast('Enter a question before adding it.');input?.focus();return;}state.customPrompts.push(p);state.modal={type:'managePrompts'};renderView();toast('Prompt added to the in-memory sample set.');return;}
 if(action==='removePrompt'){state.customPrompts.splice(+value,1);state.modal={type:'managePrompts'};renderView();toast('Sample prompt removed.');return;}
 if(action==='launchAudit'){openModal('launch');return;}
 if(action==='confirmAudit'){
  const selected=[...document.querySelectorAll('input[name="audit-engine"]:checked')].length;if(!selected){toast('Select at least one engine.');return;}
  state.data='populated';state.running=false;state.modal=null;state.demoRuns=state.demoRuns||[];state.demoRuns.unshift({id:'CL-DEMO-'+String(state.demoRuns.length+1).padStart(3,'0'),date:'Just now · Local demo',requested:48,completed:48,failed:0});renderView({top:true});toast('Sample audit completed. No external requests were made.');return;
 }
 if(action==='runCrawl'){state.data='populated';state.tab.website='pages';renderView();toast('Sample crawl loaded. No website was crawled.');return;}
 if(action==='syncData'){toast('Sample source data is already available. No external sync was performed.');return;}
 if(action==='recompute'){toast('Sample findings are up to date. No live computation was performed.');return;}
 if(action==='saveSchedule'){
  const selected=[...document.querySelectorAll('input[name="schedule-engine"]:checked')].length;if(!selected){toast('Select at least one engine.');return;}
  state.scheduled=true;renderView();toast('Sample schedule saved in memory. No background task was created.');return;
 }
 if(action==='removeSchedule'){state.scheduled=false;renderView();toast('Sample schedule removed.');return;}
 if(action==='exportReport'){openModal('export');return;}
 if(action==='downloadCSV'){downloadCSV();return;}
 if(action==='printView'){closeOverlay();window.print();return;}
 if(action==='columns'){generic('Table columns','<p class="small muted">The production table can expose column visibility and sorting preferences. This prototype keeps the important evidence columns visible and allows horizontal overflow for secondary data.</p>');return;}
 if(action==='deleteDemo'){openModal('delete');return;}
 if(action==='confirmDelete'){if(document.getElementById('delete-confirm')?.value!=='DELETE'){toast('Type DELETE to confirm.');return;}state.data='empty';state.modal=null;renderView({top:true});toast('Switched to empty sample state. No live data was deleted.');return;}
 if(action==='billingAction'){generic('Billing preview',notice('Billing, discounts, top-ups, and subscription changes are not connected. Production actions must be authorized and validated server-side.','info'),'No payment is initiated.');return;}
 if(action==='providerConfig'){openDrawer('provider',{name:value});return;}
 if(action==='integrationDetail'){openDrawer('integration',{name:value});return;}
 if(action==='commerceConfig'){state.tab.settings='integrations';navigate('settings');return;}
 if(action==='forgotPassword'){generic('Password reset',notice('Password recovery is not connected in this prototype. The live application must provide a secure, server-managed recovery flow.','info'));return;}
 if(action==='togglePassword'){state.authShow=!state.authShow;renderView({focus:{selector:'#auth-password',pos:state.authValues.password.length}});return;}
 if(action==='googleDemo'){navigate('overview');toast('Opened the sample workspace. No Google authentication was performed.');return;}
 if(action==='onboardBack'){collectOnboard();state.onboardStep=Math.max(1,state.onboardStep-1);renderView();return;}
 if(action==='onboardNext'){
  collectOnboard();if(state.onboardStep===1&&(!state.onboard.brand||!state.onboard.website)){toast('Enter a brand name and website.');return;}
  if(state.onboardStep<3){state.onboardStep++;renderView();window.scrollTo(0,0);}else{state.onboardStep=1;state.data='populated';navigate('overview');toast('Sample onboarding complete. Opening the preloaded Wanderlust workspace.');}return;
 }
 if(action==='legal'){generic(value,'<p class="small muted">This is a local UI prototype, not the live legal document. No cookies, analytics, or account information are stored by the prototype.</p>');return;}
 if(action==='guideAnchor'||action==='marketingAnchor'){document.getElementById(value)?.scrollIntoView({behavior:'smooth',block:'start'});return;}
 if(action==='toastDemo'){toast('Sample interaction. No backend action was performed.');return;}
 if(action==='agentAsk'){const r=document.getElementById('agent-response');if(r)r.innerHTML=`<div class="detail-callout"><p class="eyebrow">Sample agent response</p><p style="margin:7px 0 0">${esc(value)}</p><p class="small muted" style="margin-bottom:0">The production assistant would retrieve authorized project evidence before answering. This prototype does not call an AI model or MCP server.</p></div>`;return;}
}
// Event delegation keeps the UI interactive without a frontend framework.
document.addEventListener('click',e=>{
 const target=e.target.closest('[data-action]');
 if(!target){if(state.popover&&!e.target.closest('.popover')){state.popover=null;renderOverlay();}return;}
 const action=target.dataset.action,value=target.dataset.value;
 if(target.tagName==='A'||target.tagName==='BUTTON')e.preventDefault();
 if(action==='closeOverlay'&&target.classList.contains('scrim')&&e.target!==target)return;
 if(state.popover&&!['dataMenu','projectMenu','userMenu'].includes(action))state.popover=null;
 doAction(action,value,target);
});
document.addEventListener('input',e=>{
 if(e.target.id==='global-search'){state.search.global=e.target.value;const r=document.getElementById('global-results');if(r)r.innerHTML=searchResults();return;}
 if(e.target.dataset.search){const k=e.target.dataset.search;state.search[k]=e.target.value;const pos=e.target.selectionStart;renderView({focus:{selector:`[data-search="${k}"]`,pos}});return;}
 if(e.target.id==='auth-email'||e.target.id==='auth-password'){state.authValues[e.target.id==='auth-email'?'email':'password']=e.target.value;state.authError='';e.target.removeAttribute('aria-invalid');}
 if(e.target.id==='content-instruction')e.target.removeAttribute('aria-invalid');
 if(e.target.id.startsWith('content-')){state.contentFields=state.contentFields||{};const k=e.target.id.replace('content-','');state.contentFields[k]=e.target.value;}
});
document.addEventListener('change',e=>{
 if(e.target.dataset.filter){state.filters[e.target.dataset.filter]=e.target.value;renderView();return;}
 if(e.target.id==='page-kind'){state.filters.pageKind=e.target.value;renderView();return;}
 if(e.target.id.startsWith('on-'))collectOnboard();
});
document.addEventListener('submit',e=>{
 if(e.target.id==='auth-form'){e.preventDefault();const email=document.getElementById('auth-email');if(email?.value&&!email.checkValidity()){state.authError='Enter a valid email address or leave the demo fields empty.';renderView({focus:{selector:'#auth-email',pos:state.authValues.email.length}});document.getElementById('auth-email')?.setAttribute('aria-invalid','true');return;}navigate('overview');toast('Opened the sample workspace. No authentication was performed.');}
 else e.preventDefault();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&state.mobile&&!state.modal&&!state.drawer&&!state.popover){e.preventDefault();doAction('closeMobile');return;}
 const focusRoot=document.querySelector('#overlay-root [role="dialog"]')||(state.mobile?document.querySelector('.sidebar.open'):null);
 if(e.key==='Tab'&&focusRoot){
  const items=[...focusRoot.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex="0"]')].filter(x=>x.getClientRects().length);
  const first=items[0],last=items.at(-1),active=document.activeElement;
  if(e.shiftKey&&(active===first||!focusRoot.contains(active))){e.preventDefault();last?.focus();return;}
  if(!e.shiftKey&&(active===last||!focusRoot.contains(active))){e.preventDefault();first?.focus();return;}
 }
 if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)&&e.target.matches('[role="tab"]')){
  e.preventDefault();const current=e.target,items=[...current.parentElement.querySelectorAll('[role="tab"]')];
  const i=items.indexOf(current),next=e.key==='Home'?0:e.key==='End'?items.length-1:(i+(e.key==='ArrowRight'?1:-1)+items.length)%items.length;
  const action=items[next].dataset.action,value=items[next].dataset.value;doAction(action,value,items[next]);
  document.querySelector(`[data-action="${action}"][data-value="${value}"]`)?.focus({preventScroll:true});return;
 }
 if(state.modal?.type==='search'&&['ArrowDown','ArrowUp'].includes(e.key)){
  const items=[...document.querySelectorAll('#global-results [data-action="navigate"]')];if(items.length){e.preventDefault();const i=items.indexOf(document.activeElement);items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();}return;
 }

 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.search.global='';openModal('search');return;}
 if(e.key==='Escape'&&(state.modal||state.drawer||state.popover)){e.preventDefault();closeOverlay();return;}
 if(e.key==='Enter'&&state.modal?.type==='search'&&document.activeElement?.id==='global-search'){const first=document.querySelector('#global-results [data-action="navigate"]');if(first){e.preventDefault();navigate(first.dataset.value);}}
});
window.addEventListener('popstate',()=>{const r=location.hash.slice(1);state.route=pageNames[r]?r:'overview';state.modal=null;state.drawer=null;state.popover=null;renderView({top:true});});
window.addEventListener('resize',()=>{if(state.popover){state.popover=null;renderOverlay();}if(window.innerWidth>980&&state.mobile){state.mobile=false;renderView();}syncSurfaceAccess();});
document.fonts.addEventListener('loadingdone',updateFontReadiness);
// Initialize from a shareable route hash. No localStorage, cookies, or persistence.
const start=location.hash.slice(1);state.route=pageNames[start]?start:'overview';
renderView({top:true});
</script>
</body>
</html>

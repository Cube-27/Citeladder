# CiteLadder local stack: PostgreSQL, migration, backend, workers, and frontend.
#
# =============================================================================
# GOTCHA 1 (docs/invariants.md invariant 11) — READ BEFORE `docker compose up`
# =============================================================================
# This machine exports POSTGRES_PASSWORD / POSTGRES_USER / POSTGRES_DB /
# DATABASE_URL into EVERY shell. Compose resolves ${VAR} from the shell
# environment BEFORE .env, so those inherited shell values silently override
# the repo .env values (env_file: only injects vars INSIDE the container, not
# into ${VAR} interpolation). Bring the stack up with the shell vars unset and
# the repo password re-supplied explicitly:
#
#   env -u POSTGRES_PASSWORD -u POSTGRES_USER -u POSTGRES_DB -u DATABASE_URL \
#     POSTGRES_PASSWORD=<repo-.env-value> \
#     docker compose --env-file .env -f docker-compose.yml up -d --force-recreate
#
# Compose reads the root .env by default; copy .env.example -> .env.
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citeladder}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-citeladder}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Applies migrations once, then exits; web + worker wait on its success.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - ${CITELADDER_ENV_FILE:-.env}
    environment: &backend_env
      APP_ENV: ${APP_ENV:-development}
      # skipcq: SCT-A000 - password comes from environment, not hardcoded.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-citeladder}
    depends_on:
      db:
        condition: service_healthy
    command: ["/bin/sh", "-c", "alembic upgrade head && python -m app.demo.bootstrap"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${CITELADDER_ENV_FILE:-.env}
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_REQUEST_TIMEOUT_MS: ${NEXT_PUBLIC_API_REQUEST_TIMEOUT_MS:-}
    restart: unless-stopped
    environment:
      # Astro reads the canonical origin on every request so metadata, robots,
      # and the sitemap remain correct after a restart without an image rebuild.
      # BACKEND_ORIGIN stays server-only and lets the local marketing server
      # preserve the same-origin API proxy. No env_file: the service must not
      # receive backend secrets.
      BACKEND_ORIGIN: http://web:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      DEMO_BOOKING_URL: ${DEMO_BOOKING_URL:-}
      PUBLIC_SALES_EMAIL: ${PUBLIC_SALES_EMAIL:-}
    depends_on:
      web:
        condition: service_healthy
  # One browser origin for marketing, account/product routes, and API requests.
  # Reuse the production route table so a local login exercises the same split.
  ingress:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      BACKEND_ORIGIN: web:8000
      VITE_ORIGIN: vite-app:3001
      MARKETING_ORIGIN: frontend:3000
    volumes:
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/gcp/runtime/frontend-routes.caddy:/etc/caddy/frontend-routes.caddy:ro
    depends_on:
      frontend:
        condition: service_healthy
      vite-app:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Authenticated Vite application is required by the default stack.
  vite-app:
    build:
      context: .
      dockerfile: frontend/apps/app/Dockerfile
      args:
        NEXT_PUBLIC_API_REQUEST_TIMEOUT_MS: ${NEXT_PUBLIC_API_REQUEST_TIMEOUT_MS:-}
        NEXT_PUBLIC_BOOTSTRAP_READ_TIMEOUT_MS: ${NEXT_PUBLIC_BOOTSTRAP_READ_TIMEOUT_MS:-}
        NEXT_PUBLIC_LOGO_DEV_PUBLISHABLE: ${NEXT_PUBLIC_LOGO_DEV_PUBLISHABLE:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    restart: unless-stopped
    environment:
      # Caddy consumes this only at runtime; it is never bundled for browsers.
      BACKEND_ORIGIN: http://web:8000
    depends_on:
      web:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${CITELADDER_ENV_FILE:-.env}
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Audit worker is a separate Postgres-queue process.
    command: ["python", "-m", "app.workers.audit_worker"]
    # The Dockerfile HEALTHCHECK probes the web /ready endpoint, which worker
    # containers don't serve — disable it so they don't report unhealthy.
    healthcheck:
      disable: true

  # Claims due recurring schedules and delegates every slot to the same audit
  # planner used by manual runs. The unique schedule slot prevents duplicates.
  audit-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${CITELADDER_ENV_FILE:-.env}
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.audit_scheduler"]
    healthcheck:
      disable: true

  # Site Health worker: claims site crawl (discover) tasks from the Postgres
  # queue — the dedicated process app/workers/site_health_worker.py expects.
  site-health-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${CITELADDER_ENV_FILE:-.env}
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.site_health_worker"]
    healthcheck:
      disable: true

  # Persisted onboarding discovery: one secure homepage request, structured
  # application-model research, then deterministic industry-library fallback.
  brand-discovery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${CITELADDER_ENV_FILE:-.env}
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.brand_discovery_worker"]
    healthcheck:
      disable: true

  # Content-generation worker: claims content_generations queue rows and calls
  # the separately configured content provider.
  content-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${CITELADDER_ENV_FILE:-.env}
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.content_worker"]
    healthcheck:
      disable: true

  # Growth Agent reconciler: advances runs that are waiting on existing
  # content/audit queues. It performs no provider I/O and owns no second queue.
  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${CITELADDER_ENV_FILE:-.env}
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.agent_worker"]
    healthcheck:
      disable: true

  # Analytics worker: claims analytics_tasks queue rows and runs the
  # registered per-kind projection executor (no network I/O — invariant 7).
  analytics-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${CITELADDER_ENV_FILE:-.env}
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.analytics_worker"]
    healthcheck:
      disable: true

  # Queue sweeper: reclaims expired leases across EVERY queue. Each worker
  # already sweeps its own queue, but a worker killed after mark_running
  # leaves its row at `running` with nothing alive to reclaim it -- which
  # surfaced as a Commerce discovery that polled "running" forever. Owns no
  # queue and runs no executors, so it is safe to run beside the workers.
  queue-sweeper:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${CITELADDER_ENV_FILE:-.env}
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.queue_sweeper"]
    healthcheck:
      disable: true

  # Integrations sync worker: claims integration_sync_runs queue rows, pages
  # the provider data APIs (GSC/GA4/Bing) with the grant's OAuth token, and
  # writes immutable import artifacts + derived metric rows.
  integration-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${CITELADDER_ENV_FILE:-.env}
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.integration_worker"]
    healthcheck:
      disable: true

  # Integrations dispatcher: the one-owner periodic scheduler — enqueues a
  # scheduled sync run per active connection per cadence (deduped by the
  # active-window index) and retries pending_revocation grant revokes.
  integration-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${CITELADDER_ENV_FILE:-.env}
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.integration_dispatcher"]
    healthcheck:
      disable: true

volumes:
  pg_data:

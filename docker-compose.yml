# CiteLadder local stack: PostgreSQL, migration, API, runner and the three Workers.
#
# =============================================================================
# GOTCHA 1 (docs/invariants.md invariant 11) — READ BEFORE `docker compose up`
# =============================================================================
# This machine exports POSTGRES_PASSWORD / POSTGRES_USER / POSTGRES_DB /
# DATABASE_URL into EVERY shell. Compose resolves ${VAR} from the shell
# environment BEFORE .env, so those inherited shell values silently override
# the repo .env values (env_file: only injects vars INSIDE the container, not
# into ${VAR} interpolation). Bring the stack up with the shell vars unset and
# the repo password re-supplied explicitly:
#
#   env -u POSTGRES_PASSWORD -u POSTGRES_USER -u POSTGRES_DB -u DATABASE_URL \
#     POSTGRES_PASSWORD=<repo-.env-value> \
#     docker compose --env-file .env -f docker-compose.yml up -d --force-recreate
#
# Compose reads the root .env by default; copy .env.example -> .env.
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citeladder}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-citeladder}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Applies the SQL baseline and native bootstrap once, then exits; API +
  # workers wait on its success. Same image as the API, as in production.
  migrate:
    build:
      context: .
      dockerfile: frontend/services/api/Dockerfile
    restart: 'no'
    env_file:
      - ${CITELADDER_ENV_FILE:-.env}
    environment: &service_env
      APP_ENV: ${APP_ENV:-development}
      # OAuth redirects and invitation links target the local app Worker.
      FRONTEND_URL: http://127.0.0.1:3001
      # skipcq: SCT-A000 - password comes from environment, not hardcoded.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-citeladder}
    depends_on:
      db:
        condition: service_healthy
    command: ['/bin/sh', '-c', 'node src/cli/migrate.ts && exec node src/cli/bootstrap-account.ts']

  # Each Worker runs under `wrangler dev` as production serves it:
  # marketing http://127.0.0.1:3000, app http://127.0.0.1:3001 (proxies /api
  # to the API container), docs http://127.0.0.1:4322.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_REQUEST_TIMEOUT_MS: ${NEXT_PUBLIC_API_REQUEST_TIMEOUT_MS:-}
        PUBLIC_WEBSITE_ORIGIN: http://127.0.0.1:3000
        PUBLIC_APP_ORIGIN: http://127.0.0.1:3001
        PUBLIC_DOCS_ORIGIN: http://127.0.0.1:4322
    restart: unless-stopped
    environment:
      # Canonical website URLs are baked into the build; rebuild after changes.
      # Wrangler runs the local Worker with an isolated API-container upstream.
      # No env_file: the service must not receive backend secrets.
      PUBLIC_WEBSITE_ORIGIN: http://127.0.0.1:3000
      PUBLIC_APP_ORIGIN: http://127.0.0.1:3001
      DEMO_BOOKING_URL: ${DEMO_BOOKING_URL:-}
      PUBLIC_SALES_EMAIL: ${PUBLIC_SALES_EMAIL:-}
    depends_on:
      api-service:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'

  docs:
    build:
      context: .
      dockerfile: frontend/apps/docs/Dockerfile
      args:
        PUBLIC_WEBSITE_ORIGIN: http://127.0.0.1:3000
        PUBLIC_APP_ORIGIN: http://127.0.0.1:3001
        PUBLIC_DOCS_ORIGIN: http://127.0.0.1:4322
    restart: unless-stopped
    ports:
      - '127.0.0.1:4322:4322'

  vite-app:
    build:
      context: .
      dockerfile: frontend/apps/app/Dockerfile
      args:
        NEXT_PUBLIC_API_REQUEST_TIMEOUT_MS: ${NEXT_PUBLIC_API_REQUEST_TIMEOUT_MS:-}
        NEXT_PUBLIC_BOOTSTRAP_READ_TIMEOUT_MS: ${NEXT_PUBLIC_BOOTSTRAP_READ_TIMEOUT_MS:-}
        NEXT_PUBLIC_LOGO_DEV_PUBLISHABLE: ${NEXT_PUBLIC_LOGO_DEV_PUBLISHABLE:-}
        PUBLIC_WEBSITE_ORIGIN: http://127.0.0.1:3000
        PUBLIC_APP_ORIGIN: http://127.0.0.1:3001
        PUBLIC_DOCS_ORIGIN: http://127.0.0.1:4322
    restart: unless-stopped
    depends_on:
      api-service:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001'

  # Production runs the same image as Cloud Run jobs: the API starts a runner
  # after committed work and Cloud Scheduler starts a tick. Locally one service
  # repeats the tick (periodic owners, then drain) until stopped.
  runner:
    build:
      context: .
      dockerfile: frontend/services/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ${CITELADDER_ENV_FILE:-.env}
    environment: *service_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # A failing tick ends the loop, so Compose restarts and surfaces it.
    command: ['/bin/sh', '-c', 'while true; do node src/tick.ts || exit $?; sleep 10; done']
    healthcheck:
      disable: true

  # The native API serves every application route family and issues sessions.
  # The app Worker proxies /api/* here; the migrate service owns its schema.
  api-service:
    build:
      context: .
      dockerfile: frontend/services/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ${CITELADDER_ENV_FILE:-.env}
    environment: *service_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Loopback only: nothing may reach this service except from this host.
      - '127.0.0.1:8100:8100'

volumes:
  pg_data:

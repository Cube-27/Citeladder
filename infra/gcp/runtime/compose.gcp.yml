name: citeladder-demo

x-backend: &backend
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable digest}
  network_mode: host
  restart: unless-stopped
  env_file:
    - path: runtime.env
      required: ${RUNTIME_ENV_REQUIRED:-true}
  environment: &backend_environment
    APP_ENV: production
    # Public by default; "true" restores the single-account demo, which refuses
    # both registration and third-party sign-up. DEMO_EXPIRES_AT is optional
    # and arrives through runtime.env when demo mode needs it.
    DEMO_MODE: ${DEMO_MODE:-false}
    DEMO_MONITORED_URL_LIMIT: "50000"
    DEV_LOGIN_EMAIL: ${DEV_LOGIN_EMAIL:?DEV_LOGIN_EMAIL is required}
    MCP_ENABLED: "true"
    MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:?MCP_PUBLIC_BASE_URL is required}
    # Pinned to the provisioned account in demo mode, empty (every account) in
    # a public one. deploy-vm.sh derives it from DEMO_MODE.
    MCP_ALLOWED_ACCOUNT_EMAIL: ${MCP_ALLOWED_ACCOUNT_EMAIL-}
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    DB_SSL_MODE: require
    DB_POOL_SIZE: "8"
    DB_MAX_OVERFLOW: "0"
    AUDIT_WORKER_CONCURRENCY: "2"
    SITE_HEALTH_GLOBAL_CONCURRENCY: "8"
    SITE_HEALTH_PER_HOST_CONCURRENCY: "6"
    SITE_HEALTH_AUTOMATIC_PAGE_LIMIT: "200"
    FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
    FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?FRONTEND_ORIGINS is required}
    # Google sign-in, OFF until the public policies are cleared for open
    # sign-up: a first Google sign-in creates an account. Operator-created
    # client logins use email and password. Set OAUTH_GOOGLE_ENABLED=true on
    # the host to turn it back on.
    # The client id/secret fall back to the INTEGRATION Google pair by design
    # (one client for sign-in and the GSC/GA4 connect); the redirect URI
    # derives from FRONTEND_URL. deploy-vm.sh writes INTEGRATION_GOOGLE_* and
    # INTEGRATION_MICROSOFT_* (Bing) into runtime.env, injected by env_file.
    OAUTH_GOOGLE_ENABLED: ${OAUTH_GOOGLE_ENABLED:-false}
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?TRUSTED_PROXY_CIDRS is required}
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  healthcheck:
    disable: true

services:
  db-tls-init:
    image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
    network_mode: host
    user: "0:0"
    restart: "no"
    volumes:
      - postgres_tls:/tls
      - ./init-postgres-tls.sh:/usr/local/bin/init-postgres-tls.sh:ro
    command: ["/usr/local/bin/init-postgres-tls.sh"]

  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    network_mode: host
    restart: unless-stopped
    environment:
      POSTGRES_DB: citeladder
      POSTGRES_USER: citeladder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_tls:/tls:ro
    depends_on:
      db-tls-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U citeladder -d citeladder"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable digest}
    network_mode: host
    restart: "no"
    env_file:
      - path: runtime.env
        required: ${RUNTIME_ENV_REQUIRED:-true}
    environment:
      <<: *backend_environment
      DEV_LOGIN_PASSWORD: ${DEV_LOGIN_PASSWORD:?DEV_LOGIN_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    # Demo mode enforces one account; public mode provisions/rotates only the
    # configured development account and leaves public accounts untouched.
    command: ["/bin/sh", "-c", "alembic upgrade head && python -m app.demo.bootstrap"]

  web:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "127.0.0.1"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  audit-worker:
    <<: *backend
    image: ${API_SERVICE_IMAGE:?API_SERVICE_IMAGE is required}
    command: ["node", "src/audit-worker.ts"]
  audit-scheduler:
    <<: *backend
    image: ${API_SERVICE_IMAGE:?API_SERVICE_IMAGE is required}
    environment:
      <<: *backend_environment
      AUDIT_SCHEDULE_HEARTBEAT_PATH: /tmp/audit-scheduler-heartbeat
    command: ["node", "src/audit-scheduler.ts"]
  audit-maintenance:
    <<: *backend
    image: ${API_SERVICE_IMAGE:?API_SERVICE_IMAGE is required}
    command: ["node", "src/audit-maintenance.ts"]
  site-health-worker-ts:
    <<: *backend
    image: ${API_SERVICE_IMAGE:?API_SERVICE_IMAGE is required}
    command: ["node", "--experimental-strip-types", "src/site-health-worker.ts"]
  brand-discovery-worker:
    <<: *backend
    image: ${API_SERVICE_IMAGE:?API_SERVICE_IMAGE is required}
    command: ["node", "--experimental-strip-types", "src/discovery-worker.ts"]
  agent-worker:
    <<: *backend
    command: ["python", "-m", "app.workers.agent_worker"]
  analytics-worker:
    <<: *backend
    command: ["python", "-m", "app.workers.analytics_worker"]
  queue-sweeper:
    <<: *backend
    command: ["python", "-m", "app.workers.queue_sweeper"]
  integration-worker-ts:
    image: ${API_SERVICE_IMAGE:?API_SERVICE_IMAGE must be an immutable digest}
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: runtime.env
        required: ${RUNTIME_ENV_REQUIRED:-true}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_SSL_MODE: require
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
    command: ["node", "src/integration-worker.ts"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
  integration-dispatcher-ts:
    image: ${API_SERVICE_IMAGE:?API_SERVICE_IMAGE must be an immutable digest}
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: runtime.env
        required: ${RUNTIME_ENV_REQUIRED:-true}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_SSL_MODE: require
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
    command: ["node", "src/integration-dispatcher.ts"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  billing-worker-ts:
    image: ${API_SERVICE_IMAGE:?API_SERVICE_IMAGE must be an immutable digest}
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: runtime.env
        required: ${RUNTIME_ENV_REQUIRED:-true}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_SSL_MODE: require
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
    command: ["node", "src/billing-worker.ts", "--loop"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  # TypeScript API service: the route families the route-ownership manifest
  # assigns to TypeScript, which Caddy sends to :8100. Same database, session
  # key and runtime.env as the Python web process; a smaller pool, since it
  # serves a handful of reads beside ten Python processes.
  api-service:
    image: ${API_SERVICE_IMAGE:?API_SERVICE_IMAGE must be an immutable digest}
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: runtime.env
        required: ${RUNTIME_ENV_REQUIRED:-true}
    environment:
      APP_ENV: production
      HOST: 127.0.0.1
      PORT: "8100"
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      OAUTH_GOOGLE_ENABLED: ${OAUTH_GOOGLE_ENABLED:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?TRUSTED_PROXY_CIDRS is required}
      SITE_HEALTH_AUTOMATIC_PAGE_LIMIT: "200"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_SSL_MODE: require
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "0"
      DEMO_MODE: ${DEMO_MODE:-false}
      MCP_ENABLED: "true"
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:?MCP_PUBLIC_BASE_URL is required}
      MCP_ALLOWED_ACCOUNT_EMAIL: ${MCP_ALLOWED_ACCOUNT_EMAIL-}
      DEV_LOGIN_EMAIL: ${DEV_LOGIN_EMAIL:?DEV_LOGIN_EMAIL is required}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # TypeScript analytics worker: the API service image, another command. It
  # claims the analytics kinds core/config/analytics.py assigns to TypeScript;
  # analytics-worker claims the rest and queue-sweeper expires every lease.
  analytics-worker-ts:
    image: ${API_SERVICE_IMAGE:?API_SERVICE_IMAGE must be an immutable digest}
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: runtime.env
        required: ${RUNTIME_ENV_REQUIRED:-true}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_SSL_MODE: require
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
    command: ["node", "src/worker.ts"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: ingress.env
        required: ${RUNTIME_ENV_REQUIRED:-true}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/caddy/tls:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api-service:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_tls:
  caddy_data:
  caddy_config:

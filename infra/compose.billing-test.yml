services:
  db:
    ports: !override
      - "127.0.0.1:55433:5432"
  migrate:
    # Schema only: billing staging disables the identity/catalog bootstrap.
    command: ["node", "src/cli/migrate.ts"]
  api-service:
    ports: !override
      - "127.0.0.1:8300:8100"
  frontend:
    ports: !override
      - "127.0.0.1:3300:3000"
  # Keep the parallel stack off the default stack's app and docs ports.
  vite-app:
    ports: !override
      - "127.0.0.1:3301:3001"
  docs:
    ports: !override
      - "127.0.0.1:4332:4322"
  webhook-proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8301:8080"
    volumes:
      - ./infra/billing-webhook.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-service:
        condition: service_healthy

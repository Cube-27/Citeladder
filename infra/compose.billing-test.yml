services:
  db:
    ports: !override
      - "127.0.0.1:55433:5432"
  migrate:
    command: ["alembic", "upgrade", "head"]
  web:
    ports: !override
      - "127.0.0.1:8300:8000"
  frontend:
    ports: !override
      - "127.0.0.1:3300:3000"
  billing-reconciler:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${CITELADDER_ENV_FILE:?Select the billing test environment}
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Required}@db:5432/${POSTGRES_DB:?Required}
    command: ["python", "-m", "scripts.reconcile_billing", "--watch"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
  webhook-proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8301:8080"
    volumes:
      - ./infra/billing-webhook.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy

services:
  db:
    ports: !override
      - "127.0.0.1:55433:5432"
  migrate:
    command: ["alembic", "upgrade", "head"]
  api-service:
    ports: !override
      - "127.0.0.1:8300:8100"
  frontend:
    ports: !override
      - "127.0.0.1:3300:3000"
  webhook-proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8301:8080"
    volumes:
      - ./infra/billing-webhook.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-service:
        condition: service_healthy

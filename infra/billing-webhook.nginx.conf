server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 256k;
    location = /api/v1/billing/webhooks/razorpay {
        limit_except POST { deny all; }
        set $billing_backend http://web:8000;
        proxy_pass $billing_backend$request_uri;
        proxy_connect_timeout 1s;
        proxy_read_timeout 4s;
        access_log off;
    }
    location / { return 404; }
}

# SonarQube Cloud automatic analysis. Only copy-paste detection is narrowed;
# every file is still analyzed for issues.
#
# Marketing content is data: arrays of { type: 'paragraph', text } blocks and
# similar records. Sonar anonymizes string literals when detecting copies, so
# any run of blocks matches any other regardless of the words in them. The
# repository's own duplication policy (scripts/quality.mjs) still applies.
sonar.cpd.exclusions=frontend/lib/marketing-content/**

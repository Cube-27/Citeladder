# SonarQube Cloud automatic analysis. Copy-paste detection is narrowed for
# marketing content, and non-source files are excluded (see the end).
#
# Marketing content is data: arrays of { type: 'paragraph', text } blocks and
# similar records. Sonar anonymizes string literals when detecting copies, so
# any run of blocks matches any other regardless of the words in them. The
# repository's own duplication policy (scripts/quality.mjs) still applies.
sonar.cpd.exclusions=frontend/lib/marketing-content/**

# Not source: the schema baseline is pg_dump output (repeated DDL literals such
# as column defaults are inherent), and test fixtures are recorded third-party
# pages and payloads kept byte-for-byte.
sonar.exclusions=frontend/services/api/migrations/**,frontend/services/api/test/fixtures/**

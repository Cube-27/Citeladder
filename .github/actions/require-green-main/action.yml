name: Require green CI on the exact main commit
description: >-
  Fails unless the checked-out commit is the tip of main and both ci.yml's and
  compose-smoke.yml's push runs for that exact commit concluded success. Every
  deploy runs it before publishing anything: those runs have already validated
  each affected owner and the clean-clone stack on that commit, so deploys
  require that record instead of repeating the suites. An owner-free push only
  skips validation when the same workflow passed on the previous main commit
  (scripts/ci-changes.mjs), so a green run never vouches for unvalidated code.
  Needs `actions: read`.

runs:
  using: composite
  steps:
    - name: Verify exact main commit
      shell: bash
      run: test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
    - name: Require green CI and Compose smoke for the deployed commit
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        deadline=$((SECONDS + 1800))
        for workflow in ci.yml compose-smoke.yml; do
          while :; do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main \
              --event push --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,url)"
            status="$(jq -r '.[0].status // "missing"' <<< "$run")"
            url="$(jq -r '.[0].url // ""' <<< "$run")"
            if [ "$status" = completed ]; then
              conclusion="$(jq -r '.[0].conclusion' <<< "$run")"
              if [ "$conclusion" != success ]; then
                echo "::error::$workflow concluded '$conclusion' for $GITHUB_SHA: $url"
                exit 1
              fi
              echo "$workflow passed for $GITHUB_SHA: $url"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$workflow did not complete for $GITHUB_SHA within 30 minutes; re-run once it is green."
              exit 1
            fi
            echo "$workflow for $GITHUB_SHA is $status; waiting."
            sleep 30
          done
        done

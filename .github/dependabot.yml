version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  # Dependabot uses the npm ecosystem for pnpm lockfiles.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      patch-and-minor:
        update-types: [patch, minor]
    # Vitest is not an independent dependency here. frontend/pnpm-workspace.yaml
    # pins it in the catalog to the exact version vite-plus bundles, so that the
    # tree holds exactly one Vitest copy. Bumping it alone splits that copy in
    # two: Dependabot's vitest 5.0.0 PR kept vite-plus 0.3.1 and
    # @vitest/coverage-v8 4.1.11, and the suite raised 175 unhandled errors.
    # Vitest moves when vite-plus moves, by hand, catalog and override together.
    ignore:
      - dependency-name: vitest
      - dependency-name: '@vitest/*'

  # Both frontend Dockerfiles pin the SAME node digest, so they are ONE entry
  # spanning two directories rather than two entries. Two entries would open
  # two pull requests that merge independently, and between those merges the
  # marketing and app images run different node builds — the drift that left
  # apps/app a release behind in the first place.
  #
  # The `node` group omits `update-types` on purpose. A digest bump is neither
  # patch nor minor, so `patch-and-minor` does not catch it — which is exactly
  # why the /frontend digest arrived as its own ungrouped PR. Omitting the key
  # takes every update type, so both directories' node bumps land together.
  # `patch-and-minor` still covers the caddy image in apps/app.
  - package-ecosystem: docker
    directories:
      - /frontend
      - /frontend/apps/app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      node:
        patterns: ['node']
      patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      patch-and-minor:
        update-types: [patch, minor]
    # The interpreter version is one decision spread over four files: the root
    # Dockerfile, backend/.python-version, the `python-version` of the CI gate,
    # and the `requires-python` floor in backend/pyproject.toml. Dependabot can
    # only move the first, so a feature bump ships a container running an
    # interpreter no gate validated. That happened once (see the Dockerfile
    # header) and the 3.14.7 PR was the same bump again. Patch releases inside
    # the pinned 3.12 line still arrive; a feature bump is a deliberate,
    # four-file change.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      patch-and-minor:
        update-types: [patch, minor]

version: 2
updates:
  # Dependabot uses the npm ecosystem for pnpm lockfiles.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      patch-and-minor:
        update-types: [patch, minor]
    # Vitest is not an independent dependency here. frontend/pnpm-workspace.yaml
    # pins it in the catalog to the exact version vite-plus bundles, so that the
    # tree holds exactly one Vitest copy. Bumping it alone splits that copy in
    # two: Dependabot's vitest 5.0.0 PR kept vite-plus 0.3.1 and
    # @vitest/coverage-v8 4.1.11, and the suite raised 175 unhandled errors.
    # Vitest moves when vite-plus moves, by hand, catalog and override together.
    #
    # Scoped to the three version-update types on purpose. A bare
    # `dependency-name` would also suppress Dependabot *security* updates for
    # vitest, and a held pin is not a reason to stop hearing about an advisory
    # against it. Naming the version-update types leaves that channel open.
    ignore:
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: '@vitest/*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

  # Keep frontend and API Node updates in one group. Their immutable base
  # digest identifies Node 26 bookworm-slim; preserve that family on updates.
  #
  # The `node` group omits `update-types` on purpose. A digest bump is neither
  # patch nor minor, so `patch-and-minor` does not catch it — which is exactly
  # why the /frontend digest arrived as its own ungrouped PR. Omitting the key
  # takes every update type, so these directories' node bumps land together.
  - package-ecosystem: docker
    directories:
      - /frontend
      - /frontend/apps/app
      - /frontend/apps/docs
      - /frontend/services/api
      - /infra/gcp/postgres
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      node:
        patterns: ['node']
      patch-and-minor:
        update-types: [patch, minor]
    # A PostgreSQL major version cannot start on the database VM's existing data
    # directory; it is a deliberate database reset, never a routine bump.
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      patch-and-minor:
        update-types: [patch, minor]

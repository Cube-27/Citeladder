name: Compose smoke

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# See ci.yml: only pull-request runs are superseded.
concurrency:
  group: compose-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify affected owners
    permissions:
      actions: read
      contents: read
    # Classification needs Node, Git and the GitHub API, not a full build VM.
    runs-on: ubuntu-slim
    outputs:
      compose: ${{ steps.classify.outputs.compose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Compose validation
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_HEAD_REF: ${{ github.head_ref }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_WORKFLOW_FILE: compose-smoke.yml
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-changes.mjs

  compose-smoke:
    name: Clean-clone Compose smoke
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No host toolchain and no host dependency install. The images install
      # their own dependencies frozen -- `uv sync --frozen` (Dockerfile) and
      # `pnpm install --frozen-lockfile` (frontend/Dockerfile) -- so a stale
      # lockfile fails the build below. The backend and frontend CI jobs
      # additionally install frozen on the host, and both lockfiles classify as
      # security- AND compose-sensitive, so they always select those jobs.

      - name: Create disposable Compose environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=development
          POSTGRES_DB=citeladder_smoke
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=citeladder_smoke_password
          JWT_SECRET_KEY=compose-smoke-jwt-secret-not-for-production-000000000000000000000000
          JWT_ALGORITHM=HS256
          JWT_EXPIRE_HOURS=24
          ENCRYPTION_KEY=compose-smoke-encryption-key-not-for-production
          FRONTEND_URL=http://127.0.0.1:3000
          FRONTEND_ORIGINS=http://127.0.0.1:3000,http://localhost:3000
          TRUSTED_PROXY_CIDRS=
          LOGFIRE_ENABLED=false
          LOGFIRE_TOKEN=
          EOF

      # Built cold on purpose, with no BuildKit layer cache. Measured over 60
      # runs of this workflow the whole job is ~2 minutes and `next build` --
      # its single most expensive layer -- takes 22 seconds. Cross-run caching
      # would need the docker-container driver plus bake delegation to save
      # seconds. Revisit if this job ever passes ~8 minutes.
      - name: Build and start empty-database stack
        run: |
          set -euo pipefail
          compose=(env -u POSTGRES_DB -u POSTGRES_USER -u POSTGRES_PASSWORD -u DATABASE_URL docker compose --project-name citeladder-smoke --env-file .env -f docker-compose.yml)
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              "${compose[@]}" ps || true
              "${compose[@]}" logs --no-color || true
            fi
            "${compose[@]}" down --volumes --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          # `docker compose build`/`up` pull postgres:16-alpine when absent;
          # GitHub runners must not require the image to be pre-cached.
          if ss -ltn '( sport = :3000 or sport = :8000 or sport = :55432 )' | grep -q LISTEN; then
            echo 'Required smoke-test port is already in use.' >&2
            exit 1
          fi
          "${compose[@]}" down --volumes --remove-orphans
          "${compose[@]}" build
          # `up` blocks until the one-shot migration dependency succeeds before
          # starting the web process and workers.
          "${compose[@]}" up --detach
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health | grep -qx '{"status":"ok"}'; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/health | grep -qx '{"status":"ok"}'
          # Readiness is the probe that proves the stack can actually serve:
          # /health stays 200 with the database down, /ready does not.
          curl --fail --silent --show-error http://127.0.0.1:8000/ready | grep -qx '{"status":"ready"}'
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null

          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error --output /var/tmp/catalog.json \
              http://127.0.0.1:3000/api/v1/brand-discovery-catalog; then
              python3 -m json.tool /var/tmp/catalog.json > /dev/null && break
            fi
            sleep 2
          done
          curl --fail --silent --show-error --output /var/tmp/catalog.json \
            http://127.0.0.1:3000/api/v1/brand-discovery-catalog
          python3 -m json.tool /var/tmp/catalog.json > /dev/null

          "${compose[@]}" down --volumes --remove-orphans
          trap - EXIT

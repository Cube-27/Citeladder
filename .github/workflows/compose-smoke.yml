name: Compose smoke

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify affected owners
    permissions:
      actions: read
      contents: read
    # The slim runner queue left PRs unassigned past their timeout (2026-11-17).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      compose: ${{ steps.classify.outputs.compose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Compose validation
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_HEAD_REF: ${{ github.head_ref }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_WORKFLOW_FILE: compose-smoke.yml
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-changes.mjs

  compose-smoke:
    name: Clean-clone Compose smoke
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create disposable Compose environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=development
          POSTGRES_DB=citeladder_smoke
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=citeladder_smoke_password
          JWT_SECRET_KEY=compose-smoke-jwt-secret-not-for-production-000000000000000000000000
          JWT_ALGORITHM=HS256
          JWT_EXPIRE_HOURS=24
          ENCRYPTION_KEY=compose-smoke-encryption-key-not-for-production
          FRONTEND_URL=http://127.0.0.1:3001
          TRUSTED_PROXY_CIDRS=
          DEV_LOGIN_EMAIL=smoke@example.test
          DEV_LOGIN_PASSWORD=compose-smoke-development-password
          DEV_LOGIN_COUNTER_ALLOWANCE=100
          EOF

      - name: Build and start empty-database stack
        run: |
          set -euo pipefail
          compose=(env -u POSTGRES_DB -u POSTGRES_USER -u POSTGRES_PASSWORD -u DATABASE_URL docker compose --project-name citeladder-smoke --env-file .env -f docker-compose.yml --profile app)
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              "${compose[@]}" ps || true
              "${compose[@]}" logs --no-color || true
            fi
            "${compose[@]}" down --volumes --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          if ss -ltn '( sport = :3000 or sport = :3001 or sport = :4322 or sport = :8100 or sport = :55432 )' | grep -q LISTEN; then
            echo 'Required smoke-test port is already in use.' >&2
            exit 1
          fi
          "${compose[@]}" down --volumes --remove-orphans
          "${compose[@]}" build
          "${compose[@]}" up --detach
          for service in api-service; do
            image="$(docker inspect --format '{{.Image}}' "$("${compose[@]}" ps --all -q "$service")")"
            bytes="$(docker image inspect --format '{{.Size}}' "$image")"
            test "$bytes" -le 734003200 || {
              echo "::error::$service image exceeds the 700 MiB runtime budget: $bytes bytes"
              exit 1
            }
          done
          "${compose[@]}" run --rm --no-deps migrate node src/cli/bootstrap-catalog.ts --help
          "${compose[@]}" run --rm --no-deps migrate node src/cli/bootstrap-account.ts --help
          "${compose[@]}" run --rm --no-deps migrate node src/cli/billing-admin.ts --help
          "${compose[@]}" run --rm --no-deps migrate
          "${compose[@]}" exec -T api-service node --input-type=module -e "await import('@citeladder/contracts')"
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8100/health | grep -qx '{"status":"ok"}'; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8100/health | grep -qx '{"status":"ok"}'
          curl --fail --silent --show-error http://127.0.0.1:8100/ready | grep -qx '{"status":"ready"}'
          for origin in http://127.0.0.1:3000 http://127.0.0.1:3001/health http://127.0.0.1:4322; do
            for _ in $(seq 1 45); do
              if curl --fail --silent --show-error --max-time 10 "$origin" >/dev/null; then
                break
              fi
              sleep 2
            done
            curl --fail --silent --show-error --max-time 10 "$origin" >/dev/null
          done
          node scripts/frontend-ingress-smoke.mjs http://127.0.0.1:3000 http://127.0.0.1:3001
          # grep reads the whole log (no -q): an early exit closes the pipe, `compose logs`
          # fails with 255, and pipefail turns a match into a failed step.
          for _ in $(seq 1 45); do
            if "${compose[@]}" logs --no-color runner | grep '"runner_completed"' >/dev/null; then
              break
            fi
            sleep 2
          done
          "${compose[@]}" logs --no-color runner | grep '"runner_completed"' >/dev/null

          "${compose[@]}" down --volumes --remove-orphans
          trap - EXIT

  # The workflow's required status, like ci.yml's `CI result`: GitHub reports
  # the smoke skipped by its condition as successful, so requiring it by name
  # would also pass a run whose classifier failed.
  result:
    name: Compose smoke result
    needs: [changes, compose-smoke]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The classifier and any selected smoke passed
        env:
          CLASSIFIER: ${{ needs.changes.result }}
          SMOKE: ${{ needs.compose-smoke.result }}
        run: |
          echo "changes: $CLASSIFIER"
          echo "compose-smoke: $SMOKE"
          test "$CLASSIFIER" = success
          test "$SMOKE" = success || test "$SMOKE" = skipped

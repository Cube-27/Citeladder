name: Compose smoke

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# See ci.yml: only pull-request runs are superseded.
concurrency:
  group: compose-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify affected owners
    permissions:
      actions: read
      contents: read
    # Classification needs Node, Git and the GitHub API, not a full build VM.
    runs-on: ubuntu-slim
    outputs:
      compose: ${{ steps.classify.outputs.compose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Compose validation
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_HEAD_REF: ${{ github.head_ref }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_WORKFLOW_FILE: compose-smoke.yml
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-changes.mjs

  compose-smoke:
    name: Clean-clone Compose smoke
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No host toolchain and no host dependency install. The images install
      # their own dependencies frozen -- `uv sync --frozen` (Dockerfile) and
      # `pnpm install --frozen-lockfile` (frontend/Dockerfile) -- so a stale
      # lockfile fails the build below. The backend and frontend CI jobs
      # additionally install frozen on the host, and both lockfiles classify as
      # security- AND compose-sensitive, so they always select those jobs.

      - name: Create disposable Compose environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=development
          POSTGRES_DB=citeladder_smoke
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=citeladder_smoke_password
          JWT_SECRET_KEY=compose-smoke-jwt-secret-not-for-production-000000000000000000000000
          JWT_ALGORITHM=HS256
          JWT_EXPIRE_HOURS=24
          ENCRYPTION_KEY=compose-smoke-encryption-key-not-for-production
          FRONTEND_URL=http://127.0.0.1:3001
          TRUSTED_PROXY_CIDRS=
          DEV_LOGIN_EMAIL=smoke@example.test
          DEV_LOGIN_PASSWORD=compose-smoke-development-password
          DEV_LOGIN_COUNTER_ALLOWANCE=100
          EOF

      # Build both frontend runtimes cold to verify clean-clone delivery.
      - name: Build and start empty-database stack
        run: |
          set -euo pipefail
          compose=(env -u POSTGRES_DB -u POSTGRES_USER -u POSTGRES_PASSWORD -u DATABASE_URL docker compose --project-name citeladder-smoke --env-file .env -f docker-compose.yml)
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              "${compose[@]}" ps || true
              "${compose[@]}" logs --no-color || true
            fi
            "${compose[@]}" down --volumes --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          # `docker compose build`/`up` pull postgres:16-alpine when absent;
          # GitHub runners must not require the image to be pre-cached.
          if ss -ltn '( sport = :3000 or sport = :3001 or sport = :4322 or sport = :8100 or sport = :55432 )' | grep -q LISTEN; then
            echo 'Required smoke-test port is already in use.' >&2
            exit 1
          fi
          "${compose[@]}" down --volumes --remove-orphans
          "${compose[@]}" build
          # `up` blocks until the one-shot migration dependency succeeds before
          # starting the API process and workers.
          "${compose[@]}" up --detach
          # Runtime image budgets catch full-toolchain base-image drift and
          # accidental inclusion of the frontend workspace dependency graph.
          for service in migrate api-service; do
            image="$(docker inspect --format '{{.Image}}' "$("${compose[@]}" ps --all -q "$service")")"
            bytes="$(docker image inspect --format '{{.Size}}' "$image")"
            test "$bytes" -le 734003200 || {
              echo "::error::$service image exceeds the 700 MiB runtime budget: $bytes bytes"
              exit 1
            }
          done
          "${compose[@]}" run --rm --no-deps migrate python -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          "${compose[@]}" run --rm --no-deps migrate node /app/native/src/cli/bootstrap-catalog.ts --help
          "${compose[@]}" run --rm --no-deps migrate node /app/native/src/cli/billing-admin.ts --help
          # Repeated composed startup must retain the same immutable catalog.
          "${compose[@]}" run --rm --no-deps migrate /bin/sh /app/bootstrap-environment.sh
          "${compose[@]}" exec -T api-service node --input-type=module -e "await import('@citeladder/contracts')"
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8100/health | grep -qx '{"status":"ok"}'; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8100/health | grep -qx '{"status":"ok"}'
          # Readiness is the probe that proves the stack can actually serve:
          # /health stays 200 with the database down, /ready does not.
          curl --fail --silent --show-error http://127.0.0.1:8100/ready | grep -qx '{"status":"ready"}'
          for origin in http://127.0.0.1:3000 http://127.0.0.1:3001/health http://127.0.0.1:4322; do
            for _ in $(seq 1 45); do
              if curl --fail --silent --show-error --max-time 10 "$origin" >/dev/null; then
                break
              fi
              sleep 2
            done
            curl --fail --silent --show-error --max-time 10 "$origin" >/dev/null
          done
          node scripts/frontend-ingress-smoke.mjs http://127.0.0.1:3000 http://127.0.0.1:3001
          # The runner loop is the only executor: one tick must complete on a clean database.
          for _ in $(seq 1 45); do
            if "${compose[@]}" logs --no-color runner | grep -q '"runner_completed"'; then
              break
            fi
            sleep 2
          done
          "${compose[@]}" logs --no-color runner | grep -q '"runner_completed"'

          "${compose[@]}" down --volumes --remove-orphans
          trap - EXIT

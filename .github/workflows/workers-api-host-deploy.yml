name: API host Worker delivery

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: workers-api-host-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The same Cloudflare credentials as the product Worker; no new secret.
    environment: workers-app-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-green-main
      - uses: ./.github/actions/setup-frontend
      - name: Deploy API host Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm deploy:api-host
      - name: Release record
        shell: bash
        run: |
          {
            echo '## API host Worker release'
            echo 'Target: production (api.citeladder.com)'
            echo "Source: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

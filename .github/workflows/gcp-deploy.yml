name: GCP - Deploy

on:
  workflow_dispatch:
    inputs:
      reset_database:
        description: 'Irreversibly replace the database VM and all its data (no backup) before migrating'
        type: boolean
        default: false
      confirm_project:
        description: 'For a database reset, enter the exact GCP project ID'
        type: string
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: gcp-demo
    concurrency:
      group: gcp-deploy
      cancel-in-progress: false
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      ZONE: ${{ vars.GCP_ZONE || 'us-central1-a' }}
      STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      API_SERVICE: citeladder-api
      BILLING_ACCOUNT: ${{ vars.GCP_BILLING_ACCOUNT }}
      BUDGET_CURRENCY_CODE: ${{ vars.GCP_BUDGET_CURRENCY_CODE || 'INR' }}
      BUDGET_UNITS: ${{ vars.GCP_BUDGET_UNITS || '500' }}
      ALERT_EMAIL: ${{ vars.GCP_ALERT_EMAIL }}
      DOMAIN_NAME: ${{ vars.DOMAIN_NAME || 'citeladder.com' }}
      APP_DOMAIN_NAME: ${{ vars.APP_DOMAIN_NAME || 'app.citeladder.com' }}
      DEMO_MODE: ${{ vars.DEMO_MODE || 'false' }}
      DEMO_EXPIRES_AT: ${{ vars.DEMO_EXPIRES_AT }}
      DEMO_LOGIN_EMAIL: ${{ vars.DEMO_LOGIN_EMAIL || 'dev@citeladder.com' }}
      DEV_LOGIN_COUNTER_ALLOWANCE: ${{ vars.DEV_LOGIN_COUNTER_ALLOWANCE || '200' }}
      OAUTH_GOOGLE_ENABLED: ${{ vars.OAUTH_GOOGLE_ENABLED || 'false' }}
      PUBLIC_SIGNUP_ENABLED: ${{ vars.PUBLIC_SIGNUP_ENABLED || 'false' }}
      DEFAULT_AGENT_BASE_URL: ${{ vars.DEFAULT_AGENT_BASE_URL }}
      DEFAULT_AGENT_MODEL: ${{ vars.DEFAULT_AGENT_MODEL }}
      TICK_SCHEDULE: ${{ vars.TICK_SCHEDULE || '*/20 * * * *' }}
      BILLING_CHECKOUT_ENABLED: ${{ vars.BILLING_CHECKOUT_ENABLED || 'false' }}
      BILLING_CHECKOUT_AUDIENCE: ${{ vars.BILLING_CHECKOUT_AUDIENCE || 'allow_list' }}
      BILLING_RAZORPAY_MODE: ${{ vars.BILLING_RAZORPAY_MODE || 'disabled' }}
      BILLING_RAZORPAY_KEY_ID: ${{ vars.BILLING_RAZORPAY_KEY_ID }}
      BILLING_RAZORPAY_TEST_READY: ${{ vars.BILLING_RAZORPAY_TEST_READY || 'false' }}
      BILLING_RAZORPAY_TEST_INTERNATIONAL_READY: ${{ vars.BILLING_RAZORPAY_TEST_INTERNATIONAL_READY || 'false' }}
      BILLING_RAZORPAY_TEST_INDIA_READY: ${{ vars.BILLING_RAZORPAY_TEST_INDIA_READY || 'false' }}
      BILLING_RAZORPAY_LIVE_READY: ${{ vars.BILLING_RAZORPAY_LIVE_READY || 'false' }}
      BILLING_RAZORPAY_INTERNATIONAL_READY: ${{ vars.BILLING_RAZORPAY_INTERNATIONAL_READY || 'false' }}
      BILLING_RAZORPAY_WEBHOOK_PREVIOUS_SECRET_STARTED_AT: ${{ vars.BILLING_RAZORPAY_WEBHOOK_PREVIOUS_SECRET_STARTED_AT }}
      BILLING_RAZORPAY_WEBHOOK_PREVIOUS_SECRET_EXPIRES_AT: ${{ vars.BILLING_RAZORPAY_WEBHOOK_PREVIOUS_SECRET_EXPIRES_AT }}
      BILLING_INDIA_GST_RATE: ${{ vars.BILLING_INDIA_GST_RATE }}
      BILLING_INDIA_GST_APPROVAL_REFERENCE: ${{ vars.BILLING_INDIA_GST_APPROVAL_REFERENCE }}
      BILLING_SELLER_SAC: ${{ vars.BILLING_SELLER_SAC }}
      BILLING_SELLER_LUT_REFERENCE: ${{ vars.BILLING_SELLER_LUT_REFERENCE }}
      BILLING_FUNDED_MONTHLY_BUDGET_MINOR: ${{ vars.BILLING_FUNDED_MONTHLY_BUDGET_MINOR }}
      PROVIDER_PLATFORM_OPENAI_CREDENTIAL_REF: ${{ vars.PROVIDER_PLATFORM_OPENAI_CREDENTIAL_REF }}
      PROVIDER_PLATFORM_GOOGLE_CREDENTIAL_REF: ${{ vars.PROVIDER_PLATFORM_GOOGLE_CREDENTIAL_REF }}
      PROVIDER_PLATFORM_ANTHROPIC_CREDENTIAL_REF: ${{ vars.PROVIDER_PLATFORM_ANTHROPIC_CREDENTIAL_REF }}
      DATAFORSEO_PLATFORM_CREDENTIAL_REF: ${{ vars.DATAFORSEO_PLATFORM_CREDENTIAL_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/require-green-main
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Verify explicit database reset target
        if: inputs.reset_database
        shell: bash
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID" && test "$CONFIRM_PROJECT" = "$PROJECT_ID"
          test "$DEMO_MODE" = false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Initialize Terraform and render inputs
        working-directory: infra/gcp
        shell: bash
        env:
          RAZORPAY_KEY_SECRET_SET: ${{ secrets.BILLING_RAZORPAY_KEY_SECRET != '' }}
          RAZORPAY_WEBHOOK_SECRET_SET: ${{ secrets.BILLING_RAZORPAY_WEBHOOK_SECRET != '' }}
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID" && test -n "$STATE_BUCKET" && test -n "$BILLING_ACCOUNT"
          test -n "$DEPLOY_SERVICE_ACCOUNT"
          if [ -z "$ALERT_EMAIL" ]; then
            echo "::error::Set the gcp-demo environment's GCP_ALERT_EMAIL variable; monitoring alerts go to it."
            exit 1
          fi
          test -n "$DEFAULT_AGENT_BASE_URL" && test -n "$DEFAULT_AGENT_MODEL"
          [[ "$DEMO_MODE" =~ ^(true|false)$ ]]
          [[ "$OAUTH_GOOGLE_ENABLED" =~ ^(true|false)$ ]]
          [[ "$PUBLIC_SIGNUP_ENABLED" =~ ^(true|false)$ ]]
          [[ "$BILLING_CHECKOUT_AUDIENCE" =~ ^(allow_list|everyone)$ ]]
          [[ "$BILLING_RAZORPAY_MODE" =~ ^(disabled|test|live)$ ]]
          if [ "$BILLING_RAZORPAY_MODE" != disabled ] && { [ -z "$BILLING_RAZORPAY_KEY_ID" ] \
            || [ "$RAZORPAY_KEY_SECRET_SET" != true ] || [ "$RAZORPAY_WEBHOOK_SECRET_SET" != true ]; }; then
            echo "::error::BILLING_RAZORPAY_MODE=$BILLING_RAZORPAY_MODE needs BILLING_RAZORPAY_KEY_ID and both Razorpay secrets."
            exit 1
          fi
          billing_names=(BILLING_CHECKOUT_ENABLED BILLING_CHECKOUT_AUDIENCE BILLING_RAZORPAY_MODE
            BILLING_RAZORPAY_KEY_ID BILLING_RAZORPAY_TEST_READY BILLING_RAZORPAY_TEST_INTERNATIONAL_READY
            BILLING_RAZORPAY_TEST_INDIA_READY BILLING_RAZORPAY_LIVE_READY BILLING_RAZORPAY_INTERNATIONAL_READY
            BILLING_RAZORPAY_WEBHOOK_PREVIOUS_SECRET_STARTED_AT BILLING_RAZORPAY_WEBHOOK_PREVIOUS_SECRET_EXPIRES_AT
            BILLING_INDIA_GST_RATE BILLING_INDIA_GST_APPROVAL_REFERENCE BILLING_SELLER_SAC
            BILLING_SELLER_LUT_REFERENCE BILLING_FUNDED_MONTHLY_BUDGET_MINOR
            PROVIDER_PLATFORM_OPENAI_CREDENTIAL_REF PROVIDER_PLATFORM_GOOGLE_CREDENTIAL_REF
            PROVIDER_PLATFORM_ANTHROPIC_CREDENTIAL_REF DATAFORSEO_PLATFORM_CREDENTIAL_REF)
          billing_env="$(for name in "${billing_names[@]}"; do
            jq -n --arg key "$name" --arg value "${!name}" 'select($value != "") | {($key): $value}'
          done | jq -s 'add // {}')"
          api_url="https://citeladder-api-$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)').${REGION}.run.app"
          for worker in app marketing api-host; do
            upstream="$(sed -n 's/.*"ORIGIN_UPSTREAM": *"\([^"]*\)".*/\1/p' "../../frontend/apps/$worker/wrangler.jsonc")"
            if [[ "$upstream" != "$api_url" ]]; then
              echo "::error::frontend/apps/$worker/wrangler.jsonc ORIGIN_UPSTREAM is '$upstream'; this project serves $api_url."
              exit 1
            fi
          done
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET"
          terraform fmt -check
          terraform validate
          placeholder="sha256:$(printf 'a%.0s' $(seq 64))"
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/citeladder"
          jq -n \
            --arg project "$PROJECT_ID" --arg deployer "$DEPLOY_SERVICE_ACCOUNT" \
            --arg billing "$BILLING_ACCOUNT" --arg alert_email "$ALERT_EMAIL" \
            --arg currency "$BUDGET_CURRENCY_CODE" --argjson units "$BUDGET_UNITS" \
            --arg region "$REGION" --arg zone "$ZONE" \
            --arg domain "$DOMAIN_NAME" --arg app "$APP_DOMAIN_NAME" \
            --arg api "$registry/api-service@$placeholder" \
            --arg postgres "$registry/postgres@$placeholder" \
            --arg agent_url "$DEFAULT_AGENT_BASE_URL" --arg agent_model "$DEFAULT_AGENT_MODEL" \
            --argjson demo "$DEMO_MODE" --arg expires "$DEMO_EXPIRES_AT" \
            --arg email "$DEMO_LOGIN_EMAIL" --argjson allowance "$DEV_LOGIN_COUNTER_ALLOWANCE" \
            --argjson google "$OAUTH_GOOGLE_ENABLED" --argjson signup "$PUBLIC_SIGNUP_ENABLED" \
            --arg tick "$TICK_SCHEDULE" --argjson billing_env "$billing_env" \
            '{project_id:$project,deployer_service_account:$deployer,
              billing_account:$billing,alert_email:$alert_email,budget_currency_code:$currency,
              budget_units:$units,region:$region,zone:$zone,domain_name:$domain,
              app_domain_name:$app,api_image:$api,postgres_image:$postgres,
              agent_base_url:$agent_url,agent_model:$agent_model,demo_mode:$demo,
              demo_expires_at:$expires,dev_login_email:$email,dev_login_counter_allowance:$allowance,
              oauth_google_enabled:$google,public_signup_enabled:$signup,tick_schedule:$tick,
              billing_env:$billing_env,optional_secrets:[]}' > deploy.auto.tfvars.json
          terraform apply -input=false -auto-approve \
            -target=google_artifact_registry_repository.images \
            -target=google_secret_manager_secret.runtime \
            -target=google_secret_manager_secret_iam_member.jobs \
            -target=google_secret_manager_secret_iam_member.migrate \
            -target=google_secret_manager_secret_iam_member.deployer
      - name: Build and push immutable images
        working-directory: infra/gcp
        shell: bash
        run: |
          set -euo pipefail
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/citeladder"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          # `images list` resolves a digest from the registry alone (no
          # Container Analysis permission). Prints nothing for a missing tag.
          image_digest() {
            local name="$1" tag="$2"
            gcloud artifacts docker images list "$registry/$name" --include-tags --filter="tags:$tag" \
              --format='value(version)' --quiet 2>/dev/null | head -n 1
          }
          publish() {
            local name="$1" tag="$2" digest
            shift 2
            if [ -z "$(image_digest "$name" "$tag")" ]; then
              docker build --build-arg BUILD_REVISION="$GITHUB_SHA" -t "$registry/$name:$tag" "$@" >&2
              docker push "$registry/$name:$tag" >&2
            fi
            digest="$(image_digest "$name" "$tag")"
            test -n "$digest"
            echo "$registry/$name@$digest"
          }
          api="$(publish api-service "$GITHUB_SHA" -f ../../frontend/services/api/Dockerfile ../..)"
          postgres="$(publish postgres "16-$(sha256sum postgres/Dockerfile | cut -c1-12)" postgres)"
          jq --arg api "$api" --arg postgres "$postgres" \
            '.api_image=$api | .postgres_image=$postgres' \
            deploy.auto.tfvars.json > /tmp/tfvars
          mv /tmp/tfvars deploy.auto.tfvars.json
          # shellcheck disable=SC2016
          printf -- '- API service and migrate job: `%s`\n- PostgreSQL: `%s`\n' \
            "$api" "$postgres" > /tmp/release-images.md
      - name: Synchronize runtime secret versions
        working-directory: infra/gcp
        shell: bash
        env:
          DEMO_LOGIN_PASSWORD: ${{ secrets.DEMO_LOGIN_PASSWORD }}
          CITELADDER_ORIGIN_TOKEN: ${{ secrets.CITELADDER_ORIGIN_TOKEN }}
          CITELADDER_ORIGIN_TOKEN_PREVIOUS: ${{ secrets.CITELADDER_ORIGIN_TOKEN_PREVIOUS }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEFAULT_AGENT_API_KEY: ${{ secrets.DEFAULT_AGENT_API_KEY }}
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BING_OAUTH_CLIENT_ID: ${{ secrets.BING_OAUTH_CLIENT_ID }}
          BING_OAUTH_CLIENT_SECRET: ${{ secrets.BING_OAUTH_CLIENT_SECRET }}
          DATAFORSEO_API_LOGIN: ${{ secrets.DATAFORSEO_API_LOGIN }}
          DATAFORSEO_API_PASSWORD: ${{ secrets.DATAFORSEO_API_PASSWORD }}
          BILLING_RAZORPAY_KEY_SECRET: ${{ secrets.BILLING_RAZORPAY_KEY_SECRET }}
          BILLING_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.BILLING_RAZORPAY_WEBHOOK_SECRET }}
          BILLING_RAZORPAY_WEBHOOK_PREVIOUS_SECRET: ${{ secrets.BILLING_RAZORPAY_WEBHOOK_PREVIOUS_SECRET }}
          PROVIDER_PLATFORM_OPENAI_API_KEY: ${{ secrets.PROVIDER_PLATFORM_OPENAI_API_KEY }}
          PROVIDER_PLATFORM_GOOGLE_API_KEY: ${{ secrets.PROVIDER_PLATFORM_GOOGLE_API_KEY }}
          PROVIDER_PLATFORM_ANTHROPIC_API_KEY: ${{ secrets.PROVIDER_PLATFORM_ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          has_version() {
            local name="$1"
            gcloud secrets versions list "$name" --project "$PROJECT_ID" --format=json \
              | jq -e 'any(.[]; .state == "ENABLED")' >/dev/null
          }
          add_generated() {
            local name="$1"
            has_version "$name" || openssl rand -hex 32 \
              | gcloud secrets versions add "$name" --project "$PROJECT_ID" --data-file=- >/dev/null
          }
          destroy_superseded() {
            local name="$1" newest
            newest="$(gcloud secrets versions describe latest --secret "$name" --project "$PROJECT_ID" --format='value(name)')"
            test -n "$newest"
            gcloud secrets versions list "$name" --project "$PROJECT_ID" \
              --filter='state!=DESTROYED' --format='value(name)' \
              | while read -r version; do
                  if [ -n "$version" ] && [ "${version##*/}" != "${newest##*/}" ]; then
                    gcloud secrets versions destroy "${version##*/}" \
                      --secret "$name" --project "$PROJECT_ID" --quiet >/dev/null
                  fi
                done
          }
          sync_value() {
            local name="$1" value="$2" current_hash incoming_hash
            if [ -z "$value" ]; then
              echo "::error::$name has no value; add its gcp-demo environment secret and re-run."
              exit 1
            fi
            if has_version "$name"; then
              current_hash="$(gcloud secrets versions access latest --secret "$name" --project "$PROJECT_ID" | sha256sum | cut -d' ' -f1)"
              incoming_hash="$(printf '%s' "$value" | sha256sum | cut -d' ' -f1)"
            fi
            if [ "${current_hash:-}" != "${incoming_hash:-none}" ]; then
              printf '%s' "$value" | gcloud secrets versions add "$name" --project "$PROJECT_ID" --data-file=- >/dev/null
            fi
            destroy_superseded "$name"
          }
          enabled_optional=()
          # An unset optional secret has its versions disabled and is left out
          # of Cloud Run, which cannot reference a secret without a version.
          sync_optional_value() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              sync_value "$name" "$value"
              enabled_optional+=("$name")
              return
            fi
            gcloud secrets versions list "$name" --project "$PROJECT_ID" \
              --filter='state=ENABLED' --format='value(name)' \
              | while read -r version; do
                  test -z "$version" || gcloud secrets versions disable "$version" \
                    --secret "$name" --project "$PROJECT_ID" --quiet >/dev/null
                done
          }
          add_generated citeladder-db-password
          add_generated citeladder-db-app-password
          add_generated citeladder-jwt-secret
          add_generated citeladder-encryption-key
          add_generated citeladder-referral-salt
          add_generated citeladder-api-key-pepper
          add_generated citeladder-billing-quote-secret
          owner_password="$(gcloud secrets versions access latest --secret citeladder-db-password --project "$PROJECT_ID")"
          owner_password_uri="$(jq -rn --arg value "$owner_password" '$value | @uri')"
          app_password="$(gcloud secrets versions access latest --secret citeladder-db-app-password --project "$PROJECT_ID")"
          app_password_uri="$(jq -rn --arg value "$app_password" '$value | @uri')"
          sync_value citeladder-migration-database-url \
            "postgresql://citeladder:${owner_password_uri}@10.28.0.10:5432/citeladder"
          sync_value citeladder-database-url \
            "postgresql://citeladder_app:${app_password_uri}@10.28.0.10:5432/citeladder"
          if [ "$DEMO_MODE" = true ]; then
            if [ "${#DEMO_LOGIN_PASSWORD}" -lt 8 ] || [ "${#DEMO_LOGIN_PASSWORD}" -gt 128 ]; then
              echo '::error::DEMO_LOGIN_PASSWORD must hold 8 to 128 characters in demo mode.'
              exit 1
            fi
            sync_optional_value citeladder-demo-password "$DEMO_LOGIN_PASSWORD"
          else
            sync_optional_value citeladder-demo-password ""
          fi
          if [ "${#CITELADDER_ORIGIN_TOKEN}" -lt 32 ]; then
            echo '::error::CITELADDER_ORIGIN_TOKEN must hold at least 32 characters.'
            exit 1
          fi
          sync_value citeladder-worker-origin-token "$CITELADDER_ORIGIN_TOKEN"
          sync_value citeladder-turnstile-secret "$TURNSTILE_SECRET_KEY"
          sync_value citeladder-google-oauth-client-id "$GOOGLE_OAUTH_CLIENT_ID"
          sync_value citeladder-google-oauth-client-secret "$GOOGLE_OAUTH_CLIENT_SECRET"
          sync_optional_value citeladder-worker-origin-token-previous "$CITELADDER_ORIGIN_TOKEN_PREVIOUS"
          sync_optional_value citeladder-default-agent-api-key "$DEFAULT_AGENT_API_KEY"
          sync_optional_value citeladder-keenable-api-key "$KEENABLE_API_KEY"
          sync_optional_value citeladder-jev-api-key "$JEV_API_KEY"
          sync_optional_value citeladder-tavily-api-key "$TAVILY_API_KEY"
          sync_optional_value citeladder-resend-api-key "$RESEND_API_KEY"
          sync_optional_value citeladder-bing-oauth-client-id "$BING_OAUTH_CLIENT_ID"
          sync_optional_value citeladder-bing-oauth-client-secret "$BING_OAUTH_CLIENT_SECRET"
          sync_optional_value citeladder-dataforseo-login "$DATAFORSEO_API_LOGIN"
          sync_optional_value citeladder-dataforseo-password "$DATAFORSEO_API_PASSWORD"
          sync_optional_value citeladder-razorpay-key-secret "$BILLING_RAZORPAY_KEY_SECRET"
          sync_optional_value citeladder-razorpay-webhook-secret "$BILLING_RAZORPAY_WEBHOOK_SECRET"
          sync_optional_value citeladder-razorpay-webhook-previous-secret "$BILLING_RAZORPAY_WEBHOOK_PREVIOUS_SECRET"
          sync_optional_value citeladder-platform-openai-key "$PROVIDER_PLATFORM_OPENAI_API_KEY"
          sync_optional_value citeladder-platform-google-key "$PROVIDER_PLATFORM_GOOGLE_API_KEY"
          sync_optional_value citeladder-platform-anthropic-key "$PROVIDER_PLATFORM_ANTHROPIC_API_KEY"
          for pair in citeladder-bing-oauth-client citeladder-dataforseo; do
            count=0
            for name in "${enabled_optional[@]}"; do
              case "$name" in
                "$pair"-*) count=$((count + 1)) ;;
                *) ;;
              esac
            done
            if [ "$count" = 1 ]; then
              echo "::error::Set both $pair secrets or neither."
              exit 1
            fi
            [ "$count" = 2 ] || echo "::warning::$pair is unconfigured for this deploy."
          done
          printf '%s\n' "${enabled_optional[@]}" | jq -R 'select(length > 0)' | jq -s . > /tmp/optional.json
          jq --slurpfile optional /tmp/optional.json '.optional_secrets=$optional[0]' \
            deploy.auto.tfvars.json > /tmp/tfvars
          mv /tmp/tfvars deploy.auto.tfvars.json
      - name: Converge migrations, identity and native catalog before API rollout
        working-directory: infra/gcp
        shell: bash
        env:
          RESET_DATABASE: ${{ inputs.reset_database }}
        run: |
          set -euo pipefail
          replace=()
          if [ "$RESET_DATABASE" = true ]; then replace=(-replace=google_compute_instance.db); fi
          # The VM runs its startup script (image, access rules) only at boot,
          # and Terraform updates it in place. Restart an existing VM whose
          # script changed, so the migration and the new revision meet the
          # database that script describes; the data directory persists. A
          # created or replaced VM boots with the new script already.
          vm=(citeladder-db --project "$PROJECT_ID" --zone "$ZONE")
          vm_state() {
            gcloud compute instances describe "${vm[@]}" --format=json 2>/dev/null \
              | jq -r '.id + " " + ([.metadata.items[]? | select(.key == "startup-script") | .value] | first // "" | @base64)'
          }
          before="$(vm_state || true)"
          terraform apply -input=false -auto-approve -target=google_cloud_run_v2_job.migrate "${replace[@]}"
          test "$(terraform output -raw db_instance)" = citeladder-db
          after="$(vm_state)"
          if [ -n "$before" ] && [ "${before%% *}" = "${after%% *}" ] && [ "$before" != "$after" ]; then
            echo 'The database startup script changed; restarting the VM (about a minute of database downtime).'
            gcloud compute instances reset "${vm[@]}" --quiet
          fi
          test "$(terraform output -raw db_address)" = 10.28.0.10
          gcloud run jobs execute "$(terraform output -raw migrate_job)" \
            --project "$PROJECT_ID" --region "$REGION" --wait
      - name: Pin API traffic to the serving revision
        shell: bash
        run: |
          set -euo pipefail
          run=(--project "$PROJECT_ID" --region "$REGION")
          existing="$(gcloud run services list "${run[@]}" \
            --filter="metadata.name=$API_SERVICE" --format='value(metadata.name)')"
          [ -z "$existing" ] && exit 0
          serving="$(gcloud run services describe "$API_SERVICE" "${run[@]}" --format=json \
            | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName] | first // empty')"
          if [ -z "$serving" ]; then
            echo "::error::$API_SERVICE has no single revision serving all traffic; settle its traffic first."
            exit 1
          fi
          gcloud run services update-traffic "$API_SERVICE" "${run[@]}" \
            --to-revisions="$serving=100" --quiet >/dev/null
          echo "Pinned $API_SERVICE traffic to $serving."
      - name: Apply infrastructure
        id: terraform
        working-directory: infra/gcp
        shell: bash
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "tick_scheduler=$(terraform output -raw tick_scheduler)" >> "$GITHUB_OUTPUT"
      - name: Tag the new API revision
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          run=(--project "$PROJECT_ID" --region "$REGION")
          describe() {
            gcloud run services describe "$API_SERVICE" "${run[@]}" --format=json
          }
          revision="$(describe | jq -r '.status.latestCreatedRevisionName')"
          # Cloud Run retires a revision with no traffic and no tag without starting
          # it, so latestReadyRevisionName never reaches it; the tagged-URL smoke
          # below starts it and is the readiness gate.
          if ! gcloud run services update-traffic "$API_SERVICE" "${run[@]}" \
            --set-tags="candidate=$revision" --quiet >/dev/null; then
            echo "::error::Could not tag revision $revision; traffic stays on the serving revision."
            exit 1
          fi
          url="$(describe | jq -r '[.status.traffic[]? | select(.tag == "candidate") | .url] | first // empty')"
          test -n "$url"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke the new revision at its tagged URL
        id: smoke
        shell: bash
        env:
          API_URL: ${{ steps.candidate.outputs.url }}
          REVISION: ${{ steps.candidate.outputs.revision }}
          ORIGIN_TOKEN: ${{ secrets.CITELADDER_ORIGIN_TOKEN }}
        run: |
          set -euo pipefail
          code() {
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$@"
          }
          signed() {
            local host="${1,,}" path="$2" ts signature
            ts="$(date +%s)"
            signature="$(printf 'citeladder-origin-v1\n%s\nGET\n%s\n%s\n' "$ts" "$host" "$path" |
              openssl dgst -sha256 -hmac "$ORIGIN_TOKEN" | awk '{print $NF}')"
            code --header "X-CiteLadder-Origin-Timestamp: $ts" \
              --header "X-CiteLadder-Origin-Signature: $signature" \
              --header "X-CiteLadder-Public-Host: $host" "$API_URL$path"
          }
          admitted() {
            local status=000
            for _ in $(seq 10); do
              status="$(signed "$1" "$2" || true)"
              [[ "$status" != 000 && "$status" != 408 && "$status" != 429 && "$status" != 5* ]] && break
              sleep 6
            done
            echo "$status"
          }
          ready="$(admitted "$APP_DOMAIN_NAME" /ready)"
          providers="$(admitted "$APP_DOMAIN_NAME" /api/v1/auth/oauth/providers)"
          mcp="$(admitted "api.$DOMAIN_NAME" /.well-known/oauth-authorization-server)"
          live="$(code "$API_URL/health")"
          anonymous="$(code "$API_URL/ready")"
          foreign="$(signed attacker.example /ready)"
          unscheduled="$(code --request POST "$API_URL/internal/tick")"
          if [[ "$ready" != 200 || "$providers" != 200 || "$mcp" != 200 || "$live" != 200 || "$anonymous" != 403 || "$foreign" != 403 || "$unscheduled" != 403 ]]; then
            echo "::error::Origin smoke failed: ready=$ready providers=$providers mcp=$mcp live=$live anonymous=$anonymous foreign=$foreign unscheduled=$unscheduled"
            exit 1
          fi
          {
            echo '### GCP deployment'
            echo "- Source commit: \`$GITHUB_SHA\`"
            cat /tmp/release-images.md
            echo "- Revision \`$REVISION\` at \`$API_URL\` before any traffic: ready $ready, providers $providers, MCP metadata $mcp, anonymous liveness $live; anonymous readiness $anonymous, foreign host $foreign, unscheduled tick $unscheduled"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Shift API traffic to the smoked revision
        shell: bash
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          set -euo pipefail
          run=(--project "$PROJECT_ID" --region "$REGION")
          # Name the smoked revision: --to-latest would route to any newer,
          # unsmoked revision created since the tag.
          gcloud run services update-traffic "$API_SERVICE" "${run[@]}" \
            --to-revisions="$REVISION=100" --quiet >/dev/null
          gcloud run services update-traffic "$API_SERVICE" "${run[@]}" --remove-tags=candidate --quiet >/dev/null
          serving="$(gcloud run services describe "$API_SERVICE" "${run[@]}" --format=json \
            | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName] | first // empty')"
          if [ "$serving" != "$REVISION" ]; then
            echo "::error::$API_SERVICE serves '${serving:-nothing}', not the smoked revision $REVISION."
            exit 1
          fi
      - name: Smoke the scheduled tick
        shell: bash
        env:
          API_URL: ${{ steps.terraform.outputs.api_url }}
          TICK_SCHEDULER: ${{ steps.terraform.outputs.tick_scheduler }}
        run: |
          set -euo pipefail
          scheduler=(--project "$PROJECT_ID" --location "$REGION")
          before="$(gcloud scheduler jobs describe "$TICK_SCHEDULER" "${scheduler[@]}" --format='value(lastAttemptTime)')"
          gcloud scheduler jobs run "$TICK_SCHEDULER" "${scheduler[@]}"
          for _ in $(seq 30); do
            sleep 5
            attempt="$(gcloud scheduler jobs describe "$TICK_SCHEDULER" "${scheduler[@]}" --format='value(lastAttemptTime)')"
            [ "$attempt" != "$before" ] && break
          done
          tick_status="$(gcloud scheduler jobs describe "$TICK_SCHEDULER" "${scheduler[@]}" --format='value(status.code)')"
          # A successful attempt reports no status, or code 0 (OK).
          if [[ "$attempt" == "$before" || ( -n "$tick_status" && "$tick_status" != 0 ) ]]; then
            echo "::error::Scheduled tick failed: last attempt ${attempt:-none}, status ${tick_status:-none}"
            exit 1
          fi
          {
            echo "- Serving all traffic at \`$API_URL\`; scheduled tick succeeded"
            echo '- The Workers ORIGIN_UPSTREAM must equal this serving API origin.'
          } >> "$GITHUB_STEP_SUMMARY"

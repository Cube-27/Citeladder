name: claude-review

# The one review of a PR over 10 changed files (CLAUDE.md "Completion and
# review"): Anthropic's code-review plugin, billed to the ANTHROPIC_API_KEY
# secret. Start it once per PR, on green CI:
#   gh pr comment <n> --body "/claude-review"
#   gh workflow run claude-review.yml -f pr=<n>
# Only comments by users with write access start it. The job lives in the
# public Cube-27/.github repo, pinned to a commit.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    uses: Cube-27/.github/.github/workflows/claude-review.yml@e7b9650e8ff49fcbcd76529ce7732affec60509e
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

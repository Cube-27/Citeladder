name: Product Worker delivery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-app-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # require-green-main reads ci.yml's run for this commit.
    permissions:
      actions: read
      contents: read
    # Up to 30 minutes waiting for CI (require-green-main), then the build.
    timeout-minutes: 50
    outputs:
      fingerprint: ${{ steps.config.outputs.fingerprint }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-green-main
      - uses: ./.github/actions/setup-frontend
      - name: Check generated Worker bindings
        run: |
          pnpm --dir frontend types:app-worker
          git diff --exit-code -- frontend/apps/app/worker-configuration.d.ts
      - name: Set baked public origins
        id: config
        shell: bash
        env:
          LOGO_DEV_PUBLISHABLE: ${{ vars.LOGO_DEV_PUBLISHABLE }}
          # Self-serve sign-up stays closed unless the repository variable
          # opens it together with the API's PUBLIC_SIGNUP_ENABLED.
          SELF_SERVE_SIGNUP: ${{ vars.SELF_SERVE_SIGNUP || 'false' }}
        run: |
          test -n "$LOGO_DEV_PUBLISHABLE"
          [[ "$SELF_SERVE_SIGNUP" =~ ^(true|false)$ ]]
          {
            echo 'NEXT_PUBLIC_DEMO_MODE=false'
            echo "NEXT_PUBLIC_SELF_SERVE_SIGNUP=$SELF_SERVE_SIGNUP"
            echo "NEXT_PUBLIC_LOGO_DEV_PUBLISHABLE=$LOGO_DEV_PUBLISHABLE"
            echo 'PUBLIC_WEBSITE_ORIGIN=https://citeladder.com'
            echo 'PUBLIC_APP_ORIGIN=https://app.citeladder.com'
            echo 'PUBLIC_API_ORIGIN=https://api.citeladder.com'
          } >> "$GITHUB_ENV"
          values=$'https://citeladder.com\nhttps://app.citeladder.com\nhttps://api.citeladder.com'
          echo "fingerprint=$(printf 'origins=%s\ndemo=false\nlogo=%s\nsignup=%s\n' "$values" "$LOGO_DEV_PUBLISHABLE" "$SELF_SERVE_SIGNUP" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: pnpm --dir frontend build:app
      - run: pnpm --dir frontend check:bundle
      - name: Upload immutable product artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ github.sha }}-${{ steps.config.outputs.fingerprint }}
          path: frontend/apps/app/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: workers-app-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-${{ github.sha }}-${{ needs.build.outputs.fingerprint }}
          path: frontend/apps/app/dist/
      # Fontshare-licensed faces come from the private font repo straight into
      # the deployed output, never into the uploaded build artifact.
      - name: Pull licensed fonts
        env:
          GH_TOKEN: ${{ secrets.FONTS_REPO_TOKEN }}
        shell: bash
        run: |
          test -n "$GH_TOKEN"
          node frontend/scripts/pull-licensed-fonts.mjs frontend/apps/app/dist/fonts
      - name: Deploy product Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm deploy:app
      - name: Release record
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
        run: |
          {
            echo '## Product Worker release'
            echo 'Target: production'
            echo "Source: $GITHUB_SHA"
            echo "Artifact digest: $ARTIFACT_DIGEST"
            echo "Public configuration fingerprint: $FINGERPRINT"
            echo 'Compatible backend and ingress verification: operator release record required'
          } >> "$GITHUB_STEP_SUMMARY"

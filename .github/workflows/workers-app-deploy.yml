name: Product Worker delivery

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: workers-app-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 50
    outputs:
      fingerprint: ${{ steps.config.outputs.fingerprint }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-green-main
      - uses: ./.github/actions/setup-frontend
      - name: Check generated Worker bindings
        run: |
          pnpm --dir frontend types:app-worker
          git diff --exit-code -- frontend/apps/app/worker-configuration.d.ts
      - id: config
        uses: ./.github/actions/app-build-config
        with:
          logo-dev-publishable: ${{ vars.LOGO_DEV_PUBLISHABLE }}
          turnstile-site-key: ${{ vars.APP_TURNSTILE_SITE_KEY }}
          self-serve-signup: ${{ vars.SELF_SERVE_SIGNUP }}
      - run: pnpm --dir frontend build:app
      - name: Upload immutable product artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ github.sha }}-${{ steps.config.outputs.fingerprint }}
          path: frontend/apps/app/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment: workers-app-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-${{ github.sha }}-${{ needs.build.outputs.fingerprint }}
          path: frontend/apps/app/dist/
      # Fontshare-licensed faces come from the private font repo straight into
      # the deployed output, never into the uploaded build artifact.
      - name: Pull licensed fonts
        env:
          GH_TOKEN: ${{ secrets.FONTS_REPO_TOKEN }}
        shell: bash
        run: |
          test -n "$GH_TOKEN"
          node frontend/scripts/pull-licensed-fonts.mjs frontend/apps/app/dist/fonts
      - name: Deploy product Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm deploy:app
      - name: Release record
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
        run: |
          {
            echo '## Product Worker release'
            echo 'Target: production'
            echo "Source: $GITHUB_SHA"
            echo "Artifact digest: $ARTIFACT_DIGEST"
            echo "Public configuration fingerprint: $FINGERPRINT"
            echo 'Compatible backend and ingress verification: operator release record required'
          } >> "$GITHUB_STEP_SUMMARY"

name: AWS Demo - Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: Start or stop the fixed demo resources
        type: choice
        required: true
        options: [start, stop]

permissions:
  contents: read
  id-token: write

jobs:
  control:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-demo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify protected commit
        shell: bash
        run: test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_CONTROL_ROLE_ARN }}
          aws-region: us-east-1
      - name: Control fixed resources
        env:
          ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          expiry=$(aws ssm get-parameter --name /citeladder/demo/expires-at --query 'Parameter.Value' --output text)
          if [ "$ACTION" = start ]; then
            test "$(date -u +%s)" -lt "$(date -u -d "$expiry" +%s)" || { echo 'Demo has expired'; exit 1; }
            status=$(aws rds describe-db-instances --db-instance-identifier citeladder-demo --query 'DBInstances[0].DBInstanceStatus' --output text)
            if [ "$status" = stopped ]; then aws rds start-db-instance --db-instance-identifier citeladder-demo >/dev/null; fi
            aws rds wait db-instance-available --db-instance-identifier citeladder-demo
            aws ecs update-service --cluster citeladder-demo --service citeladder-demo --desired-count 1 >/dev/null
            aws ecs wait services-stable --cluster citeladder-demo --services citeladder-demo
          else
            aws ecs update-service --cluster citeladder-demo --service citeladder-demo --desired-count 0 >/dev/null
            while [ "$(aws ecs describe-services --cluster citeladder-demo --services citeladder-demo --query 'services[0].runningCount' --output text)" != 0 ]; do sleep 15; done
            status=$(aws rds describe-db-instances --db-instance-identifier citeladder-demo --query 'DBInstances[0].DBInstanceStatus' --output text)
            if [ "$status" = available ]; then aws rds stop-db-instance --db-instance-identifier citeladder-demo >/dev/null; fi
          fi

name: Marketing Worker delivery

on:
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: Submit every sitemap URL to IndexNow instead of only the changed ones
        type: boolean
        default: false

# Deny by default; every job grants what it needs.
permissions: {}

concurrency:
  group: workers-marketing-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # require-green-main reads ci.yml's run for this commit.
    permissions:
      actions: read
      contents: read
    # Up to 30 minutes waiting for CI (require-green-main), then the build.
    timeout-minutes: 50
    outputs:
      fingerprint: ${{ steps.config.outputs.fingerprint }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-green-main
      - uses: ./.github/actions/setup-frontend
      - name: Check generated Worker bindings
        run: |
          pnpm --dir frontend types:marketing-worker
          git diff --exit-code -- frontend/apps/marketing/worker-configuration.d.ts
      - name: Set baked public origins
        id: config
        shell: bash
        env:
          # Self-serve sign-up stays closed unless the repository variable
          # opens it together with the API's PUBLIC_SIGNUP_ENABLED.
          SELF_SERVE_SIGNUP: ${{ vars.SELF_SERVE_SIGNUP || 'false' }}
        run: |
          [[ "$SELF_SERVE_SIGNUP" =~ ^(true|false)$ ]]
          {
            echo 'PUBLIC_WEBSITE_ORIGIN=https://citeladder.com'
            echo 'PUBLIC_APP_ORIGIN=https://app.citeladder.com'
            echo "NEXT_PUBLIC_SELF_SERVE_SIGNUP=$SELF_SERVE_SIGNUP"
            # The Turnstile site key is public; its secret is the Worker secret TURNSTILE_SECRET_KEY.
            echo 'PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAAFS7i6wNJ4sAbY-8'
          } >> "$GITHUB_ENV"
          values=$'https://citeladder.com\nhttps://app.citeladder.com\nturnstile=0x4AAAAAAFS7i6wNJ4sAbY-8\nsignup='"$SELF_SERVE_SIGNUP"
          echo "fingerprint=$(printf '%s' "$values" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: pnpm --dir frontend build:marketing
      - name: Upload immutable marketing artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketing-${{ github.sha }}-${{ steps.config.outputs.fingerprint }}
          path: frontend/apps/marketing/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment: workers-marketing-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: marketing-${{ github.sha }}-${{ needs.build.outputs.fingerprint }}
          path: frontend/apps/marketing/dist/
      # Fontshare-licensed faces come from the private font repo straight into
      # the deployed output, never into the uploaded build artifact.
      - name: Pull licensed fonts
        env:
          GH_TOKEN: ${{ secrets.FONTS_REPO_TOKEN }}
        shell: bash
        run: |
          test -n "$GH_TOKEN"
          node frontend/scripts/pull-licensed-fonts.mjs frontend/apps/marketing/dist/client/fonts
      # The live sitemap before this deploy is the baseline for IndexNow's changed URLs.
      - name: Save live sitemap
        id: live_sitemap
        continue-on-error: true
        shell: bash
        run: curl --fail --silent --show-error --max-time 30 -o "$RUNNER_TEMP/live-sitemap.xml" https://citeladder.com/sitemap.xml
      - name: Deploy marketing Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm deploy:marketing
      # A failed submission never fails a deploy that is already live.
      - name: Submit changed URLs to IndexNow
        continue-on-error: true
        shell: bash
        env:
          SUBMIT_ALL: ${{ inputs.indexnow_all }}
          LIVE_SITEMAP_SAVED: ${{ steps.live_sitemap.outcome == 'success' }}
        run: |
          previous=()
          if [[ "$SUBMIT_ALL" != 'true' ]]; then
            if [[ "$LIVE_SITEMAP_SAVED" != 'true' ]]; then
              echo '::warning::No live sitemap baseline; skipping IndexNow. Rerun with indexnow_all to submit every URL.'
              exit 0
            fi
            previous=("$RUNNER_TEMP/live-sitemap.xml")
          fi
          node frontend/scripts/ping-indexnow.mjs frontend/apps/marketing/dist/client/sitemap.xml "${previous[@]}"
      - name: Release record
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
        run: |
          {
            echo '## Marketing Worker release'
            echo 'Target: production'
            echo "Source: $GITHUB_SHA"
            echo "Artifact digest: $ARTIFACT_DIGEST"
            echo "Public configuration fingerprint: $FINGERPRINT"
            echo 'Domain association, backend compatibility, and cutover acceptance: operator release record required'
          } >> "$GITHUB_STEP_SUMMARY"

name: Marketing Worker delivery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-marketing-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.config.outputs.fingerprint }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - name: Check generated Worker bindings
        run: |
          pnpm --dir frontend types:marketing-worker
          git diff --exit-code -- frontend/apps/marketing/worker-configuration.d.ts
      - name: Set baked public origins
        id: config
        shell: bash
        env:
          # Self-serve sign-up stays closed unless the repository variable
          # opens it together with the API's PUBLIC_SIGNUP_ENABLED.
          SELF_SERVE_SIGNUP: ${{ vars.SELF_SERVE_SIGNUP || 'false' }}
        run: |
          [[ "$SELF_SERVE_SIGNUP" =~ ^(true|false)$ ]]
          echo 'PUBLIC_WEBSITE_ORIGIN=https://citeladder.com' >> "$GITHUB_ENV"
          echo 'PUBLIC_APP_ORIGIN=https://app.citeladder.com' >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SELF_SERVE_SIGNUP=$SELF_SERVE_SIGNUP" >> "$GITHUB_ENV"
          # The Turnstile site key is public; its secret is the Worker secret TURNSTILE_SECRET_KEY.
          echo 'PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAAFS7i6wNJ4sAbY-8' >> "$GITHUB_ENV"
          values=$'https://citeladder.com\nhttps://app.citeladder.com\nturnstile=0x4AAAAAAFS7i6wNJ4sAbY-8\nsignup='"$SELF_SERVE_SIGNUP"
          echo "fingerprint=$(printf '%s' "$values" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: pnpm --dir frontend build:marketing
      - name: Upload immutable marketing artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketing-${{ github.sha }}-${{ steps.config.outputs.fingerprint }}
          path: frontend/apps/marketing/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: workers-marketing-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: marketing-${{ github.sha }}-${{ needs.build.outputs.fingerprint }}
          path: frontend/apps/marketing/dist/
      # Fontshare-licensed faces come from the private font repo straight into
      # the deployed output, never into the uploaded build artifact.
      - name: Pull licensed fonts
        env:
          GH_TOKEN: ${{ secrets.FONTS_REPO_TOKEN }}
        shell: bash
        run: |
          test -n "$GH_TOKEN"
          node frontend/scripts/pull-licensed-fonts.mjs frontend/apps/marketing/dist/client/fonts
      - name: Deploy marketing Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm deploy:marketing
      - name: Release record
        shell: bash
        run: |
          {
            echo '## Marketing Worker release'
            echo 'Target: production'
            echo 'Source: ${{ github.sha }}'
            echo 'Artifact digest: ${{ needs.build.outputs.artifact_digest }}'
            echo 'Public configuration fingerprint: ${{ needs.build.outputs.fingerprint }}'
            echo 'Domain association, backend compatibility, and cutover acceptance: operator release record required'
          } >> "$GITHUB_STEP_SUMMARY"

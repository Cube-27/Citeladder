name: GCP Demo - Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gcp-demo
    concurrency:
      group: gcp-demo-deploy
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret -- CI-only fixture
          POSTGRES_DB: citeladder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ZONE: ${{ vars.GCP_ZONE }}
      STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      BILLING_ACCOUNT: ${{ vars.GCP_BILLING_ACCOUNT }}
      BUDGET_CURRENCY_CODE: ${{ vars.GCP_BUDGET_CURRENCY_CODE }}
      BUDGET_UNITS: ${{ vars.GCP_BUDGET_UNITS }}
      # Optional, and read only in demo mode. The host no longer self-expires;
      # tear it down with the destroy workflow.
      DEMO_EXPIRES_AT: ${{ vars.DEMO_EXPIRES_AT }}
      # 'true' restores the single-account demo (no public sign-up).
      DEMO_MODE: ${{ vars.DEMO_MODE || 'false' }}
      DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
      ORIGIN_DOMAIN_NAME: ${{ vars.ORIGIN_DOMAIN_NAME || 'origin.citeladder.com' }}
      APP_DOMAIN_NAME: ${{ vars.APP_DOMAIN_NAME || 'app.citeladder.com' }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL || format('https://{0}', vars.DOMAIN_NAME) }}
      FRONTEND_ORIGINS: ${{ vars.FRONTEND_ORIGINS || format('https://{0}', vars.DOMAIN_NAME) }}
      MCP_PUBLIC_BASE_URL: ${{ vars.MCP_PUBLIC_BASE_URL || format('https://{0}', vars.DOMAIN_NAME) }}
      PUBLIC_WEBSITE_ORIGIN: ${{ vars.PUBLIC_WEBSITE_ORIGIN || format('https://{0}', vars.DOMAIN_NAME) }}
      PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN || format('https://{0}', vars.DOMAIN_NAME) }}
      # A VARIABLE, deliberately: this key is publishable and ships in the
      # client bundle, so storing it as a secret would only make it write-only
      # and mask it to `***` in the logs you would debug from. `vars.` does not
      # fall back to `secrets.`, so a token filed under the wrong one resolves
      # to the empty string and bakes '' into the bundle silently.
      LOGO_DEV_PUBLISHABLE: ${{ vars.LOGO_DEV_PUBLISHABLE }}
      DEMO_LOGIN_EMAIL: ${{ vars.DEMO_LOGIN_EMAIL }}
      DEV_LOGIN_COUNTER_ALLOWANCE: ${{ vars.DEV_LOGIN_COUNTER_ALLOWANCE || '200' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact main commit
        shell: bash
        run: test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Install repository toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          python -m pip install --only-binary :all: uv==0.11.28
          uv sync --project backend --frozen --extra dev
          npm install --global --ignore-scripts pnpm@12.4.2
          pnpm --dir frontend install --frozen-lockfile --ignore-scripts
          pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Run repository gates for the deployed commit
        shell: pwsh
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/citeladder # pragma: allowlist secret -- CI-only fixture
        run: |
          ./scripts/check.ps1 -CheckOnly
          $toolTests = @(Get-ChildItem scripts/*.test.mjs | ForEach-Object FullName)
          node --test @toolTests
          if ($LASTEXITCODE -ne 0) { throw 'Tooling tests failed' }
          Push-Location backend
          try {
            .venv/bin/python -m pytest -q --no-cov -x --tb=short
            if ($LASTEXITCODE -ne 0) { throw 'Backend tests failed' }
          } finally { Pop-Location }
      # pnpm's entry point is a Node script behind a shebang, and PowerShell on
      # Linux execs it directly rather than through the loader, so calling it
      # from the pwsh step above dies with 'Exec format error'. Keep every pnpm
      # gate in bash, where the shebang is honoured.
      - name: Run frontend gates for the deployed commit
        shell: bash
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/citeladder # pragma: allowlist secret -- CI-only fixture
        run: |
          set -euo pipefail
          pnpm --dir frontend test
          pnpm --dir frontend test:e2e
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Initialize and validate Terraform
        working-directory: infra/gcp
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID" && test -n "$STATE_BUCKET"
          test -n "$BILLING_ACCOUNT" && test -n "$BUDGET_CURRENCY_CODE" && test -n "$BUDGET_UNITS"
          test -n "$DOMAIN_NAME"
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET"
          terraform fmt -check
          terraform validate
      - name: Render reviewed Terraform inputs
        working-directory: infra/gcp
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://www.cloudflare.com/ips-v4 > /tmp/cf-v4
          curl --fail --silent --show-error https://www.cloudflare.com/ips-v6 > /tmp/cf-v6
          test -s /tmp/cf-v4 && test -s /tmp/cf-v6
          if grep -Fxq '0.0.0.0/0' /tmp/cf-v4; then
            echo 'Cloudflare IPv4 list contains a default route' >&2
            exit 1
          fi
          if grep -Fxq '::/0' /tmp/cf-v6; then
            echo 'Cloudflare IPv6 list contains a default route' >&2
            exit 1
          fi
          jq -n \
            --arg project "$PROJECT_ID" --arg billing "$BILLING_ACCOUNT" \
            --arg budget_currency "$BUDGET_CURRENCY_CODE" --argjson budget_units "$BUDGET_UNITS" \
            --arg region "$REGION" --arg zone "$ZONE" --arg domain "$DOMAIN_NAME" \
            --arg backend "${REGION}-docker.pkg.dev/${PROJECT_ID}/citeladder-demo/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            --arg frontend "${REGION}-docker.pkg.dev/${PROJECT_ID}/citeladder-demo/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb" \
            --arg vite_app "${REGION}-docker.pkg.dev/${PROJECT_ID}/citeladder-demo/vite-app@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc" \
            --argjson v4 "$(jq -Rsc 'split("\n")|map(select(length>0))' /tmp/cf-v4)" \
            --argjson v6 "$(jq -Rsc 'split("\n")|map(select(length>0))' /tmp/cf-v6)" \
            '{project_id:$project,billing_account:$billing,budget_currency_code:$budget_currency,
              budget_units:$budget_units,region:$region,zone:$zone,domain_name:$domain,
              backend_image:$backend,frontend_image:$frontend,vite_app_image:$vite_app,
              cloudflare_ipv4_cidrs:$v4,cloudflare_ipv6_cidrs:$v6}' > demo.auto.tfvars.json
          terraform apply -input=false -auto-approve \
            -target=google_artifact_registry_repository.images \
            -target=google_secret_manager_secret.runtime \
            -target=google_storage_bucket.backups
      - name: Build and push immutable images
        id: images
        working-directory: infra/gcp
        shell: bash
        run: |
          set -euo pipefail
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/citeladder-demo"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          frontend_config="$(printf 'website=%s\napp=%s\n' \
            "$PUBLIC_WEBSITE_ORIGIN" "$PUBLIC_APP_ORIGIN" | sha256sum | cut -c1-16)"
          app_config="$(printf 'website=%s\napp=%s\ndemo=%s\nlogo=%s\n' \
            "$PUBLIC_WEBSITE_ORIGIN" "$PUBLIC_APP_ORIGIN" "$DEMO_MODE" \
            "$LOGO_DEV_PUBLISHABLE" | sha256sum | cut -c1-16)"
          frontend_tag="$GITHUB_SHA-$frontend_config"
          app_tag="$GITHUB_SHA-$app_config"
          echo "Public frontend config fingerprints: marketing=$frontend_config app=$app_config" >> "$GITHUB_STEP_SUMMARY"

          # `images describe` reads Container Analysis occurrences alongside the
          # digest, so it needs containeranalysis.occurrences.list — a separate
          # API from Artifact Registry, and not covered by artifactregistry.admin.
          # `images list` resolves the same digest from the registry alone, so
          # the deploy does not depend on the scanning API being reachable.
          # Prints the digest, or nothing when the tag does not exist.
          image_digest() {
            local tag="${2:-$GITHUB_SHA}"
            gcloud artifacts docker images list "$registry/$1" --include-tags --filter="tags:$tag" --format='value(version)' --quiet 2>/dev/null | head -n 1
          }
          if [ -z "$(image_digest backend)" ]; then
            docker build --build-arg BUILD_REVISION="$GITHUB_SHA" -t "$registry/backend:$GITHUB_SHA" ../..
            docker push "$registry/backend:$GITHUB_SHA"
          fi
          if [ -z "$(image_digest frontend "$frontend_tag")" ]; then
            docker build --build-arg BUILD_REVISION="$GITHUB_SHA" \
              --build-arg PUBLIC_WEBSITE_ORIGIN="$PUBLIC_WEBSITE_ORIGIN" \
              --build-arg PUBLIC_APP_ORIGIN="$PUBLIC_APP_ORIGIN" \
              -t "$registry/frontend:$frontend_tag" -f ../../frontend/Dockerfile ../..
            docker push "$registry/frontend:$frontend_tag"
          fi
          if [ -z "$(image_digest vite-app "$app_tag")" ]; then
            docker build \
              --build-arg NEXT_PUBLIC_DEMO_MODE="$DEMO_MODE" \
              --build-arg PUBLIC_WEBSITE_ORIGIN="$PUBLIC_WEBSITE_ORIGIN" \
              --build-arg PUBLIC_APP_ORIGIN="$PUBLIC_APP_ORIGIN" \
              --build-arg NEXT_PUBLIC_LOGO_DEV_PUBLISHABLE="$LOGO_DEV_PUBLISHABLE" \
              -t "$registry/vite-app:$app_tag" -f ../../frontend/apps/app/Dockerfile ../..
            docker push "$registry/vite-app:$app_tag"
          fi
          backend_digest="$(image_digest backend)"
          frontend_digest="$(image_digest frontend "$frontend_tag")"
          vite_app_digest="$(image_digest vite-app "$app_tag")"
          test -n "$backend_digest"
          test -n "$frontend_digest"
          test -n "$vite_app_digest"
          test "$backend_digest" != "$frontend_digest"
          backend="$registry/backend@$backend_digest"
          frontend="$registry/frontend@$frontend_digest"
          vite_app="$registry/vite-app@$vite_app_digest"
          jq --arg backend "$backend" --arg frontend "$frontend" --arg vite_app "$vite_app" \
            '.backend_image=$backend|.frontend_image=$frontend|.vite_app_image=$vite_app' demo.auto.tfvars.json > /tmp/tfvars
          mv /tmp/tfvars demo.auto.tfvars.json
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "vite_app=$vite_app" >> "$GITHUB_OUTPUT"
      - name: Synchronize runtime secret versions
        shell: bash
        env:
          DEMO_LOGIN_PASSWORD: ${{ secrets.DEMO_LOGIN_PASSWORD }}
          CLOUDFLARE_ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          CLOUDFLARE_ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
          DEFAULT_AGENT_API_KEY: ${{ secrets.DEFAULT_AGENT_API_KEY }}
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          BING_OAUTH_CLIENT_ID: ${{ secrets.BING_OAUTH_CLIENT_ID }}
          BING_OAUTH_CLIENT_SECRET: ${{ secrets.BING_OAUTH_CLIENT_SECRET }}
          CITELADDER_ORIGIN_TOKEN: ${{ secrets.CITELADDER_ORIGIN_TOKEN }}
          CITELADDER_ORIGIN_TOKEN_PREVIOUS: ${{ secrets.CITELADDER_ORIGIN_TOKEN_PREVIOUS }}
        run: |
          set -euo pipefail
          has_version() {
            gcloud secrets versions list "$1" --project "$PROJECT_ID" --format=json \
              | jq -e 'any(.[]; .state == "ENABLED")' >/dev/null
          }
          add_generated() {
            has_version "$1" || openssl rand -hex 32 | gcloud secrets versions add "$1" --project "$PROJECT_ID" --data-file=- >/dev/null
          }
          sync_value() {
            local name="$1" value="$2"
            local current_hash incoming_hash
            test -n "$value"
            if has_version "$name"; then
              current_hash="$(gcloud secrets versions access latest --secret "$name" --project "$PROJECT_ID" | sha256sum | cut -d' ' -f1)"
              incoming_hash="$(printf '%s' "$value" | sha256sum | cut -d' ' -f1)"
              test "$current_hash" != "$incoming_hash" || return 0
            fi
            printf '%s' "$value" | gcloud secrets versions add "$name" --project "$PROJECT_ID" --data-file=- >/dev/null
          }
          sync_optional_value() {
            local name="$1" value="$2"
            if test -n "$value"; then
              sync_value "$name" "$value"
              return
            fi
            gcloud secrets versions list "$name" --project "$PROJECT_ID" \
              --filter='state=ENABLED' --format='value(name)' \
              | while read -r version; do
                  test -z "$version" || gcloud secrets versions disable "$version" \
                    --secret "$name" --project "$PROJECT_ID" --quiet >/dev/null
                done
          }
          add_generated citeladder-db-password
          add_generated citeladder-jwt-secret
          add_generated citeladder-encryption-key
          add_generated citeladder-referral-salt
          test "${#DEMO_LOGIN_PASSWORD}" -ge 8
          test "${#DEMO_LOGIN_PASSWORD}" -le 128
          sync_value citeladder-demo-password "$DEMO_LOGIN_PASSWORD"
          sync_value citeladder-cloudflare-origin-cert "$CLOUDFLARE_ORIGIN_CERT"
          sync_value citeladder-cloudflare-origin-key "$CLOUDFLARE_ORIGIN_KEY"
          sync_value citeladder-worker-origin-token "$CITELADDER_ORIGIN_TOKEN"
          sync_optional_value citeladder-worker-origin-token-previous "$CITELADDER_ORIGIN_TOKEN_PREVIOUS"
          sync_optional_value citeladder-content-api-key "$CONTENT_API_KEY"
          sync_optional_value citeladder-default-agent-api-key "$DEFAULT_AGENT_API_KEY"
          sync_optional_value citeladder-keenable-api-key "$KEENABLE_API_KEY"
          sync_optional_value citeladder-tavily-api-key "$TAVILY_API_KEY"
          sync_value citeladder-google-oauth-client-id "$GOOGLE_OAUTH_CLIENT_ID"
          sync_value citeladder-google-oauth-client-secret "$GOOGLE_OAUTH_CLIENT_SECRET"
          sync_optional_value citeladder-bing-oauth-client-id "$BING_OAUTH_CLIENT_ID"
          sync_optional_value citeladder-bing-oauth-client-secret "$BING_OAUTH_CLIENT_SECRET"
          # Without a client pair the provider reports "not configured" and the
          # connect button 503s, so refuse the deploy rather than ship that.
          # Google is the demo's primary connector and stays blocking.
          for required in citeladder-google-oauth-client-id citeladder-google-oauth-client-secret; do
            has_version "$required" || {
              echo "::error::$required has no enabled version. Add the matching gcp-demo environment secret (GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET) and re-run."
              exit 1
            }
          done
          # Bing is optional: warn and deploy without it. Its connect button
          # 503s until BING_OAUTH_CLIENT_ID/SECRET are added to the environment.
          for optional in citeladder-bing-oauth-client-id citeladder-bing-oauth-client-secret; do
            has_version "$optional" || echo "::warning::$optional has no enabled version; Bing stays unconfigured for this deploy. Add BING_OAUTH_CLIENT_ID and BING_OAUTH_CLIENT_SECRET to the gcp-demo environment to enable it."
          done

          tls_dir="$(mktemp -d)"
          trap 'rm -rf "$tls_dir"' EXIT
          umask 077
          gcloud secrets versions access latest --project "$PROJECT_ID" \
            --secret citeladder-cloudflare-origin-cert > "$tls_dir/origin.pem"
          gcloud secrets versions access latest --project "$PROJECT_ID" \
            --secret citeladder-cloudflare-origin-key > "$tls_dir/origin-key.pem"
          if ! openssl x509 -in "$tls_dir/origin.pem" -noout -checkhost "$DOMAIN_NAME"; then
            echo "::error::Cloudflare origin certificate is not valid PEM for $DOMAIN_NAME"
            exit 1
          fi
          if ! openssl x509 -in "$tls_dir/origin.pem" -noout -checkhost "$ORIGIN_DOMAIN_NAME"; then
            echo "::error::Cloudflare origin certificate does not cover $ORIGIN_DOMAIN_NAME"
            exit 1
          fi
          if ! openssl pkey -in "$tls_dir/origin-key.pem" -noout >/dev/null; then
            echo "::error::Cloudflare origin private key is not valid PEM"
            exit 1
          fi
          cert_public_key="$(openssl x509 -in "$tls_dir/origin.pem" -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum)"
          private_public_key="$(openssl pkey -in "$tls_dir/origin-key.pem" -pubout -outform DER | sha256sum)"
          if test "$cert_public_key" != "$private_public_key"; then
            echo "::error::Cloudflare origin certificate and private key do not match"
            exit 1
          fi
      - name: Apply infrastructure
        id: terraform
        working-directory: infra/gcp
        shell: bash
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve
          echo "vm=$(terraform output -raw vm_name)" >> "$GITHUB_OUTPUT"
          echo "backup_bucket=$(terraform output -raw backup_bucket)" >> "$GITHUB_OUTPUT"
          echo "static_ip=$(terraform output -raw static_ip)" >> "$GITHUB_OUTPUT"
      - name: Deploy exact digests over IAP
        shell: bash
        env:
          VM_NAME: ${{ steps.terraform.outputs.vm }}
          BACKUP_BUCKET: ${{ steps.terraform.outputs.backup_bucket }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
          VITE_APP_IMAGE: ${{ steps.images.outputs.vite_app }}
          DEFAULT_AGENT_BASE_URL: ${{ vars.DEFAULT_AGENT_BASE_URL }}
          DEFAULT_AGENT_MODEL: ${{ vars.DEFAULT_AGENT_MODEL }}
          CONTENT_PROVIDER: ${{ vars.CONTENT_PROVIDER }}
          CONTENT_PROVIDER_ENDPOINT: ${{ vars.CONTENT_PROVIDER_ENDPOINT }}
          CONTENT_MODEL: ${{ vars.CONTENT_MODEL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if gcloud compute ssh "$VM_NAME" --project "$PROJECT_ID" --zone "$ZONE" --tunnel-through-iap \
              --quiet --command='test -f /var/lib/citeladder-bootstrap-complete'; then break; fi
            test "$attempt" -lt 30
            sleep 10
          done
          # Reuse the SSH transport that passed the bootstrap probe. Separate
          # gcloud compute scp authentication has failed on fresh CI runners.
          for attempt in 1 2 3; do
            if tar -cf - -C infra/gcp/runtime . -C /tmp cf-v4 cf-v6 \
              | gcloud compute ssh "$VM_NAME" --project "$PROJECT_ID" --zone "$ZONE" \
                  --tunnel-through-iap --quiet --ssh-flag=-T \
                  --command='rm -rf /tmp/citeladder-deploy && mkdir -m 700 /tmp/citeladder-deploy && tar -xf - -C /tmp/citeladder-deploy'; then
              break
            fi
            test "$attempt" -lt 3
            sleep 5
          done
          printf -v remote 'sudo env PROJECT_ID=%q REGION=%q BACKEND_IMAGE=%q FRONTEND_IMAGE=%q VITE_APP_IMAGE=%q BACKUP_BUCKET=%q DOMAIN_NAME=%q ORIGIN_DOMAIN_NAME=%q APP_DOMAIN_NAME=%q FRONTEND_URL=%q FRONTEND_ORIGINS=%q MCP_PUBLIC_BASE_URL=%q PUBLIC_WEBSITE_ORIGIN=%q PUBLIC_APP_ORIGIN=%q SOURCE_COMMIT=%q DEMO_MODE=%q DEMO_EXPIRES_AT=%q DEV_LOGIN_EMAIL=%q DEV_LOGIN_COUNTER_ALLOWANCE=%q DEFAULT_AGENT_BASE_URL=%q DEFAULT_AGENT_MODEL=%q CONTENT_PROVIDER=%q CONTENT_PROVIDER_ENDPOINT=%q CONTENT_MODEL=%q bash /tmp/citeladder-deploy/deploy-vm.sh' \
            "$PROJECT_ID" "$REGION" "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$VITE_APP_IMAGE" "$BACKUP_BUCKET" \
            "$DOMAIN_NAME" "$ORIGIN_DOMAIN_NAME" "$APP_DOMAIN_NAME" "$FRONTEND_URL" "$FRONTEND_ORIGINS" "$MCP_PUBLIC_BASE_URL" "$PUBLIC_WEBSITE_ORIGIN" "$PUBLIC_APP_ORIGIN" "$GITHUB_SHA" "$DEMO_MODE" "$DEMO_EXPIRES_AT" \
            "${DEMO_LOGIN_EMAIL:-dev@citeladder.com}" \
            "$DEV_LOGIN_COUNTER_ALLOWANCE" \
            "$DEFAULT_AGENT_BASE_URL" "$DEFAULT_AGENT_MODEL" \
            "$CONTENT_PROVIDER" "$CONTENT_PROVIDER_ENDPOINT" "$CONTENT_MODEL"
          gcloud compute ssh "$VM_NAME" --project "$PROJECT_ID" --zone "$ZONE" --tunnel-through-iap --quiet --command="$remote"
      - name: Smoke test and deployment summary
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
          VITE_APP_IMAGE: ${{ steps.images.outputs.vite_app }}
          STATIC_IP: ${{ steps.terraform.outputs.static_ip }}
          DEMO_LOGIN_PASSWORD: ${{ secrets.DEMO_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "https://$DOMAIN_NAME/health" >/dev/null
          login_payload="$(jq -nc --arg email "${DEMO_LOGIN_EMAIL:-dev@citeladder.com}" --arg password "$DEMO_LOGIN_PASSWORD" '{email:$email,password:$password}')"
          login_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'content-type: application/json' --data "$login_payload" \
            "https://$DOMAIN_NAME/api/v1/auth/login")"
          if test "$login_status" != 200; then
            echo "::error::Configured live dev login returned HTTP $login_status"
            exit 1
          fi
          # A dead "Continue with Google" is a 503 behind a button, not a failed
          # deploy, so assert the catalog reports Google usable.
          curl --fail --silent --show-error "https://$DOMAIN_NAME/api/v1/auth/oauth/providers" \
            | jq -e '[.providers[] | select(.provider == "google" and .configured)] | length == 1' >/dev/null
          # The Vite document is client-rendered; verify the deploy serves its shell.
          register_page="$(curl --fail --silent --show-error "https://$DOMAIN_NAME/register")"
          grep -q '<div id="root"></div>' <<<"$register_page"
          if test "$DEMO_MODE" = "true"; then
            registration_payload="$(jq -nc --arg email "$DEMO_LOGIN_EMAIL" --arg password "$(openssl rand -hex 16)" \
              '{email:$email,password:$password}')"
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -X POST -H 'content-type: application/json' --data "$registration_payload" \
              "https://$DOMAIN_NAME/api/v1/auth/register")
            test "$status" = 403
          fi
          {
            echo '### GCP demo deployment'
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Backend: \`$BACKEND_IMAGE\`"
            echo "- Frontend: \`$FRONTEND_IMAGE\`"
            echo "- Static IP: \`$STATIC_IP\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: AWS Demo - Domain

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  certificate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-demo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify protected commit
        shell: bash
        run: test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.10.5
      - name: Request certificate
        working-directory: infra/terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        shell: bash
        run: |
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
          terraform apply -input=false -auto-approve -target=aws_acm_certificate.site \
            -var='backend_image=invalid.example/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
            -var='frontend_image=invalid.example/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' \
            -var='demo_expires_at=2099-01-01T00:00:00Z' \
            -var='cloudflare_ipv4_cidrs=["173.245.48.0/20"]' \
            -var='cloudflare_ipv6_cidrs=["2400:cb00::/32"]'
          terraform output -json certificate_validation_records

name: AWS Demo - Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  confirm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require exact confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: test "$CONFIRMATION" = DESTROY
  destroy:
    needs: confirm
    uses: ./.github/workflows/aws-demo-destroy-reusable.yml
    permissions:
      contents: read
      id-token: write

name: AWS Demo - Origin Ranges

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: aws-demo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify protected commit
        shell: bash
        run: test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_CONTROL_ROLE_ARN }}
          aws-region: us-east-1
      - name: Reconcile Cloudflare-only ingress
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://www.cloudflare.com/ips-v4 > /tmp/v4
          curl --fail --silent --show-error https://www.cloudflare.com/ips-v6 > /tmp/v6
          test -s /tmp/v4 && test -s /tmp/v6
          ! grep -Fxq '0.0.0.0/0' /tmp/v4 && ! grep -Fxq '::/0' /tmp/v6
          sg=$(aws ec2 describe-security-groups --filters Name=group-name,Values=citeladder-demo-alb --query 'SecurityGroups[0].GroupId' --output text)
          test "$sg" != None
          aws ec2 describe-security-group-rules --filters Name=group-id,Values="$sg" --query 'SecurityGroupRules[?IsEgress==`false`].[SecurityGroupRuleId,CidrIpv4,CidrIpv6,FromPort,ToPort]' --output json > /tmp/current.json
          jq -r '.[]|select(.[3]==80 or .[3]==443)|.[0]' /tmp/current.json | while read -r rule; do
            test -z "$rule" || aws ec2 revoke-security-group-ingress --group-id "$sg" --security-group-rule-ids "$rule" >/dev/null
          done
          while read -r cidr; do
            aws ec2 authorize-security-group-ingress --group-id "$sg" --ip-permissions "IpProtocol=tcp,FromPort=80,ToPort=80,IpRanges=[{CidrIp=$cidr}]" >/dev/null
            aws ec2 authorize-security-group-ingress --group-id "$sg" --ip-permissions "IpProtocol=tcp,FromPort=443,ToPort=443,IpRanges=[{CidrIp=$cidr}]" >/dev/null
          done < /tmp/v4
          while read -r cidr; do
            aws ec2 authorize-security-group-ingress --group-id "$sg" --ip-permissions "IpProtocol=tcp,FromPort=80,ToPort=80,Ipv6Ranges=[{CidrIpv6=$cidr}]" >/dev/null
            aws ec2 authorize-security-group-ingress --group-id "$sg" --ip-permissions "IpProtocol=tcp,FromPort=443,ToPort=443,Ipv6Ranges=[{CidrIpv6=$cidr}]" >/dev/null
          done < /tmp/v6

name: GCP Demo - Expiry Guard

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stop-expired:
    runs-on: ubuntu-latest
    environment: gcp-demo
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Stop the VM after the fixed deadline
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ZONE: ${{ vars.GCP_ZONE }}
          DEMO_EXPIRES_AT: ${{ vars.DEMO_EXPIRES_AT }}
        run: |
          set -euo pipefail
          if [ "$(date -u +%s)" -ge "$(date -u -d "$DEMO_EXPIRES_AT" +%s)" ]; then
            status=$(gcloud compute instances list --project "$PROJECT_ID" \
              --filter="name=citeladder-demo AND zone:($ZONE)" --format='value(status)')
            case "$status" in
              ""|TERMINATED|STOPPING) ;;
              RUNNING|PROVISIONING|STAGING|SUSPENDING|SUSPENDED)
                gcloud compute instances stop citeladder-demo --project "$PROJECT_ID" --zone "$ZONE" --quiet
                ;;
              *) echo "Unexpected VM status: $status" >&2; exit 1 ;;
            esac
          fi

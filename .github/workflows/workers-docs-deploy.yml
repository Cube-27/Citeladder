name: Documentation Worker delivery

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: workers-docs-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Up to 30 minutes waiting for CI (require-green-main), then the build.
    timeout-minutes: 50
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-green-main
      - uses: ./.github/actions/setup-frontend
      - run: pnpm --dir frontend build:docs
      - name: Upload immutable documentation artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-${{ github.sha }}
          path: frontend/apps/docs/dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: workers-docs-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-${{ github.sha }}
          path: frontend/apps/docs/dist/
      # Fontshare-licensed faces come from the private font repo straight into
      # the deployed output, never into the uploaded build artifact.
      - name: Pull licensed fonts
        env:
          GH_TOKEN: ${{ secrets.FONTS_REPO_TOKEN }}
        shell: bash
        run: |
          test -n "$GH_TOKEN"
          node frontend/scripts/pull-licensed-fonts.mjs frontend/apps/docs/dist/fonts
      - name: Deploy documentation Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm deploy:docs
      - name: Release record
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: |
          {
            echo '## Documentation Worker release'
            echo 'Target: production'
            echo "Source: $GITHUB_SHA"
            echo "Artifact digest: $ARTIFACT_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

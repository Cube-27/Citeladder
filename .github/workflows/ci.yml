name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Supersede in-flight PR runs only. `main` and `merge_group` runs each get a
# unique group (run_id), so a queued merge or a branch push is never cancelled
# by a later one -- those results are the record, not a preview.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deny by default; every job grants what it needs.
permissions: {}

jobs:
  changes:
    name: Classify affected owners
    permissions:
      actions: read
      contents: read
    # This is a short Node/Git/API task. The container-based slim runner avoids
    # provisioning a full CI VM before owner jobs can be selected.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      contract: ${{ steps.classify.outputs.contract }}
      api: ${{ steps.classify.outputs.api }}
      e2e: ${{ steps.classify.outputs.e2e }}
      e2e_args: ${{ steps.classify.outputs.e2e_args }}
      security: ${{ steps.classify.outputs.security }}
      infra: ${{ steps.classify.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The classifier decides every other job's scope, so prove it here rather
      # than on a second runner that checks out the same tree to do nothing else.
      - name: CI classifier tests
        run: node --test scripts/*.test.mjs
      - name: Select required owners
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_HEAD_REF: ${{ github.head_ref }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_WORKFLOW_FILE: ci.yml
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-changes.mjs

  # Vitest runs in the frontend-tests shards below.
  frontend:
    name: Frontend (quality, docs)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    env:
      # Production-mode quality builds use the accepted public origins.
      PUBLIC_WEBSITE_ORIGIN: https://citeladder.com
      PUBLIC_APP_ORIGIN: https://app.citeladder.com
      PUBLIC_API_ORIGIN: https://api.citeladder.com
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Design policy tests
        run: node --test ../scripts/frontend/*.test.mjs
      - name: Frontend quality
        env:
          COMPLEXITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm quality:check -- --scope frontend
      - name: Test duplication advisory
        run: pnpm report:duplicates:tests
      - name: Install docs test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Documentation browser checks
        run: |
          log="$(git rev-parse --absolute-git-dir)/docs-browser.log"
          if pnpm test:docs > "$log" 2>&1; then
            echo 'Documentation browser checks passed.'
          else
            status=$?
            tail -n 80 "$log"
            exit "$status"
          fi

  # The whole Vitest suite, split by file across parallel runners: a private
  # repository's runner has 2 vCPUs, which the config's 2 workers already fill,
  # so more runners is the only way to more cores. Every shard runs the full
  # config; together they run every file exactly once.
  frontend-tests:
    name: Frontend tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Vitest with measured coverage
        env:
          SHARD: ${{ matrix.shard }}/3
        run: |
          log="$RUNNER_TEMP/frontend-vitest.log"
          if pnpm test:coverage --shard="$SHARD" > "$log" 2>&1; then
            echo "Frontend Vitest shard $SHARD passed."
            tail -n 8 "$log"
          else
            status=$?
            echo "Frontend Vitest shard $SHARD failed (exit $status); last 120 log lines:"
            tail -n 120 "$log"
            exit "$status"
          fi
      - name: Publish failed frontend test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-vitest-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/frontend-vitest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Publish frontend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-coverage-${{ matrix.shard }}
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 7

  contract:
    name: API contract and ingress
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Native contract validation
        run: pnpm quality:check -- --scope contract

  api:
    name: API service (TypeScript)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citeladder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CITELADDER_DISABLE_DOTENV: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citeladder
      TYPES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citeladder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Apply the SQL schema baseline
        working-directory: frontend/services/api
        run: pnpm migrate
      - name: API service quality (types, schema authority, route ownership)
        working-directory: frontend
        run: node ../scripts/quality.mjs --mode check --scope api
      - name: Generated database types match the migrated schema
        working-directory: frontend/services/api
        run: pnpm db:types:check

  # The API suite runs its files one at a time against one database, so it is
  # split by file across parallel runners, each with its own PostgreSQL. Every
  # shard applies the same baseline; together they run every file exactly once.
  api-tests:
    name: API service tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citeladder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CITELADDER_DISABLE_DOTENV: '1'
      # The SQL baseline authors the schema; the migrate CLI applies it once.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citeladder
      TYPES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citeladder
      API_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citeladder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Apply the SQL schema baseline
        working-directory: frontend/services/api
        run: pnpm migrate
      - name: API service tests (PostgreSQL)
        working-directory: frontend/services/api
        run: pnpm test --shard=${{ matrix.shard }}/3

  e2e:
    name: E2E (playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      # Not cached on purpose. Measured across recent runs this whole step is
      # 20-32s, most of it the `--with-deps` apt install, which no browser
      # cache can skip. A cache restore would save ~10s and cost its own
      # restore time, so it does not pay for the extra moving part.
      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Playwright
        env:
          E2E_FILES: ${{ needs.changes.outputs.e2e_args }}
        run: |
          read -r -a e2e_files <<< "$E2E_FILES"
          log="$RUNNER_TEMP/playwright.log"
          if pnpm exec playwright test --config playwright.config.ts "${e2e_files[@]}" > "$log" 2>&1; then
            echo 'Playwright passed.'
          else
            status=$?
            echo "Playwright failed (exit $status); first server errors:"
            grep -m 5 -E '\[WebServer\].*\[ERROR\]' "$log" || true
            echo 'Last 120 log lines:'
            tail -n 120 "$log"
            exit "$status"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/playwright.log
          if-no-files-found: warn
          retention-days: 7

  security:
    name: Security (secrets scan)
    needs: changes
    if: needs.changes.outputs.security == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Secrets scan (reviewed allowlist in .gitleaks.toml)
        run: |
          # Scan the checked-out tree, not the Git object store.
          rm -rf .git
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact --config .gitleaks.toml

  infra:
    name: Infra (Terraform and workflows)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Terraform format and validate (no backend, no credentials)
        working-directory: infra/gcp
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Install actionlint (pinned, checksum-verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Supersede in-flight PR runs only. `main` and `merge_group` runs each get a
# unique group (run_id), so a queued merge or a branch push is never cancelled
# by a later one -- those results are the record, not a preview.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    name: Classify affected owners
    permissions:
      actions: read
      contents: read
    # The slim runner queue left PRs unassigned past their timeout (2026-11-17).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      contract: ${{ steps.classify.outputs.contract }}
      api: ${{ steps.classify.outputs.api }}
      e2e: ${{ steps.classify.outputs.e2e }}
      e2e_args: ${{ steps.classify.outputs.e2e_args }}
      workers: ${{ steps.classify.outputs.workers }}
      security: ${{ steps.classify.outputs.security }}
      infra: ${{ steps.classify.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI classifier tests
        run: node --test scripts/*.test.mjs
      - name: Source token size
        env:
          TOKEN_SIZE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node frontend/scripts/check-token-size.mjs --base "$TOKEN_SIZE_BASE"
      - name: Select required owners
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_HEAD_REF: ${{ github.head_ref }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_WORKFLOW_FILE: ci.yml
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-changes.mjs

  frontend:
    name: Frontend (quality, docs)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: ./.github/actions/app-build-config
        with:
          logo-dev-publishable: ${{ vars.LOGO_DEV_PUBLISHABLE }}
          turnstile-site-key: ${{ vars.APP_TURNSTILE_SITE_KEY }}
          self-serve-signup: ${{ vars.SELF_SERVE_SIGNUP }}
      - name: Design policy tests
        run: node --test ../scripts/frontend/*.test.mjs
      - name: Frontend quality
        env:
          COMPLEXITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm quality:check -- --scope frontend
      - name: Test duplication advisory
        run: pnpm report:duplicates:tests
      - name: Install docs test browser
        run: pnpm exec playwright install --only-shell chromium
      - name: Documentation browser checks
        run: |
          log="$(git rev-parse --absolute-git-dir)/docs-browser.log"
          if pnpm test:docs > "$log" 2>&1; then
            echo 'Documentation browser checks passed.'
          else
            status=$?
            tail -n 80 "$log"
            exit "$status"
          fi

  frontend-tests:
    name: Frontend tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_MAX_WORKERS: '4'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Vitest with measured coverage
        env:
          SHARD: ${{ matrix.shard }}/3
        run: |
          log="$RUNNER_TEMP/frontend-vitest.log"
          if pnpm test:coverage --shard="$SHARD" > "$log" 2>&1; then
            echo "Frontend Vitest shard $SHARD passed."
            tail -n 8 "$log"
          else
            status=$?
            echo "Frontend Vitest shard $SHARD failed (exit $status); last 120 log lines:"
            tail -n 120 "$log"
            exit "$status"
          fi
      - name: Publish failed frontend test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-vitest-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/frontend-vitest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Publish frontend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-coverage-${{ matrix.shard }}
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 7

  contract:
    name: API contract and ingress
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Native contract validation
        run: pnpm quality:check -- --scope contract

  api:
    name: API service (TypeScript)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # The production image (infra/gcp/postgres/Dockerfile), same tag and digest.
        image: postgres:16-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citeladder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      CITELADDER_DISABLE_DOTENV: '1'
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citeladder
      DATABASE_URL: postgresql://citeladder_app:postgres@localhost:5432/citeladder
      TYPES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citeladder
    steps:
      # Full history: the ratchets compare their policy with the PR base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Apply the SQL schema baseline
        working-directory: frontend/services/api
        run: pnpm migrate
      - name: API service quality (types, schema authority, route ownership, table writers, ratchets)
        working-directory: frontend
        env:
          COMPLEXITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node ../scripts/quality.mjs --mode check --scope api
      - name: Generated database types match the migrated schema
        working-directory: frontend/services/api
        run: pnpm db:types:check

  api-tests:
    name: API service tests (${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        # The production image (infra/gcp/postgres/Dockerfile), same tag and digest.
        image: postgres:16-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citeladder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      CITELADDER_DISABLE_DOTENV: '1'
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citeladder
      DATABASE_URL: postgresql://citeladder_app:postgres@localhost:5432/citeladder
      TYPES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citeladder
      API_TEST_DATABASE_URL: postgresql://citeladder_app:postgres@localhost:5432/citeladder
      API_TEST_OWNER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citeladder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Apply the SQL schema baseline
        working-directory: frontend/services/api
        run: pnpm migrate
      - name: API service tests with measured coverage (PostgreSQL)
        working-directory: frontend/services/api
        env:
          SHARD: ${{ matrix.shard }}/6
        run: pnpm test --coverage --shard="$SHARD"
      - name: Publish API coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-coverage-${{ matrix.shard }}
          path: frontend/services/api/coverage/
          if-no-files-found: error
          retention-days: 7

  site-health-scale:
    name: Site Health scale fixture
    needs: changes
    if: needs.changes.outputs.api == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citeladder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      CITELADDER_DISABLE_DOTENV: '1'
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citeladder
      DATABASE_URL: postgresql://citeladder_app:postgres@localhost:5432/citeladder
      API_TEST_DATABASE_URL: postgresql://citeladder_app:postgres@localhost:5432/citeladder
      API_TEST_OWNER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citeladder
      SITE_HEALTH_SCALE_PAGES: '5000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Apply the SQL schema baseline
        working-directory: frontend/services/api
        run: pnpm migrate
      - name: Site Health crawl at 5,000 pages (PostgreSQL)
        working-directory: frontend/services/api
        run: pnpm test:scale

  e2e:
    name: E2E (playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      # No `--with-deps`: on the ubuntu runner image it installed only nine
      # font packages (CJK, Thai, Unifont, FreeFont, X fonts) that no page
      # here renders, and that apt download from the Ubuntu mirror once took
      # 9.5 of an 11-minute job. The image already has every library
      # Chromium links; if one ever goes missing, Playwright names it at
      # launch. `--only-shell`: the tests run headless, which uses only the
      # headless shell, so the full Chrome build is not downloaded.
      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install --only-shell chromium
      # Built here, not by playwright.config.ts's webServer, whose 60 s start
      # timeout the two builds overran. Env matches the webServer entries.
      - name: Build the app and marketing site
        env:
          PUBLIC_WEBSITE_ORIGIN: http://127.0.0.1:3101
          PUBLIC_APP_ORIGIN: http://127.0.0.1:3100
          LOCAL_COMPOSE_BUILD: 'true'
        run: |
          log="$RUNNER_TEMP/e2e-builds.log"
          if pnpm build:vite > "$log" 2>&1 && NEXT_PUBLIC_GA_MEASUREMENT_ID=G-CONSENTTEST pnpm build:marketing >> "$log" 2>&1; then
            echo 'E2E builds passed.'
          else
            status=$?
            tail -n 120 "$log"
            exit "$status"
          fi
      - name: Playwright
        env:
          E2E_PREBUILT: '1'
          E2E_FILES: ${{ needs.changes.outputs.e2e_args }}
        run: |
          read -r -a e2e_files <<< "$E2E_FILES"
          log="$RUNNER_TEMP/playwright.log"
          if pnpm exec playwright test --config playwright.config.ts "${e2e_files[@]}" > "$log" 2>&1; then
            echo 'Playwright passed. Per-test durations:'
            grep -E '\[(app|marketing)\] › |^ +[0-9]+ (passed|flaky|skipped)' "$log" || true
          else
            status=$?
            echo "Playwright failed (exit $status); first server errors:"
            grep -m 5 -E '\[WebServer\].*\[ERROR\]' "$log" || true
            echo 'Last 120 log lines:'
            tail -n 120 "$log"
            exit "$status"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/playwright.log
            ${{ runner.temp }}/e2e-builds.log
          if-no-files-found: warn
          retention-days: 7

  workers:
    name: Worker CSP and consent (playwright)
    needs: changes
    if: needs.changes.outputs.workers == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_WEBSITE_ORIGIN: https://citeladder.com
      PUBLIC_APP_ORIGIN: https://app.citeladder.com
      PUBLIC_API_ORIGIN: https://api.citeladder.com
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-CONSENTTEST
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Build the app and marketing Workers
        run: |
          log="$RUNNER_TEMP/worker-builds.log"
          if pnpm build:app > "$log" 2>&1 && pnpm build:marketing >> "$log" 2>&1; then
            echo 'Worker builds passed.'
          else
            status=$?
            tail -n 120 "$log"
            exit "$status"
          fi
      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install --only-shell chromium
      - name: Playwright (built Workers)
        run: pnpm test:workers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-workers-report
          path: |
            frontend/test-results/workers/
            ${{ runner.temp }}/worker-builds.log
          if-no-files-found: warn
          retention-days: 7

  security:
    name: Security (secrets scan)
    needs: changes
    if: needs.changes.outputs.security == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Secrets scan (reviewed allowlist in .gitleaks.toml)
        run: |
          # Scan the checked-out tree, not the Git object store.
          rm -rf .git
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact --config .gitleaks.toml

  infra:
    name: Infra (Terraform and workflows)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Terraform format and validate (no backend, no credentials)
        working-directory: infra/gcp
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Install actionlint (pinned, checksum-verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  # The status the `main` ruleset requires for this workflow (Compose smoke has
  # its own `Compose smoke result`). Owner jobs are selected per
  # change, and GitHub reports a job skipped by its condition as successful,
  # so requiring each job by name would also pass a run whose classifier
  # failed. This passes only when the classifier passed and every selected
  # owner passed; an owner skipped because it was not selected is fine.
  result:
    name: CI result
    needs:
      [
        changes,
        frontend,
        frontend-tests,
        contract,
        api,
        api-tests,
        site-health-scale,
        e2e,
        workers,
        security,
        infra,
      ]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every selected owner passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const needs = JSON.parse(process.env.NEEDS);
            const failed = Object.entries(needs).filter(([job, { result }]) =>
              job === "changes" ? result !== "success" : !["success", "skipped"].includes(result),
            );
            for (const [job, { result }] of Object.entries(needs)) console.log(job + ": " + result);
            if (failed.length) {
              console.error("Failed or incomplete: " + failed.map(([job]) => job).join(", "));
              process.exit(1);
            }
          '

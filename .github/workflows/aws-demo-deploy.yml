name: AWS Demo - Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citeladder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/citeladder
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact main commit
        shell: pwsh
        run: |
          if ($env:GITHUB_SHA -ne (git rev-parse origin/main)) { throw 'Only exact main may deploy' }
      - name: Install test toolchain
        shell: bash
        run: |
          python -m pip install uv==0.11.28
          uv sync --project backend --frozen --extra dev
          npm install --global --ignore-scripts pnpm@11.22.0
          pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - name: Run repository gates for the deployed commit
        shell: pwsh
        run: |
          ./scripts/check.ps1 -CheckOnly
          $changed = @(git diff --name-only "$env:GITHUB_SHA^" $env:GITHUB_SHA)
          if ($changed.Count -eq 0) { throw 'Deploy commit has no auditable change set' }
          ./scripts/test.ps1 -ChangedFiles $changed
      - name: Build immutable inputs
        shell: bash
        run: |
          docker build --build-arg BUILD_REVISION="$GITHUB_SHA" -t citeladder-backend:"$GITHUB_SHA" .
          docker build \
            --build-arg BUILD_REVISION="$GITHUB_SHA" \
            --build-arg BACKEND_ORIGIN=http://127.0.0.1:8000 \
            --build-arg CITELADDER_TASK_LOCAL_BACKEND=true \
            --build-arg NEXT_PUBLIC_DEMO_MODE=true \
            --build-arg NEXT_PUBLIC_SITE_URL=https://citeladder.com \
            -t citeladder-frontend:"$GITHUB_SHA" -f frontend/Dockerfile .
          docker save citeladder-backend:"$GITHUB_SHA" citeladder-frontend:"$GITHUB_SHA" | gzip -1 > /tmp/citeladder-images.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: citeladder-images-${{ github.sha }}
          path: /tmp/citeladder-images.tar.gz
          retention-days: 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: aws-demo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: citeladder-images-${{ github.sha }}
          path: /tmp
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.10.5
      - name: Provision, publish, and deploy
        working-directory: infra/terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          PROVIDER_MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PROVIDER_DEFAULT_AGENT_API_KEY: ${{ secrets.DEFAULT_AGENT_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
          terraform fmt -check
          terraform validate

          expiry=$(aws ssm get-parameter --name /citeladder/demo/expires-at --query 'Parameter.Value' --output text 2>/dev/null || true)
          if [ -z "$expiry" ]; then expiry=$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ); fi
          curl --fail --silent --show-error https://www.cloudflare.com/ips-v4 > /tmp/cf-v4
          curl --fail --silent --show-error https://www.cloudflare.com/ips-v6 > /tmp/cf-v6
          test -s /tmp/cf-v4 && test -s /tmp/cf-v6
          ! grep -Fxq '0.0.0.0/0' /tmp/cf-v4
          ! grep -Fxq '::/0' /tmp/cf-v6

          jq -n --arg expiry "$expiry" \
            --arg backend 'invalid.example/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
            --arg frontend 'invalid.example/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' \
            --argjson v4 "$(jq -Rsc 'split("\n")|map(select(length>0))' /tmp/cf-v4)" \
            --argjson v6 "$(jq -Rsc 'split("\n")|map(select(length>0))' /tmp/cf-v6)" \
            '{demo_expires_at:$expiry,backend_image:$backend,frontend_image:$frontend,cloudflare_ipv4_cidrs:$v4,cloudflare_ipv6_cidrs:$v6}' > demo.auto.tfvars.json

          terraform apply -input=false -auto-approve \
            -target=aws_ecr_repository.backend -target=aws_ecr_repository.frontend \
            -target=aws_secretsmanager_secret.runtime -target=aws_db_instance.demo \
            -target=aws_cloudwatch_log_group.demo -target=aws_ssm_parameter.expires_at

          docker load < <(gzip -dc /tmp/citeladder-images.tar.gz)
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="$account.dkr.ecr.us-east-1.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          for image in backend frontend; do
            docker tag "citeladder-$image:$GITHUB_SHA" "$registry/citeladder-demo-$image:$GITHUB_SHA"
            docker push "$registry/citeladder-demo-$image:$GITHUB_SHA"
            aws ecr wait image-scan-complete --repository-name "citeladder-demo-$image" --image-id imageTag="$GITHUB_SHA"
            findings=$(aws ecr describe-image-scan-findings --repository-name "citeladder-demo-$image" --image-id imageTag="$GITHUB_SHA" --output json)
            test "$(jq '((.imageScanFindings.findingSeverityCounts.CRITICAL // 0) + (.imageScanFindings.findingSeverityCounts.HIGH // 0))' <<<"$findings")" -eq 0
          done
          backend_digest=$(aws ecr describe-images --repository-name citeladder-demo-backend --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          frontend_digest=$(aws ecr describe-images --repository-name citeladder-demo-frontend --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          jq --arg backend "$registry/citeladder-demo-backend@$backend_digest" --arg frontend "$registry/citeladder-demo-frontend@$frontend_digest" '.backend_image=$backend|.frontend_image=$frontend' demo.auto.tfvars.json > /tmp/tfvars
          mv /tmp/tfvars demo.auto.tfvars.json

          runtime_arn=$(terraform output -raw runtime_secret_arn)
          rds_secret=$(terraform output -raw rds_master_secret_arn)
          rds_host=$(terraform output -raw rds_endpoint)
          db_password=$(aws secretsmanager get-secret-value --secret-id "$rds_secret" --query SecretString --output text | jq -r .password)
          db_encoded=$(DB_PASSWORD="$db_password" python -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["DB_PASSWORD"],safe=""))')
          current=$(aws secretsmanager get-secret-value --secret-id "$runtime_arn" --query SecretString --output text 2>/dev/null || echo '{}')
          jwt=$(jq -r '.JWT_SECRET_KEY // empty' <<<"$current"); test -n "$jwt" || jwt=$(openssl rand -base64 64 | tr -d '\n')
          encryption=$(jq -r '.ENCRYPTION_KEY // empty' <<<"$current"); test -n "$encryption" || encryption=$(openssl rand -base64 64 | tr -d '\n')
          referral=$(jq -r '.REFERRAL_HASH_SALT // empty' <<<"$current"); test -n "$referral" || referral=$(openssl rand -base64 64 | tr -d '\n')
          demo_password=$(jq -r '.DEV_LOGIN_PASSWORD // empty' <<<"$current"); test -n "$demo_password" || demo_password=$(openssl rand -base64 32 | tr -d '\n')
          echo "::add-mask::$jwt"
          echo "::add-mask::$encryption"
          echo "::add-mask::$referral"
          echo "::add-mask::$demo_password"
          echo "::add-mask::$db_password"
          printf '%s\n' "$jwt" "$encryption" "$referral" "$demo_password" "$db_password" | awk 'length < 32 {exit 1} {if(seen[$0]++) exit 1}'
          jq -n --arg db "postgresql+asyncpg://citeladder:$db_encoded@$rds_host:5432/citeladder" \
            --arg jwt "$jwt" --arg encryption "$encryption" --arg referral "$referral" --arg demo "$demo_password" \
            --arg mistral "$PROVIDER_MISTRAL_API_KEY" --arg agent "$PROVIDER_DEFAULT_AGENT_API_KEY" \
            '{DATABASE_URL:$db,JWT_SECRET_KEY:$jwt,ENCRYPTION_KEY:$encryption,REFERRAL_HASH_SALT:$referral,DEV_LOGIN_PASSWORD:$demo}
             + (if $mistral=="" then {} else {MISTRAL_API_KEY:$mistral} end)
             + (if $agent=="" then {} else {DEFAULT_AGENT_API_KEY:$agent} end)' > /tmp/runtime-secret.json
          chmod 600 /tmp/runtime-secret.json
          aws secretsmanager put-secret-value --secret-id "$runtime_arn" --secret-string file:///tmp/runtime-secret.json >/dev/null
          rm -f /tmp/runtime-secret.json

          terraform apply -input=false -auto-approve
          aws ecs wait services-stable --cluster citeladder-demo --services citeladder-demo
          echo "DEMO_EXPIRES_AT=$expiry"
          terraform output -raw demo_url

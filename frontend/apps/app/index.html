<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="text-scale" content="scale" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <script src="/theme-preference.js"></script>
    <style>
      .boot-shell {
        position: fixed;
        inset: 0;
        display: flex;
        background: var(--color-ground);
        color: var(--text-color-ink-2);
        font: var(--weight-regular) var(--text-body) / var(--text-body--line-height)
          var(--font-sans);
      }
      .boot-shell * {
        box-sizing: border-box;
      }
      .boot-shell:not([data-boot-shell]) > * {
        display: none;
      }
      .boot-side {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: calc(var(--spacing) * 2);
        overflow: hidden;
        width: var(--boot-side-width, var(--spacing-sidebar-compact));
        padding: calc(var(--spacing) * 2);
      }
      .boot-main {
        flex: 1;
        min-width: 0;
        margin: var(--spacing-shell-inset);
        margin-inline-start: 0;
        border-radius: var(--radius-card);
        box-shadow: 0 0 0 var(--rule-width) color-mix(in oklab, var(--color-rule) 50%, transparent);
        background: var(--color-page);
      }
      .boot-mast {
        display: flex;
        align-items: center;
        gap: calc(var(--spacing) * 2);
        height: var(--spacing-masthead);
        padding-inline: var(--spacing-page-inline);
        border-block-end: var(--rule-width) solid var(--color-rule);
      }
      .boot-section {
        display: flex;
        flex: none;
        align-items: center;
        gap: calc(var(--spacing) * 2);
        white-space: nowrap;
      }
      .boot-section::after {
        content: '';
        width: calc(var(--spacing) * 3);
        height: calc(var(--spacing) * 4);
      }
      .boot-title {
        overflow: hidden;
        color: var(--text-color-ink);
        font-weight: var(--text-label--font-weight);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .boot-section:empty,
      .boot-mode,
      .boot-list,
      .boot-foot,
      .boot-rows {
        display: none;
      }
      .boot-shell[data-boot-mode] .boot-mode {
        display: grid;
      }
      .boot-shell[data-boot-mode] .boot-list {
        display: block;
      }
      .boot-shell[data-boot-mode] .boot-foot,
      .boot-shell[data-boot-mode='dashboard'] .boot-rows {
        display: flex;
      }
      .boot-ident {
        display: flex;
        flex: none;
        align-items: center;
        height: var(--spacing-masthead);
      }
      .boot-switcher,
      .boot-account {
        display: block;
        height: var(--spacing-control-lg);
        border-radius: var(--radius-control);
        background: var(--color-well);
      }
      .boot-switcher {
        flex: 1;
        margin-inline-end: calc(var(--spacing) * 16);
      }
      .boot-mode {
        flex: none;
        grid-template-columns: 1fr 1fr;
        height: var(--spacing-tray);
        padding: var(--spacing-tray-inset);
        border-radius: var(--radius-control);
        background: var(--color-state-fill);
      }
      .boot-mode span {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-tray-item);
      }
      [data-boot-mode='dashboard'] [data-boot-seg='dashboard'],
      [data-boot-mode='agent'] [data-boot-seg='agent'] {
        background: var(--color-nav-current);
        box-shadow: var(--shadow-card);
        color: var(--text-color-ink);
      }
      .boot-list {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        padding-block: var(--spacing);
      }
      .boot-rows {
        flex-direction: column;
        gap: calc(var(--spacing) * 4);
      }
      .boot-group,
      .boot-foot {
        display: flex;
        flex-direction: column;
        gap: calc(var(--spacing) * 0.5);
      }
      .boot-row,
      .boot-group-title {
        display: block;
        height: var(--spacing-nav-row);
        overflow: hidden;
        line-height: var(--spacing-nav-row);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .boot-row {
        padding-inline: calc(var(--spacing) * 8) calc(var(--spacing) * 2);
        color: var(--text-color-nav-ink);
      }
      .boot-group + .boot-group {
        margin-top: calc(var(--spacing) * -2);
      }
      .boot-group-title {
        padding-inline: calc(var(--spacing) * 2);
        font-size: var(--text-caption);
        font-weight: var(--text-caption-strong--font-weight);
      }
      .boot-foot {
        flex: none;
      }
      .boot-account {
        width: calc(100% - var(--spacing) * 8.5);
      }
      @media (min-width: 1280px) {
        .boot-side {
          width: var(--boot-side-width, var(--spacing-sidebar));
        }
      }
      @media (pointer: coarse) {
        .boot-switcher {
          margin-inline-end: calc(var(--spacing) * 24);
        }
      }
      [data-sidebar-rail] .boot-side {
        width: var(--spacing-sidebar-rail);
      }
      [data-sidebar-rail] .boot-side > :not(.boot-ident) {
        display: none;
      }
      [data-sidebar-rail] .boot-ident {
        height: auto;
      }
      [data-sidebar-rail] .boot-switcher {
        flex: none;
        width: var(--spacing-rail-button);
        height: var(--spacing-rail-button);
        margin: 0;
      }
      @media (max-width: 899.98px) {
        .boot-side,
        .boot-section {
          display: none;
        }
        .boot-main {
          margin: 0;
          border-radius: 0;
          box-shadow: none;
        }
        .boot-mast {
          padding-inline-start: calc(
            var(--spacing-page-inline) + var(--spacing-control-md) + var(--spacing) * 2
          );
        }
      }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>CiteLadder · AI visibility with evidence you can open</title>
    <!-- brand-fonts -->
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-side"><!-- boot-sidebar --></div>
        <div class="boot-main">
          <div class="boot-mast">
            <span class="boot-section"></span><span class="boot-title"></span>
          </div>
        </div>
      </div>
    </div>
    <!-- Generated at build from the route manifest (apps/app/boot-shell.ts). -->
    <script src="/boot-title.js"></script>
    <script src="/browser-support.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <!-- Apply a stored dark preference before first paint so a dark reader
        never sees a light frame. Light is the default. The key must match
        THEME_STORAGE_KEY in lib/theme/theme.ts, which owns the preference. -->
    <script src="/theme-preference.js"></script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>CiteLadder · AI visibility with evidence you can open</title>
    <!-- The brand faces' preloads and @font-face rules, written at build time
        from lib/config/brand-fonts.json (vite.config.ts). The files are not in
        this repository: `pnpm fonts:pull` copies them into public/fonts from
        the private Cube27 font repo, and delivery does the same. A build
        without them renders in the metric-matched fallbacks. -->
    <!-- brand-fonts -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

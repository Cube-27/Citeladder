<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <title>CiteLadder · AI visibility with evidence you can open</title>
    <!-- Discover the font at first paint instead of after the JS bundle loads,
        so text does not render in the fallback stack and reflow when Geist
        arrives (`font-display: swap` makes that swap visible as a size shift).
        Mirrors the marketing layout's head declaration. -->
    <link
      rel="preload"
      href="/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('/fonts/Geist-Variable.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --font-geist: 'Geist';
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <!-- Apply a stored dark preference before first paint so a dark reader
        never sees a light frame. Light is the default. The key must match
        THEME_STORAGE_KEY in lib/theme/theme.ts, which owns the preference. -->
    <script src="/theme-preference.js"></script>
    <link rel="icon" href="/citeladder-favicon.ico" sizes="any" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>CiteLadder · AI visibility with evidence you can open</title>
    <!-- Discover the text face at first paint instead of after the stylesheet
        loads. Satoshi (text and product headings) and Sentient (focused-flow
        headings) are not in this repository: `pnpm fonts:pull` copies them
        into public/fonts from the private Cube27 font repo, and delivery does
        the same. A build without them renders in the fallbacks below. Only
        Satoshi is preloaded: Sentient loads when a flow heading uses it. -->
    <link
      rel="preload"
      href="/fonts/Satoshi-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <style>
      /* `font-display: fallback`: a ~100ms block period, then a ~3s window in
         which the font may still swap in, then a permanent commit to the
         fallback.

         Not `optional`: it commits after the block period alone and will NOT
         swap afterwards even when the font arrives moments later. A hard
         reload (Ctrl+Shift+R) bypasses the cache, so the file has to come
         off the network inside ~100ms and usually loses — the typeface then
         never renders, however long you wait.

         Not `swap` either, whose swap period is unbounded: on a bad
         connection it re-lays out the page whenever the font finally lands,
         long after the reader started reading. `fallback` bounds that to ~3s
         — enough for a preloaded, same-origin file on any connection that
         was going to succeed at all. */
      /* 600 is the design ceiling for both faces: a heavier request clamps
         to it. */
      @font-face {
        font-family: 'Satoshi Variable';
        src: url('/fonts/Satoshi-Variable.woff2') format('woff2');
        font-weight: 300 600;
        font-style: normal;
        font-display: fallback;
      }
      @font-face {
        font-family: 'Sentient Variable';
        src: url('/fonts/Sentient-Variable.woff2') format('woff2');
        font-weight: 200 600;
        font-style: normal;
        font-display: fallback;
      }

      /* Match Arial's x-height to Satoshi's (0.500em vs 0.519em). Vertical
         overrides use Satoshi's 1010/-240/100 hhea metrics (1000 UPM),
         divided by size-adjust. Use the native bold face at weight 600. */
      @font-face {
        font-family: 'Satoshi Fallback';
        src: local('Arial');
        font-weight: 100 500;
        size-adjust: 96.42%;
        ascent-override: 104.75%;
        descent-override: 24.89%;
        line-gap-override: 10.37%;
      }
      @font-face {
        font-family: 'Satoshi Fallback';
        src: local('Arial Bold'), local('Arial-BoldMT');
        font-weight: 600;
        size-adjust: 96.42%;
        ascent-override: 104.75%;
        descent-override: 24.89%;
        line-gap-override: 10.37%;
      }

      /* Match Georgia's x-height to Sentient's (0.504em vs 0.481em). Vertical
         overrides use Sentient's 960/-320/80 hhea metrics (1000 UPM), divided
         by size-adjust. */
      @font-face {
        font-family: 'Sentient Fallback';
        src: local('Georgia');
        font-weight: 100 500;
        size-adjust: 104.69%;
        ascent-override: 91.7%;
        descent-override: 30.57%;
        line-gap-override: 7.64%;
      }
      @font-face {
        font-family: 'Sentient Fallback';
        src: local('Georgia Bold'), local('Georgia-Bold');
        font-weight: 600;
        size-adjust: 104.69%;
        ascent-override: 91.7%;
        descent-override: 30.57%;
        line-gap-override: 7.64%;
      }

      :root {
        --font-text: 'Satoshi Variable', 'Satoshi Fallback', Arial;
        --font-heading: var(--font-text);
        /* Public and focused-flow headings only (website-type.css). */
        --font-editorial: 'Sentient Variable', 'Sentient Fallback', Georgia;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

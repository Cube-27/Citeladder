<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <title>CiteLadder · AI visibility with evidence you can open</title>
    <!-- Discover the font at first paint instead of after the JS bundle loads,
        so text does not render in the fallback stack and reflow when Geist
        arrives (`font-display: swap` makes that swap visible as a size shift).
        Mirrors the marketing layout's head declaration. -->
    <link
      rel="preload"
      href="/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('/fonts/Geist-Variable.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        /* `optional`, not `swap`. With `swap` the fallback paints immediately
           and Geist replaces it whenever it lands — the visible mid-page font
           change on a cold load. `optional` gives the font a short block
           period and then commits to one answer for the whole page load: no
           swap, and no reflow. The file is 29KB, same-origin and preloaded
           above, so it normally wins that window. */
        font-display: optional;
      }

      /* The fallback, matched to Geist's metrics.
         `optional` can still decide against the webfont on a genuinely cold
         connection, and an unmatched fallback would reflow the page when it
         does. These overrides make the substitute occupy the same space, so
         the difference is a glyph shape rather than a different layout. */
      @font-face {
        font-family: 'Geist Fallback';
        src: local('Segoe UI'), local('Helvetica Neue'), local('Arial');
        size-adjust: 102%;
        ascent-override: 93%;
        descent-override: 24%;
        line-gap-override: 0%;
      }

      :root {
        --font-geist: 'Geist', 'Geist Fallback';
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <!-- Apply a stored dark preference before first paint so a dark reader
        never sees a light frame. Light is the default. The key must match
        THEME_STORAGE_KEY in lib/theme/theme.ts, which owns the preference. -->
    <script src="/theme-preference.js"></script>
    <link rel="icon" href="/citeladder-favicon.ico" sizes="any" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>CiteLadder · AI visibility with evidence you can open</title>
    <!-- Discover the faces at first paint instead of after the stylesheet
        loads. Lexend Deca, Syne and the figure face are not in this repository:
        `pnpm fonts:pull` copies them into public/fonts from the private
        Cube27 font repo, and delivery does the same. A build without them
        renders in the fallbacks below. -->
    <link
      rel="preload"
      href="/fonts/LexendDeca-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/Syne-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/JetBrainsMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <style>
      /* `font-display: fallback`: a ~100ms block period, then a ~3s window in
         which the font may still swap in, then a permanent commit to the
         fallback.

         Not `optional`: it commits after the block period alone and will NOT
         swap afterwards even when the font arrives moments later. A hard
         reload (Ctrl+Shift+R) bypasses the cache, so the file has to come
         off the network inside ~100ms and usually loses — the typeface then
         never renders, however long you wait.

         Not `swap` either, whose swap period is unbounded: on a bad
         connection it re-lays out the page whenever the font finally lands,
         long after the reader started reading. `fallback` bounds that to ~3s
         — enough for a preloaded, same-origin file on any connection that
         was going to succeed at all. */
      /* 500 is the design ceiling: a heavier request, including the browser's
         own bold for strong, b and th, clamps to it, and `font-synthesis-weight:
         none` below stops a faux bold on top. */
      @font-face {
        font-family: 'Lexend Deca Variable';
        src: url('/fonts/LexendDeca-Variable.woff2') format('woff2');
        font-weight: 300 500;
        font-style: normal;
        font-display: fallback;
      }

      /* Syne's weight axis starts at 400, so its range starts there. */
      @font-face {
        font-family: 'Syne Variable';
        src: url('/fonts/Syne-Variable.woff2') format('woff2');
        font-weight: 400 500;
        font-style: normal;
        font-display: fallback;
      }

      /* The figure face sets numbers only: digits and the marks that sit
         inside a number (. , : % + - −). Letters and spaces fall through to
         Lexend Deca, so a figure's unit or a "Not measured" in a figure cell
         stays in the text face, and the line box keeps Lexend Deca's metrics
         (the first family that covers the space). Keep this range in step
         with the fallback below and both other runtimes. */
      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: url('/fonts/JetBrainsMono-Variable.woff2') format('woff2');
        font-weight: 300 500;
        font-style: normal;
        font-display: fallback;
        unicode-range: U+0025, U+002B-002E, U+0030-003A, U+2212;
      }

      /* Match Arial's x-height to Lexend Deca's (0.525em vs 0.519em). Vertical
         overrides use Lexend Deca's 1000/-250/0 hhea metrics (1000 UPM),
         divided by size-adjust. */
      @font-face {
        font-family: 'Lexend Deca Fallback';
        src: local('Arial');
        font-weight: 100 500;
        size-adjust: 101.16%;
        ascent-override: 98.86%;
        descent-override: 24.71%;
        line-gap-override: 0%;
      }

      /* Match Arial's x-height to Syne's (0.500em vs 0.519em). Vertical
         overrides use Syne's 925/-275/0 hhea metrics (1000 UPM), divided
         by size-adjust. */
      @font-face {
        font-family: 'Syne Fallback';
        src: local('Arial');
        font-weight: 100 500;
        size-adjust: 96.34%;
        ascent-override: 96.02%;
        descent-override: 28.55%;
        line-gap-override: 0%;
      }

      /* Scale Arial's tabular digits (0.556em) to JetBrains Mono's 0.600em
         advance, so a figure column keeps its width when the face swaps in.
         Vertical overrides use JetBrains Mono's 1020/-300/0 hhea metrics
         (1000 UPM), divided by size-adjust. */
      @font-face {
        font-family: 'JetBrains Mono Fallback';
        src: local('Arial');
        font-weight: 100 500;
        size-adjust: 107.88%;
        ascent-override: 94.55%;
        descent-override: 27.81%;
        line-gap-override: 0%;
        unicode-range: U+0025, U+002B-002E, U+0030-003A, U+2212;
      }

      :root {
        font-synthesis-weight: none;
        /* Lexend Deca carries body, UI and data; Syne carries display
           headings; the figure face sets the digits of figures in data roles
           (`--font-numeric` in globals.css), because Lexend Deca has no
           tabular figures (no `tnum`). */
        --font-text: 'Lexend Deca Variable', 'Lexend Deca Fallback', Arial;
        --font-heading: 'Syne Variable', 'Syne Fallback', Arial;
        --font-figure: 'JetBrains Mono Variable', 'JetBrains Mono Fallback';
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

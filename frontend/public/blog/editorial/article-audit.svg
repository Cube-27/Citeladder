="191" rx="8" fill="url(#blue-glass)" stroke="#DAE7FD" stroke-width="1.4" opacity=".93"/><path d="M18 21 H107 M18 29 H84" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><rect x="22" y="50" width="107" height="104" rx="4" fill="none" stroke="#FFFFFF" stroke-width="1.4" /><path d="M35 69 h53 m-53 15 h79 m-79 15 h64 m-64 15 h70" fill="none" stroke="#FFFFFF" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(247 140) skewY(25)"><rect x="0" y="0" width="151" height="191" rx="8" fill="url(#blue-glass)" stroke="#DAE7FD" stroke-width="1.4" opacity=".93"/><path d="M18 21 H107 M18 29 H84" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><circle cx="67" cy="92" r="22" fill="#F9FCFF" stroke="#7588A8" stroke-width="3"/><path d="M83 110 l22 24" fill="none" stroke="#7588A8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g></g></svg>
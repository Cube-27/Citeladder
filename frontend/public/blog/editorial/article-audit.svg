<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Content audit illustration</title><desc id="desc">Translucent document layers and a magnifying glass, with Audit, Map, Optimize, Verify labels.</desc>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--color-surface, #ffffff)" stop-opacity=".98"/><stop offset="1" stop-color="var(--color-paper, #f4f4f4)" stop-opacity=".84"/></linearGradient>
<linearGradient id="blue-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--color-surface, #ffffff)" stop-opacity=".93"/><stop offset=".52" stop-color="var(--color-info-soft, #e3edfc)" stop-opacity=".84"/><stop offset="1" stop-color="var(--color-stage-sky, #d2e2f8)" stop-opacity=".82"/></linearGradient>
<linearGradient id="green-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--color-surface, #ffffff)" stop-opacity=".96"/><stop offset="1" stop-color="var(--color-positive-soft, #d6f2ef)" stop-opacity=".88"/></linearGradient>
<linearGradient id="violet-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--color-surface, #ffffff)" stop-opacity=".96"/><stop offset="1" stop-color="var(--color-info-soft, #e3edfc)" stop-opacity=".87"/></linearGradient>
<linearGradient id="execute" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--color-positive, #0b6e69)"/><stop offset=".58" stop-color="var(--color-positive, #0b6e69)"/><stop offset="1" stop-color="var(--color-positive, #0b6e69)"/></linearGradient>
<radialGradient id="blue-haze"><stop stop-color="var(--color-stage-sky, #d2e2f8)" stop-opacity=".38"/><stop offset="1" stop-color="var(--color-info-soft, #e3edfc)" stop-opacity="0"/></radialGradient>
<radialGradient id="green-haze"><stop stop-color="var(--color-stage-mint, #cdeedf)" stop-opacity=".38"/><stop offset="1" stop-color="var(--color-paper, #f4f4f4)" stop-opacity="0"/></radialGradient>
<radialGradient id="violet-haze"><stop stop-color="var(--color-stage-lilac, #dfd6f7)" stop-opacity=".43"/><stop offset="1" stop-color="var(--color-info-soft, #e3edfc)" stop-opacity="0"/></radialGradient>
<linearGradient id="blue-area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="var(--color-info, #1f5fbf)" stop-opacity=".15"/><stop offset="1" stop-color="var(--color-positive-soft, #d6f2ef)" stop-opacity="0"/></linearGradient>
<linearGradient id="green-area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="var(--color-positive, #0b6e69)" stop-opacity=".15"/><stop offset="1" stop-color="var(--color-stage-mint, #cdeedf)" stop-opacity="0"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="var(--color-ink-secondary, #525252)" flood-opacity=".07"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M3 2 L7 6 L3 10" fill="none" stroke="var(--color-stage-mint, #cdeedf)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<clipPath id="bounds"><rect width="720" height="420" rx="0"/></clipPath></defs>
<g clip-path="url(#bounds)"><rect width="720" height="420" fill="var(--color-surface, #ffffff)"/><ellipse cx="510" cy="345" rx="450" ry="380" fill="url(#blue-haze)"/><ellipse cx="550" cy="375" rx="300" ry="290" fill="url(#violet-haze)" opacity=".45"/><rect width="720" height="420" filter="url(#grain)" opacity=".025"/><text x="56" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-ink-secondary, #525252)" >Audit</text><text x="56" y="190" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-ink-secondary, #525252)" >Map</text><text x="56" y="226" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-ink-secondary, #525252)" >Optimize</text><text x="56" y="262" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-ink-secondary, #525252)" >Verify</text><g transform="translate(493 27) skewY(25)"><rect x="0" y="0" width="151" height="191" rx="8" fill="url(#blue-glass)" stroke="var(--color-stage-sky, #d2e2f8)" stroke-width="1.4" opacity=".93"/><path d="M18 21 H107 M18 29 H84" fill="none" stroke="var(--color-surface, #ffffff)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><rect x="22" y="50" width="107" height="104" rx="4" fill="none" stroke="var(--color-surface, #ffffff)" stroke-width="1.4" /><path d="M35 69 h53 m-53 15 h79 m-79 15 h64 m-64 15 h70" fill="none" stroke="var(--color-surface, #ffffff)" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(411 64) skewY(25)"><rect x="0" y="0" width="151" height="191" rx="8" fill="url(#blue-glass)" stroke="var(--color-stage-sky, #d2e2f8)" stroke-width="1.4" opacity=".93"/><path d="M18 21 H107 M18 29 H84" fill="none" stroke="var(--color-surface, #ffffff)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><rect x="22" y="50" width="107" height="104" rx="4" fill="none" stroke="var(--color-surface, #ffffff)" stroke-width="1.4" /><path d="M35 69 h53 m-53 15 h79 m-79 15 h64 m-64 15 h70" fill="none" stroke="var(--color-surface, #ffffff)" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(329 102) skewY(25)"><rect x="0" y="0" width="151" height="191" rx="8" fill="url(#blue-glass)" stroke="var(--color-stage-sky, #d2e2f8)" stroke-width="1.4" opacity=".93"/><path d="M18 21 H107 M18 29 H84" fill="none" stroke="var(--color-surface, #ffffff)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><rect x="22" y="50" width="107" height="104" rx="4" fill="none" stroke="var(--color-surface, #ffffff)" stroke-width="1.4" /><path d="M35 69 h53 m-53 15 h79 m-79 15 h64 m-64 15 h70" fill="none" stroke="var(--color-surface, #ffffff)" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(247 140) skewY(25)"><rect x="0" y="0" width="151" height="191" rx="8" fill="url(#blue-glass)" stroke="var(--color-stage-sky, #d2e2f8)" stroke-width="1.4" opacity=".93"/><path d="M18 21 H107 M18 29 H84" fill="none" stroke="var(--color-surface, #ffffff)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><circle cx="67" cy="92" r="22" fill="var(--color-surface, #ffffff)" stroke="var(--color-line-control, #858585)" stroke-width="3"/><path d="M83 110 l22 24" fill="none" stroke="var(--color-line-control, #858585)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="t d">
<title id="t">Buyer prompt generation illustration</title>
<desc id="d">Stacked buyer-question cards, some accepted, one flagged and one rejected, with Map, Generate, Judge, Review labels.</desc>
<style>
  .label { font: 400 24px Arial, Helvetica, sans-serif; fill: var(--color-ink-secondary, #525252); }
  .card { stroke: var(--color-stage-sky, #d2e2f8); stroke-width: 1.4; }
  .line { fill: none; stroke: var(--color-surface, #ffffff); stroke-linecap: round; }
  .link { fill: none; stroke-linecap: round; }
</style>
<defs>
  <radialGradient id="glow" cx=".7" cy=".8" r=".75">
    <stop offset="0" stop-color="var(--color-stage-sky, #d2e2f8)" stop-opacity=".5"/>
    <stop offset=".6" stop-color="var(--color-positive-soft, #d6f2ef)" stop-opacity=".3"/>
    <stop offset="1" stop-color="var(--color-surface, #ffffff)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="pane-blue" x2="1" y2="1">
    <stop offset="0" stop-color="var(--color-surface, #ffffff)"/>
    <stop offset="1" stop-color="var(--color-stage-sky, #d2e2f8)"/>
  </linearGradient>
  <linearGradient id="pane-green" x2="1" y2="1">
    <stop offset="0" stop-color="var(--color-surface, #ffffff)"/>
    <stop offset="1" stop-color="var(--color-positive-soft, #d6f2ef)"/>
  </linearGradient>
  <linearGradient id="pane-violet" x2="1" y2="1">
    <stop offset="0" stop-color="var(--color-surface, #ffffff)"/>
    <stop offset="1" stop-color="var(--color-info-soft, #e3edfc)"/>
  </linearGradient>
  <linearGradient id="ok" x2="1" y2="1">
    <stop offset="0" stop-color="var(--color-positive, #0b6e69)"/>
    <stop offset="1" stop-color="var(--color-positive, #0b6e69)"/>
  </linearGradient>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="var(--color-ink-secondary, #525252)" flood-opacity=".08"/>
  </filter>
  <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M2 1 L7 5 L2 9" fill="none" stroke="var(--color-stage-mint, #cdeedf)" stroke-width="1.4" stroke-linecap="round"/>
  </marker>
</defs>
<rect width="720" height="420" fill="var(--color-surface, #ffffff)"/>
<rect width="720" height="420" fill="url(#glow)"/>
  <text x="56" y="154" class="label">Map</text>
  <text x="56" y="190" class="label">Generate</text>
  <text x="56" y="226" class="label">Judge</text>
  <text x="56" y="262" class="label">Review</text>
<g transform="translate(300 70)" filter="url(#lift)"><rect width="190" height="54" rx="10" class="card" fill="url(#pane-blue)"/><path class="line" stroke-width="2" d="M18 22 H150 M18 34 H118"/><circle cx="168" cy="27" r="11" fill="url(#ok)"/><path class="line" stroke-width="2" d="M162 27 l4 4 l8 -8"/></g>
<g transform="translate(360 142)" filter="url(#lift)"><rect width="190" height="54" rx="10" class="card" fill="url(#pane-violet)"/><path class="line" stroke-width="2" d="M18 22 H150 M18 34 H118"/><circle cx="168" cy="27" r="11" fill="var(--color-warning-soft, #fff0d1)"/><path d="M168 21 v8 m0 4 v1" stroke="var(--color-warning, #8a5000)" stroke-width="2.2" stroke-linecap="round"/></g>
<g transform="translate(420 214)" filter="url(#lift)"><rect width="190" height="54" rx="10" class="card" fill="url(#pane-green)"/><path class="line" stroke-width="2" d="M18 22 H150 M18 34 H118"/><circle cx="168" cy="27" r="11" fill="url(#ok)"/><path class="line" stroke-width="2" d="M162 27 l4 4 l8 -8"/></g>
<g transform="translate(360 286)" filter="url(#lift)"><rect width="190" height="54" rx="10" class="card" fill="url(#pane-blue)"/><path class="line" stroke-width="2" d="M18 22 H150 M18 34 H118"/><circle cx="168" cy="27" r="11" fill="var(--color-surface-sunken, #ececec)"/><path d="M163 22 l10 10 m0 -10 l-10 10" stroke="var(--color-line-control, #858585)" stroke-width="2" stroke-linecap="round"/></g>
<path class="link" stroke="var(--color-stage-mint, #cdeedf)" stroke-width="1.6" d="M252 97 H296" marker-end="url(#tip)"/>
</svg>

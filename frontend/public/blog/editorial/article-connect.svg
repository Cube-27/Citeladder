<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Connected evidence illustration</title><desc id="desc">Website, Content and Sources feed into an illustrative AI answer with citation markers.</desc>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--color-surface, #ffffff)" stop-opacity=".98"/><stop offset="1" stop-color="var(--color-paper, #f4f4f4)" stop-opacity=".84"/></linearGradient>
<linearGradient id="blue-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--color-surface, #ffffff)" stop-opacity=".93"/><stop offset=".52" stop-color="var(--color-info-soft, #e3edfc)" stop-opacity=".84"/><stop offset="1" stop-color="var(--color-stage-sky, #d2e2f8)" stop-opacity=".82"/></linearGradient>
<linearGradient id="green-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--color-surface, #ffffff)" stop-opacity=".96"/><stop offset="1" stop-color="var(--color-positive-soft, #d6f2ef)" stop-opacity=".88"/></linearGradient>
<linearGradient id="violet-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--color-surface, #ffffff)" stop-opacity=".96"/><stop offset="1" stop-color="var(--color-info-soft, #e3edfc)" stop-opacity=".87"/></linearGradient>
<linearGradient id="execute" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--color-positive, #0b6e69)"/><stop offset=".58" stop-color="var(--color-positive, #0b6e69)"/><stop offset="1" stop-color="var(--color-positive, #0b6e69)"/></linearGradient>
<radialGradient id="blue-haze"><stop stop-color="var(--color-stage-sky, #d2e2f8)" stop-opacity=".38"/><stop offset="1" stop-color="var(--color-info-soft, #e3edfc)" stop-opacity="0"/></radialGradient>
<radialGradient id="green-haze"><stop stop-color="var(--color-stage-mint, #cdeedf)" stop-opacity=".38"/><stop offset="1" stop-color="var(--color-paper, #f4f4f4)" stop-opacity="0"/></radialGradient>
<radialGradient id="violet-haze"><stop stop-color="var(--color-stage-lilac, #dfd6f7)" stop-opacity=".43"/><stop offset="1" stop-color="var(--color-info-soft, #e3edfc)" stop-opacity="0"/></radialGradient>
<linearGradient id="blue-area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="var(--color-info, #1f5fbf)" stop-opacity=".15"/><stop offset="1" stop-color="var(--color-positive-soft, #d6f2ef)" stop-opacity="0"/></linearGradient>
<linearGradient id="green-area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="var(--color-positive, #0b6e69)" stop-opacity=".15"/><stop offset="1" stop-color="var(--color-stage-mint, #cdeedf)" stop-opacity="0"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="var(--color-ink-secondary, #525252)" flood-opacity=".07"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M3 2 L7 6 L3 10" fill="none" stroke="var(--color-stage-mint, #cdeedf)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<clipPath id="bounds"><rect width="720" height="420" rx="0"/></clipPath></defs>
<g clip-path="url(#bounds)"><rect width="720" height="420" fill="var(--color-surface, #ffffff)"/><ellipse cx="585" cy="290" rx="350" ry="340" fill="url(#blue-haze)"/><ellipse cx="180" cy="390" rx="350" ry="250" fill="url(#green-haze)"/><rect width="720" height="420" filter="url(#grain)" opacity=".025"/><path d="M242 96 H309 V210 H411" fill="none" stroke="var(--color-positive-soft, #d6f2ef)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M242 210 H309 V210 H411" fill="none" stroke="var(--color-positive-soft, #d6f2ef)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M242 324 H309 V210 H411" fill="none" stroke="var(--color-positive-soft, #d6f2ef)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="55" width="194" height="82" rx="10" fill="url(#paper)" stroke="var(--color-surface-sunken, #ececec)" stroke-width="1.4" filter="url(#shadow)"/><rect x="70" y="77" width="25" height="33" rx="3" fill="none" stroke="var(--color-line-control, #858585)" stroke-width="1.4" /><path d="M76 88 h13 m-13 7 h13" fill="none" stroke="var(--color-line-control, #858585)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><text x="109" y="104" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-ink-secondary, #525252)" >Website</text><rect x="48" y="169" width="194" height="82" rx="10" fill="url(#paper)" stroke="var(--color-surface-sunken, #ececec)" stroke-width="1.4" filter="url(#shadow)"/><rect x="70" y="191" width="25" height="33" rx="3" fill="none" stroke="var(--color-line-control, #858585)" stroke-width="1.4" /><path d="M76 202 h13 m-13 7 h13" fill="none" stroke="var(--color-line-control, #858585)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><text x="109" y="218" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-ink-secondary, #525252)" >Content</text><rect x="48" y="283" width="194" height="82" rx="10" fill="url(#paper)" stroke="var(--color-surface-sunken, #ececec)" stroke-width="1.4" filter="url(#shadow)"/><rect x="70" y="305" width="25" height="33" rx="3" fill="none" stroke="var(--color-line-control, #858585)" stroke-width="1.4" /><path d="M76 316 h13 m-13 7 h13" fill="none" stroke="var(--color-line-control, #858585)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><text x="109" y="332" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-ink-secondary, #525252)" >Sources</text><rect x="284" y="191" width="51" height="38" rx="7" fill="var(--color-paper, #f4f4f4)" stroke="var(--color-positive-soft, #d6f2ef)" stroke-width="1.4" /><path d="M299 205 h12 m-12 10 h21" fill="none" stroke="var(--color-line-control, #858585)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="411" y="81" width="263" height="260" rx="10" fill="url(#paper)" stroke="var(--color-info-soft, #e3edfc)" stroke-width="1.4" filter="url(#shadow)"/><text x="438" y="125" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="var(--color-ink-secondary, #525252)" >AI answer</text><path d="M439 158 h189" fill="none" stroke="var(--color-info-soft, #e3edfc)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M439 173 h163" fill="none" stroke="var(--color-info-soft, #e3edfc)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M439 188 h180" fill="none" stroke="var(--color-info-soft, #e3edfc)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M439 219 h167" fill="none" stroke="var(--color-info-soft, #e3edfc)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M439 234 h141" fill="none" stroke="var(--color-info-soft, #e3edfc)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="439" y="272" width="37" height="30" rx="5" fill="var(--color-positive-soft, #d6f2ef)" stroke="var(--color-positive-soft, #d6f2ef)" stroke-width="1.4" /><text x="457.5" y="293" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="var(--color-positive, #0b6e69)" text-anchor="middle" >1</text><rect x="491" y="272" width="37" height="30" rx="5" fill="var(--color-positive-soft, #d6f2ef)" stroke="var(--color-positive-soft, #d6f2ef)" stroke-width="1.4" /><text x="509.5" y="293" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="var(--color-positive, #0b6e69)" text-anchor="middle" >2</text><rect x="543" y="272" width="37" height="30" rx="5" fill="var(--color-positive-soft, #d6f2ef)" stroke="var(--color-positive-soft, #d6f2ef)" stroke-width="1.4" /><text x="561.5" y="293" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="var(--color-positive, #0b6e69)" text-anchor="middle" >3</text></g></svg>
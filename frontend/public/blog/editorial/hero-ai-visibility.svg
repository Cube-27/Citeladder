<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="title desc">
<title id="title">AI visibility editorial illustration</title><desc id="desc">Three translucent cards: Find opportunities, Create better content, Get cited more often.</desc>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".98"/><stop offset="1" stop-color="#F4F9FC" stop-opacity=".84"/></linearGradient>
<linearGradient id="blue-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFDFF" stop-opacity=".93"/><stop offset=".52" stop-color="#EFF5FF" stop-opacity=".84"/><stop offset="1" stop-color="#CEE0FF" stop-opacity=".82"/></linearGradient>
<linearGradient id="green-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9FEFC" stop-opacity=".96"/><stop offset="1" stop-color="#DAF1EB" stop-opacity=".88"/></linearGradient>
<linearGradient id="violet-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".96"/><stop offset="1" stop-color="#EDEDFD" stop-opacity=".87"/></linearGradient>
<linearGradient id="execute" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#86DDBA"/><stop offset=".58" stop-color="#43C797"/><stop offset="1" stop-color="#28B782"/></linearGradient>
<radialGradient id="blue-haze"><stop stop-color="#B7D4F9" stop-opacity=".38"/><stop offset="1" stop-color="#EFF7FF" stop-opacity="0"/></radialGradient>
<radialGradient id="green-haze"><stop stop-color="#AEE0CD" stop-opacity=".38"/><stop offset="1" stop-color="#F1FAF8" stop-opacity="0"/></radialGradient>
<radialGradient id="violet-haze"><stop stop-color="#CED4FB" stop-opacity=".43"/><stop offset="1" stop-color="#F4F5FF" stop-opacity="0"/></radialGradient>
<linearGradient id="blue-area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7BCCF3" stop-opacity=".15"/><stop offset="1" stop-color="#C9E9F6" stop-opacity="0"/></linearGradient>
<linearGradient id="green-area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#63CFA5" stop-opacity=".15"/><stop offset="1" stop-color="#BCE7D8" stop-opacity="0"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#526D93" flood-opacity=".07"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M3 2 L7 6 L3 10" fill="none" stroke="#A9D7C8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<clipPath id="bounds"><rect width="840" height="420" rx="0"/></clipPath></defs>
<g clip-path="url(#bounds)"><ellipse cx="419" cy="249" rx="365" ry="199" fill="url(#blue-haze)" opacity=".7"/><ellipse cx="394" cy="241" rx="231" ry="178" fill="url(#green-haze)" opacity=".48"/><ellipse cx="666" cy="273" rx="225" ry="160" fill="url(#violet-haze)" opacity=".75"/><g transform="rotate(-10 191 263)"><rect x="76" y="145" width="230" height="236" rx="8" fill="url(#blue-glass)" stroke="#BEDAFF" stroke-width="1.4" filter="url(#shadow)"/><path d="M108 183 h21 m-21 8 h35 m-35 8 h27" fill="none" stroke="#75A3DE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><text x="108" y="244" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#5E91D7" >Find</text><text x="108" y="278" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#5E91D7" >opportunities</text></g><g transform="rotate(-14 626 236)"><rect x="507" y="108" width="238" height="256" rx="8" fill="url(#violet-glass)" stroke="#D6DBF7" stroke-width="1.4" filter="url(#shadow)"/><path d="M550 184 l31 -31 M550 153 h31 v31" fill="none" stroke="#A89CEF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" /><text x="539" y="234" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#5950B8" >Get cited</text><text x="539" y="268" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#5950B8" >more often</text></g><g transform="rotate(-10 411 188)"><rect x="295" y="53" width="232" height="270" rx="8" fill="url(#green-glass)" stroke="#B9E4DD" stroke-width="1.4" filter="url(#shadow)"/><path d="M342 127 v20 M354 116 v31 M366 103 v44" fill="none" stroke="#589991" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" /><text x="332" y="191" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#1E5F61" >Create better</text><text x="332" y="225" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#1E5F61" >content</text></g></g></svg>
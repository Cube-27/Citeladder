<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="t d">
<title id="t">Internal linking illustration</title>
<desc id="d">A hub page linked to supporting pages with arrows, with Retrieve, Judge, Review, Verify labels.</desc>
<style>
  .label { font: 400 24px Arial, Helvetica, sans-serif; fill: #617089; }
  .page { stroke: #D2E6E4; stroke-width: 1.3; }
  .text { fill: none; stroke: #FFFFFF; stroke-linecap: round; }
  .edge { fill: none; stroke-linecap: round; }
</style>
<defs>
  <radialGradient id="haze" cx=".62" cy=".55" r=".7">
    <stop offset="0" stop-color="#BFE6DA" stop-opacity=".45"/>
    <stop offset=".6" stop-color="#D6E6FA" stop-opacity=".28"/>
    <stop offset="1" stop-color="#F8FAFC" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hub" y2="1">
    <stop offset="0" stop-color="#FCFDFF"/>
    <stop offset="1" stop-color="#CFE0FA"/>
  </linearGradient>
  <linearGradient id="spoke-a" y2="1">
    <stop offset="0" stop-color="#FAFEFC"/>
    <stop offset="1" stop-color="#CBEEDF"/>
  </linearGradient>
  <linearGradient id="spoke-b" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#DDEFF7"/>
  </linearGradient>
  <filter id="raise" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#3F7A73" flood-opacity=".09"/>
  </filter>
  <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M2 1 L7 5 L2 9" fill="none" stroke="#5EBE9C" stroke-width="1.5" stroke-linecap="round"/>
  </marker>
</defs>
<rect width="720" height="420" fill="#F8FAFC"/>
<rect width="720" height="420" fill="url(#haze)"/>
  <text x="56" y="154" class="label">Retrieve</text>
  <text x="56" y="190" class="label">Judge</text>
  <text x="56" y="226" class="label">Review</text>
  <text x="56" y="262" class="label">Verify</text>
<g transform="translate(400 40)" filter="url(#raise)"><rect width="120" height="150" rx="8" class="page" fill="url(#hub)"/><path class="text" stroke-width="1.8" d="M16 22 H90 M16 32 H72"/><path class="text" stroke-width="1.5" d="M16 60 h80 m-80 14 h66 m-66 14 h74 m-74 14 h52"/></g>
<g transform="translate(270 230)" filter="url(#raise)"><rect width="120" height="150" rx="8" class="page" fill="url(#spoke-a)"/><path class="text" stroke-width="1.8" d="M16 22 H90 M16 32 H72"/><path class="text" stroke-width="1.5" d="M16 60 h80 m-80 14 h66 m-66 14 h74 m-74 14 h52"/></g>
<g transform="translate(530 230)" filter="url(#raise)"><rect width="120" height="150" rx="8" class="page" fill="url(#spoke-b)"/><path class="text" stroke-width="1.8" d="M16 22 H90 M16 32 H72"/><path class="text" stroke-width="1.5" d="M16 60 h80 m-80 14 h66 m-66 14 h74 m-74 14 h52"/></g>
<path class="edge" stroke="#6FC9A7" stroke-width="2" d="M430 192 C 400 210, 370 215, 345 226" marker-end="url(#head)"/>
<path class="edge" stroke="#6FC9A7" stroke-width="2" d="M490 192 C 520 210, 550 215, 575 226" marker-end="url(#head)"/>
<path class="edge" stroke="#A9B8D6" stroke-width="1.6" stroke-dasharray="5 6" d="M392 300 H524" marker-end="url(#head)"/>
</svg>

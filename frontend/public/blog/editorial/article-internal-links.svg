<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Internal linking illustration</title><desc id="desc">A hub page linked to supporting pages with arrows, with Retrieve, Judge, Review, Verify labels.</desc>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".98"/><stop offset="1" stop-color="#F4F9FC" stop-opacity=".84"/></linearGradient>
<linearGradient id="blue-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFDFF" stop-opacity=".93"/><stop offset=".52" stop-color="#EFF5FF" stop-opacity=".84"/><stop offset="1" stop-color="#CEE0FF" stop-opacity=".82"/></linearGradient>
<linearGradient id="green-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9FEFC" stop-opacity=".96"/><stop offset="1" stop-color="#DAF1EB" stop-opacity=".88"/></linearGradient>
<linearGradient id="violet-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".96"/><stop offset="1" stop-color="#EDEDFD" stop-opacity=".87"/></linearGradient>
<linearGradient id="execute" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#86DDBA"/><stop offset=".58" stop-color="#43C797"/><stop offset="1" stop-color="#28B782"/></linearGradient>
<radialGradient id="blue-haze"><stop stop-color="#B7D4F9" stop-opacity=".38"/><stop offset="1" stop-color="#EFF7FF" stop-opacity="0"/></radialGradient>
<radialGradient id="green-haze"><stop stop-color="#AEE0CD" stop-opacity=".38"/><stop offset="1" stop-color="#F1FAF8" stop-opacity="0"/></radialGradient>
<radialGradient id="violet-haze"><stop stop-color="#CED4FB" stop-opacity=".43"/><stop offset="1" stop-color="#F4F5FF" stop-opacity="0"/></radialGradient>
<linearGradient id="blue-area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7BCCF3" stop-opacity=".15"/><stop offset="1" stop-color="#C9E9F6" stop-opacity="0"/></linearGradient>
<linearGradient id="green-area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#63CFA5" stop-opacity=".15"/><stop offset="1" stop-color="#BCE7D8" stop-opacity="0"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#526D93" flood-opacity=".07"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M3 2 L7 6 L3 10" fill="none" stroke="#A9D7C8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<clipPath id="bounds"><rect width="720" height="420" rx="0"/></clipPath></defs>
<g clip-path="url(#bounds)"><rect width="720" height="420" fill="#F8FAFC"/><ellipse cx="510" cy="345" rx="450" ry="380" fill="url(#blue-haze)"/><ellipse cx="550" cy="375" rx="300" ry="290" fill="url(#green-haze)" opacity=".5"/><rect width="720" height="420" filter="url(#grain)" opacity=".025"/><text x="56" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#617089" >Retrieve</text><text x="56" y="190" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#617089" >Judge</text><text x="56" y="226" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#617089" >Review</text><text x="56" y="262" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#617089" >Verify</text><g transform="translate(400 40)" filter="url(#shadow)"><rect width="120" height="150" rx="8" fill="url(#blue-glass)" stroke="#DAE7FD" stroke-width="1.4"/><path d="M16 22 H90 M16 32 H72" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/><path d="M16 60 h80 m-80 14 h66 m-66 14 h74 m-74 14 h52" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/></g><g transform="translate(270 230)" filter="url(#shadow)"><rect width="120" height="150" rx="8" fill="url(#green-glass)" stroke="#DAE7FD" stroke-width="1.4"/><path d="M16 22 H90 M16 32 H72" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/><path d="M16 60 h80 m-80 14 h66 m-66 14 h74 m-74 14 h52" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/></g><g transform="translate(530 230)" filter="url(#shadow)"><rect width="120" height="150" rx="8" fill="url(#violet-glass)" stroke="#DAE7FD" stroke-width="1.4"/><path d="M16 22 H90 M16 32 H72" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/><path d="M16 60 h80 m-80 14 h66 m-66 14 h74 m-74 14 h52" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/></g><path d="M430 192 C 400 210, 370 215, 345 226" fill="none" stroke="#6FC9A7" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M490 192 C 520 210, 550 215, 575 226" fill="none" stroke="#6FC9A7" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M392 300 H 524" fill="none" stroke="#A9B8D6" stroke-width="1.6" stroke-dasharray="5 6" marker-end="url(#arrow)"/></g></svg>

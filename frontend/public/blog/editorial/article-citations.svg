<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">AI citation source illustration</title><desc id="desc">One generated answer fanning out to three kinds of cited source: an owned page, a competitor, and a third party. The owned page is highlighted in soft green. Contains no measured values or performance claims.</desc>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".98"/><stop offset="1" stop-color="#F4F9FC" stop-opacity=".84"/></linearGradient>
<linearGradient id="blue-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFDFF" stop-opacity=".93"/><stop offset=".52" stop-color="#EFF5FF" stop-opacity=".84"/><stop offset="1" stop-color="#CEE0FF" stop-opacity=".82"/></linearGradient>
<linearGradient id="execute" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#86DDBA"/><stop offset=".58" stop-color="#43C797"/><stop offset="1" stop-color="#28B782"/></linearGradient>
<radialGradient id="blue-haze"><stop stop-color="#B7D4F9" stop-opacity=".38"/><stop offset="1" stop-color="#EFF7FF" stop-opacity="0"/></radialGradient>
<radialGradient id="green-haze"><stop stop-color="#AEE0CD" stop-opacity=".38"/><stop offset="1" stop-color="#F1FAF8" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#526D93" flood-opacity=".07"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M3 2 L7 6 L3 10" fill="none" stroke="#A9D7C8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<clipPath id="bounds"><rect width="720" height="420" rx="0"/></clipPath></defs>
<g clip-path="url(#bounds)"><rect width="720" height="420" fill="#F8FAFC"/><ellipse cx="360" cy="70" rx="380" ry="230" fill="url(#blue-haze)" opacity=".3"/><ellipse cx="200" cy="360" rx="330" ry="250" fill="url(#green-haze)" opacity=".7"/><rect width="720" height="420" filter="url(#grain)" opacity=".025"/><path d="M318 142 C 264 178, 200 206, 148 240" fill="none" stroke="#A9D7C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M360 142 V 244" fill="none" stroke="#A9D7C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M402 142 C 456 178, 520 206, 572 240" fill="none" stroke="#A9D7C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="257" y="48" width="206" height="88" rx="11" fill="url(#blue-glass)" stroke="#D8E4F2" stroke-width="1.4" filter="url(#shadow)"/><text x="360" y="101" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#3E5360" text-anchor="middle" >Answer</text><rect x="50" y="250" width="180" height="92" rx="11" fill="url(#execute)" stroke="#60C7A0" stroke-width="1.4" filter="url(#shadow)"/><text x="140" y="304" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#FFFFFF" text-anchor="middle" >Owned page</text><rect x="270" y="250" width="180" height="92" rx="11" fill="url(#paper)" stroke="#DFEBE9" stroke-width="1.4" filter="url(#shadow)"/><text x="360" y="304" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#3E5360" text-anchor="middle" >Competitor</text><rect x="490" y="250" width="180" height="92" rx="11" fill="url(#paper)" stroke="#DFEBE9" stroke-width="1.4" filter="url(#shadow)"/><text x="580" y="304" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#3E5360" text-anchor="middle" >Third party</text></g></svg>

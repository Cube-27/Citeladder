allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

# Supply-chain hardening: refuse packages whose trust signals (provenance,
# signatures) weaken between updates.
#
# NOTE: `minimumReleaseAge` (a 7-day quarantine on freshly published versions)
# was removed at the maintainer's request. pnpm 11 defaults this setting to one
# day, so keep the immediate-install decision explicit.
minimumReleaseAge: 0
trustPolicy: no-downgrade
# Skip the downgrade check for releases older than ~1 year — they predate
# widespread provenance publishing and trip the check for benign reasons.
# Anything newer must keep (or strengthen) its trust evidence.
trustPolicyIgnoreAfter: 525600
# Pinned exceptions (currently none): recent versions that trip the downgrade
# check for benign reasons, e.g. a release published without provenance while
# earlier ones had it. Reviewed individually; keep this list short and exact,
# and delete an entry as soon as the resolved tree no longer contains it.

# Keep transitive PostCSS consumers on the patched line for CVE-2026-41305.
# pnpm 10+ reads overrides here, not from package.json.
overrides:
  postcss: '>=8.5.10'
  # Migrated from the `pnpm.overrides` field in package.json, which pnpm 11 no
  # longer reads (it was being silently ignored). Keeps the React type packages
  # pinned to a single version across the tree.
  '@types/react': '19.2.18'
  '@types/react-dom': '19.2.5'
  # Force Astro's transitive sharp off the vulnerable libvips line
  # (GHSA-f88m-g3jw-g9cj: CVE-2026-33327/33328/35590/35591, fixed in sharp
  # 0.35.0). Remove this override once every owning range requires >=0.35.
  sharp: '^0.35.3'
  # Vite+ toolchain overrides, keyed with the explicit `@*` ranges that `vp
  # migrate` uses for managed keys. The catalog below holds the actual pins;
  # bump them together with the vite-plus dependency.
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
# Single-source pins for the Vite+ toolchain (referenced by package.json
# through `catalog:` and by the overrides above). `vite` aliases the Vite+
# core so every consumer — including Astro's transitive vite and
# @vitejs/plugin-react's peer — shares one Vite type family; `pnpm build`
# (marketing) must be re-verified when bumping this pin. `vitest` stays at
# the exact version vite-plus bundles so there is exactly one Vitest copy.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vitest: 4.1.11
  vite-plus: 0.3.1
  '@vitest/coverage-v8': 4.1.11
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
